<script>const D={"id": "qc54512d439", "date": "2026-10-15", "type": "LR", "level": 1, "qs": [{"id": "V-syllogism-17", "q": "Statements: All pens are books. All books are bags.\nConclusions:\nI. Some bags are pens.\nII. All books are pens.\nWhich conclusion follows?", "o": ["Both follow", "Neither follows", "Only I follows", "Only II follows"], "a": 2, "x": "A conclusion follows only if it is true in every possible picture of the statements. I holds in every picture; for II a picture exists where it fails.", "cn": "A conclusion follows only if it is true in every possible picture, not just in one. \"Some A are B\" can be reversed; \"All A are B\" cannot.", "sl": "Original variant of a concept (new items and wording)", "t": "Syllogism"}, {"id": "V-calendar_days-17", "q": "Today is Sunday. What day of the week will it be after 45 days?", "o": ["Saturday", "Tuesday", "Friday", "Wednesday"], "a": 3, "x": "A week has 7 days, so only the remainder matters. 45 = 6 x 7 + 3, so move 3 day(s) forward from Sunday: Wednesday.", "cn": "Divide the number of days by 7; only the remainder moves the day forward.", "sl": "Original variant of a concept (new items and wording)", "t": "Calendar (days of the week)"}, {"id": "V-ordering_comparison-17", "q": "Gita is taller than Dev. Asha is shorter than Dev. Bilal is shorter than Asha. Who is the shortest?", "o": ["Gita", "Bilal", "Dev", "Asha"], "a": 1, "x": "From the statements: Gita > Dev > Asha > Bilal (tallest to shortest). The shortest is Bilal.", "cn": "Chain the comparisons into one line from tallest to shortest, then read off the end you need.", "sl": "Original variant of a concept (new items and wording)", "t": "Ranking and ordering (comparisons)"}, {"id": "V-letter_series_skip-17", "q": "What comes next in the series E, I, M, Q, ?", "o": ["U", "T", "Y", "V"], "a": 0, "x": "Each letter moves 4 places forward: E to I to M to Q to U.", "cn": "Convert letters to positions (A=1, B=2, ...) and look for the gap between terms.", "sl": "Original variant of a concept (new items and wording)", "t": "Letter series (skip pattern)"}, {"id": "V-seating_arrangement-17", "q": "Five friends A, B, C, D, F sit in a row facing north. C sits at the left end. F sits at the right end. D and F do not sit next to each other. B and D sit next to each other. C and D sit next to each other. Who sits in the middle?", "o": ["C", "B", "D", "A"], "a": 1, "x": "Place the fixed clues first, then fit the rest. The only arrangement that works, from left to right, is C D B A F, so B sits in the middle.", "cn": "Start with the clues that fix a place (ends, 'immediately left of') and then use the others to rule out the rest. Facing north, left is west.", "sl": "Original variant of a concept (new items and wording)", "t": "Seating arrangement"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
