<h1>Logic practice q0f4cf5f5bf</h1><p>5 questions &middot; level L1 &middot; about 10 to 15 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>

<script>const D={"id": "q0f4cf5f5bf", "date": "2026-10-16", "type": "LR", "level": 1, "qs": [{"id": "V-syllogism-19", "q": "Statements: All cats are animals. No pets are animals. (Every group named has at least one member.)\nConclusions:\nI. No cats are pets.\nII. Some animals are cats.\nWhich conclusion follows?", "o": ["Only II follows", "Only I follows", "Neither follows", "Both follow"], "a": 3, "x": "A conclusion follows only if it is true in every possible picture of the statements, taking each named group to have at least one member. Checking both, each is forced by the statements.", "cn": "A conclusion follows only if it is true in every possible picture, not just in one. \"Some A are B\" can be reversed; \"All A are B\" cannot.", "sl": "Original variant of a concept (new items and wording)", "t": "Syllogism"}, {"id": "V-interchange_signs_numbers-19", "q": "Given interchanges: signs + and - and numbers 9 and 8. Which equation would be correct?", "o": ["8 - 9 + 4 = 13", "8 + 8 - 4 = 12", "9 + 9 - 2 = 5", "9 - 9 + 5 = 6"], "a": 0, "x": "After swapping, the left sides are 9+8-4 = 13 (option says 13), 9-9+4 = 4 (option says 12), 8-8+2 = 2 (option says 5), 8+8-5 = 11 (option says 6). Only 8-9+4=13 matches.", "cn": "Swap the signs and numbers named in the question first, then work out each option's left side with the usual order of operations and compare with its right side.", "sl": "Original variant of a concept (new items and wording)", "t": "Interchange of signs and numbers"}, {"id": "V-count_squares-19", "q": "How many squares of all sizes are there in a 6 x 6 square grid (made of 36 small unit squares)?", "o": ["85", "36", "91", "97"], "a": 2, "x": "Squares of side k number (6-k+1)^2. Adding for k = 1 to 6: 36 + 25 + 16 + 9 + 4 + 1 = 91.", "cn": "Count squares of each side length separately: side k fits (n - k + 1)^2 times. Then add.", "sl": "Original variant of a concept (new items and wording)", "t": "Counting figures (squares in a grid)"}, {"id": "V-clock_angle-19", "q": "What is the angle between the hour hand and the minute hand of a clock at 4:00?", "o": ["90 degrees", "135 degrees", "120 degrees", "150 degrees"], "a": 2, "x": "The hour hand is at 120 degrees from 12 (30 per hour, 0.5 per minute) and the minute hand is at 0 degrees. The difference is 120; the smaller angle is 120 degrees.", "cn": "Hour hand: 30 degrees per hour plus 0.5 per minute. Minute hand: 6 degrees per minute. Take the smaller angle.", "sl": "Original variant of a concept (new items and wording)", "t": "Clock (angle between hands)"}, {"id": "RS-reasoning-b067-q44", "q": "Find the missing number. The grid is given row by row (top to bottom); one rule links the numbers in each row.\n6  11  25\n8  6  16\n12  5  ?", "o": ["18", "16", "12", "10"], "a": 1, "x": "In each complete row, 3rd = 2 x 2nd + (1st)/2: 2x11+3 = 25, 2x6+4 = 16, so ? = 2x5+6 = 16.", "cn": "Find one rule that works on every complete row (try sums, multiples, and a weighted sum), then apply it to the row with the missing number.", "sl": "R S Aggarwal Verbal and Non-Verbal Reasoning, Inserting the Missing Character, Exercise 15 Q44 (book p.483, Reprint 2007; grid typed out as text, options as printed; explanation derived independently, not the book's working)", "t": "Missing number (grid)"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};

</script></body></html>
