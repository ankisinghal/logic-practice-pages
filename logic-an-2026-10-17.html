<script>const D={"id": "q2b9e06b78e", "date": "2026-10-17", "type": "LR", "level": 1, "qs": [{"id": "V-seating_arrangement-20", "q": "Five friends A, C, D, E, F sit in a row facing north. C and F sit next to each other. D and E sit next to each other. F sits immediately to the left of C. D sits immediately to the left of A. F sits at the left end. Who sits at the right end?", "o": ["C", "D", "A", "E"], "a": 2, "x": "Place the fixed clues first, then fit the rest. The only arrangement that works, from left to right, is F C E D A, so A sits at the right end.", "cn": "Start with the clues that fix a place (ends, 'immediately left of') and then use the others to rule out the rest. Facing north, left is west.", "sl": "Original variant of a concept (new items and wording)", "t": "Seating arrangement"}, {"id": "V-blood_relations-21", "q": "M is the son of N. N is the wife of O. O is the father of all of N's children. How is M related to O?", "o": ["son", "daughter", "father", "brother"], "a": 0, "x": "M is N's son, so M is one of N's children. O is the father of all of N's children, so O is M's father: M is O's son.", "cn": "Work one link at a time from the person the question asks about. Brother or sister means the same parents; use only the parent links the question states.", "sl": "Original variant of a concept (new items and wording)", "t": "Blood relations"}, {"id": "V-number_analogy-22", "q": "Find the missing number: 6 : 37 :: 8 : ?", "o": ["63", "65", "73", "64"], "a": 1, "x": "37 is 6 squared plus 1, so the answer is 8 squared plus 1 = 65.", "cn": "Find the rule that turns the first number into the second, then apply the same rule to the third.", "sl": "Original variant of a concept (new items and wording)", "t": "Analogy (number pairs)"}, {"id": "V-inequality_relation-23", "q": "Statements: T > S, S > P, P > M. Which of the following is definitely true?", "o": ["P > T", "T > P", "S = T", "M > S"], "a": 1, "x": "From T > S and S > P and P > M, combining step by step gives T > P. The other options each contradict the statements.", "cn": "Chain the relations through the shared letter. Combine two at a time, and remember '=' passes every relation through unchanged.", "sl": "Original variant of a concept (new items and wording)", "t": "Inequality statements"}, {"id": "V-dice_views-24", "q": "A die is thrown twice and its faces carry the numbers 1 to 6, one number per face. In the first throw the top face shows 3, the face facing you shows 2 and the right face shows 4. In the second throw the top face shows 3, the face facing you shows 1 and the right face shows 5. Which number is on the face opposite the face that shows 3? (Do not assume opposite faces add to 7; use only what the two throws show.)", "o": ["4", "2", "1", "6"], "a": 3, "x": "The face with 3 is seen with 2 and 4 in the first throw, and with 1 and 5 in the second. A face next to 3 cannot be opposite it, so the opposite face is none of 2, 4, 1, 5. The only number left is 6, so 6 is opposite 3.", "cn": "A face seen next to another face can never be opposite it. List all four neighbours from the two throws; the one number left is opposite.", "sl": "Original variant of a concept (new items and wording)", "t": "Cubes and dice"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
