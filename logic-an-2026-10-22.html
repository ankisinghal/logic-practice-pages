<script>const D={"id": "q32f8a057fe", "date": "2026-10-22", "type": "LR", "level": 1, "qs": [{"id": "V-syllogism-32", "q": "Statements: All coins are metals. All things are metals. (Every group named has at least one member.)\nConclusions:\nI. Some coins are things.\nII. Some things are coins.\nWhich conclusion follows?", "o": ["Both follow", "Only II follows", "Neither follows", "Only I follows"], "a": 2, "x": "A conclusion follows only if it is true in every possible picture of the statements, taking each named group to have at least one member. In each case a picture can be drawn where the conclusion fails.", "cn": "A conclusion follows only if it is true in every possible picture, not just in one. \"Some A are B\" can be reversed; \"All A are B\" cannot.", "sl": "Original variant of a concept (new items and wording)", "t": "Syllogism"}, {"id": "V-interchange_signs_numbers-32", "q": "Given interchanges: signs + and - and numbers 2 and 3. Which equation would be correct?", "o": ["2 - 2 + 3 = 4", "9 + 9 - 3 = 9", "3 - 2 + 2 = 7", "5 + 3 + 3 = 11"], "a": 0, "x": "After swapping, the left sides are 3+3-2 = 4 (option says 4), 5-2-2 = 1 (option says 11), 9-9+2 = 2 (option says 9), 2+3-3 = 2 (option says 7). Only 2-2+3=4 matches.", "cn": "Swap the signs and numbers named in the question first, then work out each option's left side with the usual order of operations and compare with its right side.", "sl": "Original variant of a concept (new items and wording)", "t": "Interchange of signs and numbers"}, {"id": "V-l0_facing-32", "q": "Kabir is facing west. Kabir turns left, then right. Which direction is Kabir facing now?", "o": ["south", "west", "east", "north"], "a": 1, "x": "Start facing west. Turn left, then right. Facing west.", "cn": "A right turn moves you one step clockwise (north, east, south, west). A left turn goes the other way.", "sl": "Original variant of a concept (new items and wording)", "t": "Directions (L0)"}, {"id": "V-l0_odd_one-32", "q": "Which one does not belong with the others: orange, mango, apple, carrot?", "o": ["mango", "orange", "apple", "carrot"], "a": 3, "x": "orange, mango, apple are all of the same kind (fruit). carrot is not, so it is the odd one out.", "cn": "Find what three of the four share, then pick the one that does not fit.", "sl": "Original variant of a concept (new items and wording)", "t": "Odd one out (L0)"}, {"id": "V-l0_alpha_order-32", "q": "Mira is taller than Imran. Dev is taller than Asha. Imran is taller than Dev. Who is the tallest?", "o": ["Dev", "Asha", "Mira", "Imran"], "a": 2, "x": "Putting the statements in a line from shortest to tallest gives Asha, Dev, Imran, Mira. The tallest is Mira.", "cn": "Put the comparisons in one line from smallest to largest, then read off the end you need.", "sl": "Original variant of a concept (new items and wording)", "t": "Ranking and ordering (L0)"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
