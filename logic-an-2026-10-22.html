<h1>Logic practice q32f8a057fe</h1><p>5 questions &middot; level L1 &middot; about 10 to 15 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>

<script>const D={"id": "q32f8a057fe", "date": "2026-10-22", "type": "LR", "level": 1, "qs": [{"id": "V-syllogism-32", "q": "Statements: All coins are metals. All things are metals. (Every group named has at least one member.)\nConclusions:\nI. Some coins are things.\nII. Some things are coins.\nWhich conclusion follows?", "o": ["Both follow", "Neither follows", "Only II follows", "Only I follows"], "a": 1, "x": "A conclusion follows only if it is true in every possible picture of the statements, taking each named group to have at least one member. In each case a picture can be drawn where the conclusion fails.", "cn": "A conclusion follows only if it is true in every possible picture, not just in one. \"Some A are B\" can be reversed; \"All A are B\" cannot.", "sl": "Original variant of a concept (new items and wording)", "t": "Syllogism"}, {"id": "V-interchange_signs_numbers-32", "q": "Given interchanges: signs + and - and numbers 2 and 3. Which equation would be correct?", "o": ["2 - 2 + 3 = 4", "9 + 9 - 3 = 9", "3 - 2 + 2 = 7", "5 + 3 + 3 = 11"], "a": 0, "x": "After swapping, the left sides are 3+3-2 = 4 (option says 4), 5-2-2 = 1 (option says 11), 9-9+2 = 2 (option says 9), 2+3-3 = 2 (option says 7). Only 2-2+3=4 matches.", "cn": "Swap the signs and numbers named in the question first, then work out each option's left side with the usual order of operations and compare with its right side.", "sl": "Original variant of a concept (new items and wording)", "t": "Interchange of signs and numbers"}, {"id": "V-mirror_clock-32", "q": "A clock shows 1:40. What time will its image show in a plane mirror?", "o": ["11:40", "11:20", "1:40", "10:20"], "a": 3, "x": "Mirror time = 11:60 - 1:40 (equivalently 12:00 minus the time shown, in minutes) = 10:20.", "cn": "Mirror image of a clock time = 11:60 minus the time (use 12:00 minus the time shown).", "sl": "Original variant of a concept (new items and wording)", "t": "Mirror image (clock)"}, {"id": "V-grid_missing-32", "q": "Find the missing number:\nRow 1: 6, 7, 39\nRow 2: 4, 2, 5\nRow 3: 6, 2, ?", "o": ["9", "8", "10", "11"], "a": 0, "x": "In every row, third = first x second - 3. Row 1: 6,7 gives 39. Row 3: gives 9.", "cn": "Test a rule on the first row, confirm it on the second, then apply it to the third.", "sl": "Original variant of a concept (new items and wording)", "t": "Missing number (grid rows)"}, {"id": "V-count_squares-32", "q": "How many squares of all sizes are there in a 6 x 6 square grid (made of 36 small unit squares)?", "o": ["85", "36", "91", "97"], "a": 2, "x": "Squares of side k number (6-k+1)^2. Adding for k = 1 to 6: 36 + 25 + 16 + 9 + 4 + 1 = 91.", "cn": "Count squares of each side length separately: side k fits (n - k + 1)^2 times. Then add.", "sl": "Original variant of a concept (new items and wording)", "t": "Counting figures (squares in a grid)"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
