<script>const D={"id": "qcad2f47898", "date": "2026-10-23", "type": "LR", "level": 1, "qs": [{"id": "V-syllogism-33", "q": "Statements: All chairs are tables. All tables are desks. (Every group named has at least one member.)\nConclusions:\nI. Some desks are chairs.\nII. All chairs are desks.\nWhich conclusion follows?", "o": ["Both follow", "Only I follows", "Neither follows", "Only II follows"], "a": 0, "x": "A conclusion follows only if it is true in every possible picture of the statements, taking each named group to have at least one member. Checking both, each is forced by the statements.", "cn": "A conclusion follows only if it is true in every possible picture, not just in one. \"Some A are B\" can be reversed; \"All A are B\" cannot.", "sl": "Original variant of a concept (new items and wording)", "t": "Syllogism"}, {"id": "V-seating_arrangement-37", "q": "Five friends A, B, C, D, E sit in a row facing north. A sits immediately to the left of B. B sits at the right end. C sits immediately to the left of D. E sits immediately to the left of C. Who sits at the left end?", "o": ["C", "A", "E", "B"], "a": 2, "x": "Place the fixed clues first, then fit the rest. The only arrangement that works, from left to right, is E C D A B, so E sits at the left end.", "cn": "Start with the clues that fix a place (ends, 'immediately left of') and then use the others to rule out the rest. Facing north, left is west.", "sl": "Original variant of a concept (new items and wording)", "t": "Seating arrangement"}, {"id": "V-number_series-33", "q": "What comes next in the series 2, 50, 4, 45, 6, 40, ?", "o": ["35", "7", "10", "8"], "a": 3, "x": "Two series are mixed. The odd places go 2, 4, 6 (add 2) and the even places go 50, 45, 40 (subtract 5). The next term is the next odd-place term: 6 + 2 = 8.", "cn": "Find the gaps between terms. If the gaps themselves form a pattern, continue that pattern. Also test squares, doubling and two mixed series.", "sl": "Original variant of a concept (new items and wording)", "t": "Number series"}, {"id": "V-coding_shift-33", "q": "In a certain code, FAN is written as IDQ. How is GUM written in that code?", "o": ["DRJ", "JXP", "IWO", "KYQ"], "a": 1, "x": "Each letter moves 3 places forward: F to I, A to D, N to Q. So GUM becomes JXP.", "cn": "In a letter code, check how each letter moves. The same shift applies to every letter of the new word.", "sl": "Original variant of a concept (new items and wording)", "t": "Coding-decoding"}, {"id": "V-directions-33", "q": "Arjun walks 10 km north, then turns right and walks 3 km, then turns right and walks 10 km. How far and in which direction is Arjun from the starting point?", "o": ["3 km north-east", "3 km east", "3 km north-west", "3 km north"], "a": 1, "x": "Take east as +x and north as +y. After the walk the position is (3, 0) km from the start. Distance = square root of (3)^2 + (0)^2 = 3 km, in the east direction.", "cn": "Track each move with north, east, south and west. Turning right from north faces east, and opposite moves cancel. Distance is the straight line (Pythagoras).", "sl": "Original variant of a concept (new items and wording)", "t": "Directions"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
