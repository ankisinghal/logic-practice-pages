<script>const D={"id": "q5db306c9c9", "date": "2026-10-24", "type": "LR", "level": 1, "qs": [{"id": "V-syllogism-34", "q": "Statements: All birds are fliers. No singers are fliers. (Every group named has at least one member.)\nConclusions:\nI. No singers are birds.\nII. No birds are fliers.\nWhich conclusion follows?", "o": ["Only I follows", "Neither follows", "Both follow", "Only II follows"], "a": 0, "x": "A conclusion follows only if it is true in every possible picture of the statements, taking each named group to have at least one member. I holds in every picture; for II a picture exists where it fails.", "cn": "A conclusion follows only if it is true in every possible picture, not just in one. \"Some A are B\" can be reversed; \"All A are B\" cannot.", "sl": "Original variant of a concept (new items and wording)", "t": "Syllogism"}, {"id": "V-interchange_signs_numbers-34", "q": "Given interchanges: signs - and x and numbers 7 and 9. Which equation would be correct?", "o": ["6 + 9 x 4 = 12", "9 + 4 - 9 = 4", "6 + 5 x 7 = 2", "7 + 4 - 5 = 36"], "a": 2, "x": "After swapping, the left sides are 6+5-9 = 2 (option says 2), 7+4x7 = 35 (option says 4), 6+7-4 = 9 (option says 12), 9+4x5 = 29 (option says 36). Only 6+5x7=2 matches.", "cn": "Swap the signs and numbers named in the question first, then work out each option's left side with the usual order of operations and compare with its right side.", "sl": "Original variant of a concept (new items and wording)", "t": "Interchange of signs and numbers"}, {"id": "V-ranking-34", "q": "Arjun ranks 9th from the top in a class. There are 36 students below Arjun. How many students are in the class?", "o": ["47", "45", "46", "44"], "a": 1, "x": "Students above Arjun: 8. Students below: 36. Total = 8 + 1 + 36 = 45.", "cn": "Rank from the top + rank from the bottom = total + 1, because the learner is counted in both.", "sl": "Original variant of a concept (new items and wording)", "t": "Ranking and ordering"}, {"id": "V-calendar_days-34", "q": "Today is Saturday. What day of the week will it be after 30 days?", "o": ["Friday", "Wednesday", "Thursday", "Monday"], "a": 3, "x": "A week has 7 days, so only the remainder matters. 30 = 4 x 7 + 2, so move 2 day(s) forward from Saturday: Monday.", "cn": "Divide the number of days by 7; only the remainder moves the day forward.", "sl": "Original variant of a concept (new items and wording)", "t": "Calendar (days of the week)"}, {"id": "V-alphabet_position-34", "q": "Which letter is 9 places to the right of the 11th letter from the left in the English alphabet?", "o": ["S", "T", "U", "V"], "a": 1, "x": "The 11th letter from the left is K. Moving 9 places to the right gives position 11 + 9 = 20, which is T.", "cn": "Fix one end of the alphabet: from the left A is 1; from the right A is 26. Add for right, subtract for left, then read the letter.", "sl": "Original variant of a concept (new items and wording)", "t": "Alphabet test"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
