<h1>Logic practice q008f9fadae</h1><p>5 questions &middot; level L1 &middot; about 10 to 15 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "q008f9fadae", "date": "2026-11-26", "type": "LR", "level": 1, "qs": [{"id": "V-syllogism-5", "q": "Statements: Some chairs are tables. All tables are desks. (Every group named has at least one member.)\nConclusions:\nI. No desks are chairs.\nII. All tables are chairs.\nWhich conclusion follows?", "o": ["Only II follows", "Both follow", "Only I follows", "Neither follows"], "a": 3, "x": "A conclusion follows only if it is true in every possible picture of the statements, taking each named group to have at least one member. In each case a picture can be drawn where the conclusion fails.", "cn": "A conclusion follows only if it is true in every possible picture, not just in one. \"Some A are B\" can be reversed; \"All A are B\" cannot.", "sl": "Original variant of a concept (new items and wording)", "t": "Syllogism"}, {"id": "V-seating_arrangement-5", "q": "Five friends B, C, D, E, F sit in a row facing north. C sits at the right end. B and D sit next to each other. B sits immediately to the left of D. C and F sit next to each other. E sits immediately to the left of B. Who sits at the right end?", "o": ["E", "D", "C", "B"], "a": 2, "x": "Place the fixed clues first, then fit the rest. The only arrangement that works, from left to right, is E B D F C, so C sits at the right end.", "cn": "Start with the clues that fix a place (ends, 'immediately left of') and then use the others to rule out the rest. Facing north, left is west.", "sl": "Original variant of a concept (new items and wording)", "t": "Seating arrangement"}, {"id": "V-count_squares-7", "q": "How many squares of all sizes are there in a 4 x 4 square grid (made of 16 small unit squares)?", "o": ["26", "30", "16", "34"], "a": 1, "x": "Squares of side k number (4-k+1)^2. Adding for k = 1 to 4: 16 + 9 + 4 + 1 = 30.", "cn": "Count squares of each side length separately: side k fits (n - k + 1)^2 times. Then add.", "sl": "Original variant of a concept (new items and wording)", "t": "Counting figures (squares in a grid)"}, {"id": "V-statement_conclusion-28", "q": "Statements: The match is cancelled only if it rains. The match is cancelled. Conclusions: I. It rains. II. It rains does not happen. Which conclusion follows?", "o": ["Both conclusions follow", "Neither conclusion follows", "Only conclusion II follows", "Only conclusion I follows"], "a": 3, "x": "'the match is cancelled only if it rains' means it rains is necessary for the match is cancelled. Since the match is cancelled happened, it rains must have happened (conclusion I). Conclusion II contradicts that.", "cn": "A conclusion follows only if it must be true in every case the statements allow. 'If P then Q' gives Q when P is true, but gives nothing about P when Q is true; 'Q only if P' makes P necessary for Q.", "sl": "Original variant of a concept (new items and wording)", "t": "Statements and conclusions"}, {"id": "V-data_sufficiency-6", "q": "What is the value of x + y? Statement 1: x = 13. Statement 2: y = 11. Which statement(s) are sufficient to answer the question?", "o": ["Both statements together are needed", "Statement 2 alone is sufficient", "Statement 1 alone is sufficient", "Either statement alone is sufficient"], "a": 0, "x": "Statement 1 alone gives only x = 13; statement 2 alone gives only y = 11. Together x + y = 13 + 11 = 24. Neither alone answers the question.", "cn": "Do not solve fully: ask whether the statements FIX a single answer. Test each statement alone first, then both together.", "sl": "Original variant of a concept (new items and wording)", "t": "Data sufficiency"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=async()=>{const b=document.getElementById("copy"),c=document.getElementById("code").textContent;try{await navigator.clipboard.writeText(c);b.textContent="Copied"}catch(e){b.textContent="Copy failed - code selected; copy it manually";const r=document.createRange();r.selectNodeContents(document.getElementById("code"));const s=window.getSelection();s.removeAllRanges();s.addRange(r)}};
</script></body></html>
