 be true from the statements. 'If P then Q' plus P gives Q; Q alone does not give P; 'Q only if P' means Q needs P.", "sl": "Authored statement-conclusion (new scenario)", "t": "Statements and conclusions"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
