<script>const D={"id": "q07fa54eea9", "date": "2026-11-14", "type": "LR", "level": 1, "qs": [{"id": "A-cause_effect-an20261114-1", "q": "Two statements are given: I. A technician deliberately closed the only valve supplying water to a tank. II. The flow of water into the tank stopped immediately because that valve was closed. What is the relationship between them?", "o": ["Both statements are effects of a common cause", "Both statements are effects of independent causes", "Statement II is the cause and statement I is its effect", "Statement I is the cause and statement II is its effect"], "a": 3, "x": "Statement II explicitly says that closing the only supply valve stopped the inflow. Thus the action in I caused the outcome in II.", "cn": "First ask which event could make the other happen. If one makes the other happen, that is the cause. If a third event explains both, they are effects of a common cause; if nothing links them, the causes are independent.", "sl": "Original practice item", "t": "Cause and effect"}, {"id": "V-statement_assumption-16", "q": "Statement: The school has asked every class to keep its first-aid box stocked and to check the expiry dates each month. Assumptions: I. The school expects a flood in the coming month. II. Quick access to basic first aid matters if someone gets hurt at school. Which assumption(s) is/are implicit in the statement?", "o": ["Only assumption II is implicit", "Neither assumption is implicit", "Only assumption I is implicit", "Both assumptions are implicit"], "a": 0, "x": "Stocking a first-aid box and checking expiry dates makes sense only if timely basic first aid may be needed; the instruction says nothing about floods.", "cn": "An assumption is implicit only if the statement depends on it being true. Ask: does the step or claim make sense without this? Facts merely related to the topic are not assumptions.", "sl": "Original variant of a concept (new items and wording)", "t": "Statement and assumption"}, {"id": "V-l0_series_add-11", "q": "What comes next in the series 10, 13, 16, 19, 22, ?", "o": ["28", "25", "26", "24"], "a": 1, "x": "Each term is 3 more than the one before. 22 + 3 = 25.", "cn": "Find the gap between neighbouring terms. If it is the same each time, keep adding it.", "sl": "Original variant of a concept (new items and wording)", "t": "Number series (L0)"}, {"id": "V-number_series-8", "q": "What comes next in the series 2, 5, 10, 17, 26, ?", "o": ["35", "37", "39", "38"], "a": 1, "x": "The gaps are 3, 5, 7, 9, increasing by 2 each time. The next gap is 11, so 26 + 11 = 37.", "cn": "Find the gaps between terms. If the gaps themselves form a pattern, continue that pattern. Also test squares, doubling and two mixed series.", "sl": "Original variant of a concept (new items and wording)", "t": "Number series"}, {"id": "V-directions-7", "q": "Neha walks 12 km north, then turns right and walks 9 km. How far and in which direction is Neha from the starting point?", "o": ["15 km south-west", "15 km west", "15 km north-east", "21 km north-east"], "a": 2, "x": "Take east as +x and north as +y. After the walk the position is (9, 12) km from the start. Distance = square root of (9)^2 + (12)^2 = 15 km, in the north-east direction.", "cn": "Track each move with north, east, south and west. Turning right from north faces east, and opposite moves cancel. Distance is the straight line (Pythagoras).", "sl": "Original variant of a concept (new items and wording)", "t": "Directions"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
