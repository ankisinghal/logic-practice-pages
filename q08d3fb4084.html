<script>const D={"id":"q08d3fb4084","date":"2026-11-19","type":"LR","level":1,"qs":[{"id":"A-data_sufficiency-b37","q":"Is the positive integer N divisible by 15? Statement 1: N is divisible by 5. Statement 2: N is divisible by 9. Which statement(s) are sufficient?","o":["Statement 1 alone is sufficient, but statement 2 alone is not","Statement 2 alone is sufficient, but statement 1 alone is not","Both statements together are sufficient, but neither alone is sufficient","Each statement alone is sufficient"],"a":2,"x":"Statement 1 alone does not require a factor of 3, and statement 2 alone does not require a factor of 5. Together they make N divisible by both 5 and 9, hence by 45 and therefore by 15.","cn":"Use the stated conditions.","sl":"Original practice item","t":"data_sufficiency"},{"id":"A-data_sufficiency-b38","q":"Is the real number x greater than the real number y? Statement 1: x - y = 4. Statement 2: x + y = 10. Which statement(s) are sufficient?","o":["Statement 1 alone is sufficient, but statement 2 alone is not","Statement 2 alone is sufficient, but statement 1 alone is not","Both statements together are sufficient, but neither alone is sufficient","Each statement alone is sufficient"],"a":0,"x":"Statement 1 says x is exactly 4 more than y, so x is greater. Statement 2 alone is not sufficient: x=6,y=4 gives yes, while x=4,y=6 gives no.","cn":"Use the stated conditions.","sl":"Original practice item","t":"data_sufficiency"},{"id":"A-seating_arrangement-c36","q":"Six people A, B, C, D, E and F sit in a row of six chairs, numbered 1 to 6 from the viewer's left. B is in chair 2 and E is in chair 5. A sits immediately to B's right. C sits immediately to E's left. D and F fill the remaining chairs. Who sits in chair 3?","o":["B","A","C","D"],"a":1,"x":"B fixes chair 2, so A must be in chair 3. E fixes chair 5, so C must be in chair 4. D and F take chairs 1 and 6, leaving chair 3 as A.","cn":"Use the stated conditions.","sl":"Original practice item","t":"seating_arrangement"},{"id":"A-seating_arrangement-c37","q":"Six people A, B, C, D, E and F sit in a row of six chairs, numbered 1 to 6 from the viewer's left. A is at the left end and B is in chair 3. D sits between A and B, with no one else between those three. F sits immediately to B's right. C sits immediately to E's left. Who sits in chair 5?","o":["B","E","F","C"],"a":3,"x":"The first four chairs are forced as A,D,B,F. The remaining C-E adjacent pair fills chairs 5 and 6 in that order, so chair 5 is C.","cn":"Use the stated conditions.","sl":"Original practice item","t":"seating_arrangement"},{"id":"A-seating_arrangement-c38","q":"Six people A, B, C, D, E and F sit in a row of six chairs, numbered 1 to 6 from the viewer's left. A is in chair 2 and B is in chair 3. C is at the right end. D sits immediately to E's left. F fills the remaining chair. Who sits in chair 4?","o":["D","B","E","F"],"a":0,"x":"A and B fix chairs 2 and 3, and C fixes chair 6. The adjacent D-E pair must fit chairs 4 and 5, with D immediately left of E. F takes chair 1, so chair 4 is D.","cn":"Use the stated conditions.","sl":"Original practice item","t":"seating_arrangement"},{"id":"A-coding_shift-c37","q":"A code keeps every vowel fixed in its position, reverses the order of the consonants, and puts those reversed consonants back into the consonant positions. Thus PLANT becomes TANLP. How is BUCKET coded?","o":["TUCKEB","TUKCEB","TUKCBE","BUKCET"],"a":1,"x":"In BUCKET, the consonants in order are B,C,K,T. Reversed they are T,K,C,B. Putting them back while U and E stay fixed gives T,U,K,C,E,B, so the code is TUKCEB.","cn":"Use the stated conditions.","sl":"Original practice item","t":"coding_shift"},{"id":"A-coding_shift-c38","q":"A code keeps the first and last letters of a five-letter word fixed and moves each of the three middle letters one place forward in the alphabet. Thus CAMP becomes CBNP. How is TRAIL coded?","o":["TRBJL","TSAIL","TSBJL","TSCJL"],"a":2,"x":"TRAIL has middle letters R,A,I. Moving each one place forward gives S,B,J, while T and L stay fixed, so the code is TSBJL.","cn":"Use the stated conditions.","sl":"Original practice item","t":"coding_shift"},{"id":"A-coding_shift-c39","q":"A code writes the sum of the alphabet positions of the vowels in a word, then the sum of the alphabet positions of its consonants, separated by a hyphen. A=1, ..., Z=26. Thus CAKE becomes 6-14. How is MANGO coded?","o":["15-34","16-33","50-0","16-34"],"a":3,"x":"For MANGO, the vowels are A and O: 1+15=16. The consonants are M, N and G: 13+14+7=34. The code is 16-34.","cn":"Use the stated conditions.","sl":"Original practice item","t":"coding_shift"},{"id":"A-coding_shift-c40","q":"A code writes all consonants of a word first in their original order, then all vowels in their original order. Thus PLANT becomes PLNTA. How is MARKET coded?","o":["MRKTAE","MRKETA","MAKRTE","TMRKAE"],"a":0,"x":"In MARKET, the consonants in order are M,R,K,T and the vowels in order are A,E. The code is MRKTAE.","cn":"Use the stated conditions.","sl":"Original practice item","t":"coding_shift"},{"id":"A-statement_conclusion-o53","q":"Statements: No employee who missed the safety training is assigned to the project. Meera is an employee assigned to the project. Conclusions: I. Meera did not miss the safety training. II. Meera finished the safety training early. Which conclusion(s) follow(s)?","o":["Only conclusion II follows","Only conclusion I follows","Both conclusions follow","Neither conclusion follows"],"a":1,"x":"Since no one who missed the training is assigned, Meera being assigned means she did not miss it. The statements say nothing about finishing it early.","cn":"Use the stated conditions.","sl":"Original practice item","t":"statement_conclusion"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
