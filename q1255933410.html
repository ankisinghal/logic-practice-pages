<script>const D={"id": "q1255933410", "date": "2026-11-12", "type": "LR", "level": 1, "qs": [{"id": "V-course_of_action-7", "q": "Statement: Many children in a city school have fallen sick after drinking water from the school tank. Courses of action: I. All parents should be told to move their children to another school. II. The school should get the tank cleaned and the water tested at once. Which course(s) of action logically follow(s)?", "o": ["Only course of action I follows", "Both courses of action follow", "Only course of action II follows", "Neither course of action follows"], "a": 2, "x": "Cleaning and testing the water attacks the cause directly; moving every child to another school is extreme and the statement does not call for it.", "cn": "A course of action follows if it is a practical step that directly tackles the problem in the statement. Reject steps that are extreme, unrelated, or punish the wrong people.", "sl": "Original variant of a concept (new items and wording)", "t": "Statement and course of action"}, {"id": "A-cause_effect-an20261112-1", "q": "Two statements are given: I. A footbridge was closed solely because an inspection found cracks in its supports. II. An orchestra cancelled its rehearsal solely because its conductor fell ill. The two events are unrelated. What is the relationship between them?", "o": ["Statement II is the cause and statement I is its effect", "Both statements are effects of independent causes", "Both statements are effects of a common cause", "Statement I is the cause and statement II is its effect"], "a": 1, "x": "The bridge closure results from structural cracks; the rehearsal cancellation results from an unrelated illness. Their stated causes are independent.", "cn": "First ask which event could make the other happen. If one makes the other happen, that is the cause. If a third event explains both, they are effects of a common cause; if nothing links them, the causes are independent.", "sl": "Original practice item", "t": "Cause and effect"}, {"id": "V-l0_series_add-7", "q": "What comes next in the series 3, 6, 9, 12, 15, ?", "o": ["19", "17", "21", "18"], "a": 3, "x": "Each term is 3 more than the one before. 15 + 3 = 18.", "cn": "Find the gap between neighbouring terms. If it is the same each time, keep adding it.", "sl": "Original variant of a concept (new items and wording)", "t": "Number series (L0)"}, {"id": "V-number_series-6", "q": "What comes next in the series 6, 9, 14, 21, 30, ?", "o": ["43", "42", "41", "39"], "a": 2, "x": "The gaps are 3, 5, 7, 9, increasing by 2 each time. The next gap is 11, so 30 + 11 = 41.", "cn": "Find the gaps between terms. If the gaps themselves form a pattern, continue that pattern. Also test squares, doubling and two mixed series.", "sl": "Original variant of a concept (new items and wording)", "t": "Number series"}, {"id": "A-l0_facing-an20261112-1", "q": "Nila starts facing west. She turns 90 degrees clockwise, then 180 degrees anticlockwise, and finally 90 degrees clockwise. Which direction is she facing now?", "o": ["West", "South", "East", "North"], "a": 0, "x": "West -> north after the first turn; north -> south after the half-turn; south -> west after the last clockwise quarter-turn.", "cn": "A right turn moves you one step clockwise (north, east, south, west). A left turn goes the other way.", "sl": "Original practice item", "t": "Directions (L0)"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
