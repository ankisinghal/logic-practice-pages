<script>const D={"id": "q1b41f53041", "date": "2026-11-27", "type": "LR", "level": 1, "qs": [{"id": "V-critical_reasoning-4", "q": "Argument: A company gave free bus passes to employees, saying this will cut lateness. Which of the following most WEAKENS this argument?", "o": ["A few employees had already been cycling to work long before the bus pass scheme started.", "Most of the employees who arrive late live on a housing route that has no bus service at all.", "The bus passes cost the company less money each month than maintaining its old parking lot.", "Employees who tried the buses say they are clean, quiet and arrive every ten minutes or so."], "a": 1, "x": "The argument assumes the action will fix the real cause of the problem. The correct option breaks that link: Most of the employees who arrive late live on a housing route that has no bus service at all. The other options are neutral background or mildly supportive, so they do not weaken the claim.", "cn": "To weaken a causal argument, look for the option that breaks the link between the proposed action and the intended result - often another cause or a missing route.", "sl": "Original variant of a concept (new items and wording)", "t": "Critical reasoning (weaken)"}, {"id": "V-ordering_comparison-5", "q": "Bilal is taller than Chitra. Gita is shorter than Chitra. Farid is shorter than Gita. Who is the tallest?", "o": ["Bilal", "Gita", "Chitra", "Farid"], "a": 0, "x": "From the statements: Bilal > Chitra > Gita > Farid (tallest to shortest). The tallest is Bilal.", "cn": "Chain the comparisons into one line from tallest to shortest, then read off the end you need.", "sl": "Original variant of a concept (new items and wording)", "t": "Ranking and ordering (comparisons)"}, {"id": "V-letter_series_skip-6", "q": "What comes next in the series G, K, O, S, ?", "o": ["V", "X", "S", "W"], "a": 3, "x": "Each letter moves 4 places forward: G to K to O to S to W.", "cn": "Convert letters to positions (A=1, B=2, ...) and look for the gap between terms.", "sl": "Original variant of a concept (new items and wording)", "t": "Letter series (skip pattern)"}, {"id": "V-dice_views-5", "q": "A die is thrown twice and its faces carry the numbers 1 to 6, one number per face. In the first throw the top face shows 2, the face facing you shows 5 and the right face shows 1. In the second throw the top face shows 4, the face facing you shows 2 and the right face shows 6. Which number is on the face opposite the face that shows 2? (Do not assume opposite faces add to 7; use only what the two throws show.)", "o": ["3", "1", "4", "5"], "a": 0, "x": "The face with 2 is seen with 5 and 1 in the first throw, and with 4 and 6 in the second. A face next to 2 cannot be opposite it, so the opposite face is none of 5, 1, 4, 6. The only number left is 3, so 3 is opposite 2.", "cn": "A face seen next to another face can never be opposite it. List all four neighbours from the two throws; the one number left is opposite.", "sl": "Original variant of a concept (new items and wording)", "t": "Cubes and dice"}, {"id": "V-cause_effect-9", "q": "Two statements are given: I. The lake's water level fell to a ten-year low. II. Farmers around the lake reported wilting crops. What is the relationship between them?", "o": ["Statement II is the cause and statement I is its effect", "Statement I is the cause and statement II is its effect", "Both statements are effects of a common cause", "Both statements are effects of independent causes"], "a": 2, "x": "A long dry spell both lowers the lake and wilts crops, so both statements are effects of a common cause.", "cn": "First ask which event could make the other happen. If one makes the other happen, that is the cause. If a third event explains both, they are effects of a common cause; if nothing links them, the causes are independent.", "sl": "Original variant of a concept (new items and wording)", "t": "Cause and effect"}]};const L="ABCD";const qd=document.getElementById("q rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
