<h1>Logic practice q1e744a22f9</h1><p>10 questions &middot; level L1 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>

<script>const D={"id": "q1e744a22f9", "date": "2026-11-01", "type": "LR", "level": 1, "qs": [{"id": "V-dice_views-72", "q": "A die is thrown twice and its faces carry the numbers 1 to 6, one number per face. In the first throw the top face shows 2, the face facing you shows 6 and the right face shows 1. In the second throw the top face shows 5, the face facing you shows 2 and the right face shows 3. Which number is on the face opposite the face that shows 2? (Do not assume opposite faces add to 7; use only what the two throws show.)", "o": ["1", "4", "5", "6"], "a": 1, "x": "The face with 2 is seen with 6 and 1 in the first throw, and with 5 and 3 in the second. A face next to 2 cannot be opposite it, so the opposite face is none of 6, 1, 5, 3. The only number left is 4, so 4 is opposite 2.", "cn": "A face seen next to another face can never be opposite it. List all four neighbours from the two throws; the one number left is opposite.", "sl": "Original variant of a concept (new items and wording)", "t": "Cubes and dice"}, {"id": "V-syllogism-72", "q": "Statements: All birds are fliers. All fliers are singers. (Every group named has at least one member.)\nConclusions:\nI. Some birds are singers.\nII. No birds are fliers.\nWhich conclusion follows?", "o": ["Only I follows", "Neither follows", "Only II follows", "Both follow"], "a": 0, "x": "A conclusion follows only if it is true in every possible picture of the statements, taking each named group to have at least one member. I holds in every picture; for II a picture exists where it fails.", "cn": "A conclusion follows only if it is true in every possible picture, not just in one. \"Some A are B\" can be reversed; \"All A are B\" cannot.", "sl": "Original variant of a concept (new items and wording)", "t": "Syllogism"}, {"id": "V-seating_arrangement-72", "q": "Five friends A, C, D, E, F sit in a row facing north. E and F do not sit next to each other. D and E do not sit next to each other. C sits immediately to the left of F. A sits at the left end. Who sits in the middle?", "o": ["C", "D", "A", "E"], "a": 0, "x": "Place the fixed clues first, then fit the rest. The only arrangement that works, from left to right, is A E C F D, so C sits in the middle.", "cn": "Start with the clues that fix a place (ends, 'immediately left of') and then use the others to rule out the rest. Facing north, left is west.", "sl": "Original variant of a concept (new items and wording)", "t": "Seating arrangement"}, {"id": "V-coding_shift-71", "q": "In a certain code, CUP is written as GYT. How is PEN written in that code?", "o": ["SHQ", "LAJ", "UJS", "TIR"], "a": 3, "x": "Each letter moves 4 places forward: C to G, U to Y, P to T. So PEN becomes TIR.", "cn": "In a letter code, check how each letter moves. The same shift applies to every letter of the new word.", "sl": "Original variant of a concept (new items and wording)", "t": "Coding-decoding"}, {"id": "A-statement_conclusion-o29", "q": "Statements: The elevator works only if the power supply is on. The elevator is working. Conclusions: I. The power supply is on. II. The power supply is not on. Which conclusion follows?", "o": ["Only conclusion II follows", "Both conclusions follow", "Neither conclusion follows", "Only conclusion I follows"], "a": 3, "x": "'Only if' means the power supply being on is a necessary condition for the elevator to work. The elevator is given as working, so the power supply must be on (conclusion I). Conclusion II denies what must be true, so it does not follow.", "cn": "A conclusion follows only if it MUST be true from the statements. 'If P then Q' plus P gives Q; Q alone does not give P; 'Q only if P' means Q needs P.", "sl": "Authored item for a concept (new scenario and wording)", "t": "Statements and conclusions"}, {"id": "A-statement_conclusion-o30", "q": "Statements: If the new restaurant is good, it is hard to get a table there. It is hard to get a table at the new restaurant. Conclusions: I. The new restaurant is good. II. It could be hard to get a table for some other reason, so the statements do not prove that the new restaurant is good. Which conclusion follows?", "o": ["Only conclusion II follows", "Neither conclusion follows", "Only conclusion I follows", "Both conclusions follow"], "a": 0, "x": "A full restaurant does not prove the restaurant is good: other reasons for it being hard to get a table are not ruled out. So conclusion I does not follow, and conclusion II correctly says the statements do not prove the restaurant is good.", "cn": "A conclusion follows only if it MUST be true from the statements. 'If P then Q' plus P gives Q; Q alone does not give P; 'Q only if P' means Q needs P.", "sl": "Authored item for a concept (new scenario and wording)", "t": "Statements and conclusions"}, {"id": "A-statement_conclusion-o31", "q": "Statements: If the washing machine is running, the clothes inside get wet. The clothes inside are not wet. Conclusions: I. The washing machine is not running. II. The washing machine is running. Which conclusion follows?", "o": ["Neither conclusion follows", "Only conclusion II follows", "Both conclusions follow", "Only conclusion I follows"], "a": 3, "x": "If the machine were running, the clothes would be wet. The clothes are given as not wet, so the machine cannot be running (conclusion I). Conclusion II says the opposite of what must be true, so it does not follow.", "cn": "A conclusion follows only if it MUST be true from the statements. 'If P then Q' plus P gives Q; Q alone does not give P; 'Q only if P' means Q needs P.", "sl": "Authored item for a concept (new scenario and wording)", "t": "Statements and conclusions"}, {"id": "V-data_sufficiency-79", "q": "What is the value of x, a positive integer? Statement 1: x = 4. Statement 2: 2x = 8. Which statement(s) are sufficient to answer the question?", "o": ["Both statements together are needed", "Either statement alone is sufficient", "Statement 1 alone is sufficient", "Statement 2 alone is sufficient"], "a": 1, "x": "Statement 1 alone fixes x = 4. Statement 2 alone gives x = 8/2 = 4. Each statement answers the question by itself.", "cn": "Do not solve fully: ask whether the statements FIX a single answer. Test each statement alone first, then both together.", "sl": "Original variant of a concept (new items and wording)", "t": "Data sufficiency"}, {"id": "A-data_sufficiency-a1", "q": "What is the average of x and y? Statement 1: x + y = 20. Statement 2: x - y = 4. Which statement(s) are sufficient to answer the question?", "o": ["Either statement alone is sufficient", "Both statements together are needed", "Statement 1 alone is sufficient", "Statement 2 alone is sufficient"], "a": 2, "x": "Statement 1 alone fixes the average: (x + y)/2 = 20/2 = 10, so it is sufficient. Statement 2 alone only says the numbers differ by 4; many pairs do that with different averages, so it is not sufficient. So statement 1 alone is sufficient.", "cn": "Do not solve fully: ask whether the statements FIX a single answer. Test each statement alone first, then both together.", "sl": "Authored item for a concept (new construction and wording)", "t": "Data sufficiency"}, {"id": "V-data_sufficiency-80", "q": "What is the value of xy, where x and y are positive integers? Statement 1: x = 3y. Statement 2: y = 6. Which statement(s) are sufficient to answer the question?", "o": ["Statement 1 alone is sufficient", "Statement 2 alone is sufficient", "Both statements together are needed", "Either statement alone is sufficient"], "a": 2, "x": "Statement 1 alone only relates x and y (many pairs fit). Statement 2 alone gives y but not x. Together x = 3 x 6 = 18, so xy = 18 x 6 = 108.", "cn": "Do not solve fully: ask whether the statements FIX a single answer. Test each statement alone first, then both together.", "sl": "Original variant of a concept (new items and wording)", "t": "Data sufficiency"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
