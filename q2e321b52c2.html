<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>LR practice q2e321b52c2</h1><p>10 questions &middot; level L1 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "q2e321b52c2", "date": "2026-11-05", "type": "LR", "level": 1, "qs": [{"id": "A-syllogism-c1", "q": "Statements: All roses are flowers. Some roses are yellow. Conclusions: I. Some flowers are yellow. II. Some yellow things are roses. Which conclusion follows?", "o": ["Both conclusions follow", "Only conclusion I follows", "Only conclusion II follows", "Neither conclusion follows"], "a": 0, "x": "The roses that are yellow are also flowers, because every rose is a flower, so some flowers are yellow (I follows). 'Some roses are yellow' also reads as 'some yellow things are roses' (II follows).", "cn": "A particular case inside a universal group transfers to that group; 'some A are B' can always be read backwards as 'some B are A'.", "sl": "Authored item for a concept (new construction and wording)", "t": "Syllogism"}, {"id": "A-seating_arrangement-c1", "q": "Six people K, L, M, N, O and P sit in a row facing north. K sits at an extreme end. There are exactly two seats between K and O. L sits immediately to the right of O. M sits immediately to the left of N. P does not sit next to K. Who sits at the other extreme end?", "o": ["O", "L", "N", "P"], "a": 3, "x": "If K is at the right end, O is third from the right, L is forced next to O, and P must sit next to K, which the clues forbid. So K is at the left end, O is fourth, L is fifth, M and N take seats two and three, and P is left with the right end.", "cn": "Test each end for the fixed person and drop the case that breaks a clue.", "sl": "Authored item for a concept (new construction and wording)", "t": "Seating Arrangement"}, {"id": "A-dice_views-c1", "q": "A flat net of a cube has six squares numbered 1 to 6. Squares 1, 2, 3 and 4 lie in a row from left to right. Square 5 is joined above square 2 and square 6 is joined below square 2. The net is folded into a cube. Which number is on the face opposite the face numbered 3?", "o": ["6", "5", "1", "4"], "a": 2, "x": "When the row of four is folded round, alternate squares face each other: 1 is opposite 3 and 2 is opposite 4. The two attached squares, 5 and 6, close the box opposite each other. So the face opposite 3 is 1.", "cn": "In a four-in-a-row net, squares two apart in the row become opposite faces.", "sl": "Authored item for a concept (new construction and wording)", "t": "Dice Views"}, {"id": "A-syllogism-c2", "q": "Statement: Some bottles are cups. Conclusions: I. Some cups are bottles. II. All cups are bottles. Which conclusion follows?", "o": ["Only conclusion II follows", "Only conclusion I follows", "Both conclusions follow", "Neither conclusion follows"], "a": 1, "x": "'Some bottles are cups' says exactly that some cups are bottles, so I follows. It says nothing about all cups, so II does not follow.", "cn": "'Some A are B' can be read backwards as 'some B are A', but it never upgrades to 'all'.", "sl": "Authored item for a concept (new construction and wording)", "t": "Syllogism"}, {"id": "A-seating_arrangement-c2", "q": "Five people V, W, X, Y and Z sit around a circular table facing the centre. V sits next to W. X sits next to V. Y sits next to W. Z does not sit next to V. Who sits between X and Y?", "o": ["X", "V", "Z", "W"], "a": 2, "x": "V has only two neighbours, so they are W and X. W's other neighbour is Y, so the order round the table is W, V, X, Z, Y. Z sits between X and Y, and Z is not next to V, which fits.", "cn": "Fix the person whose two neighbours are fully named, then place the rest around the circle.", "sl": "Authored item for a concept (new construction and wording)", "t": "Seating Arrangement"}, {"id": "A-data_sufficiency-b12", "q": "A shopkeeper sells a notebook at a profit. What is the cost price of the notebook? Statement 1: The selling price is Rs 120 and the profit is 20% of the cost price. Statement 2: The profit earned is Rs 20. Which statement(s) are sufficient to answer the question?", "o": ["Both statements together are needed", "Either statement alone is sufficient", "Statement 2 alone is sufficient", "Statement 1 alone is sufficient"], "a": 3, "x": "Statement 1: 120 is 120% of the cost price, so the cost price is 100 - sufficient. Statement 2 gives the profit but nothing linking it to the cost price - not sufficient.", "cn": "A selling price with a profit percent fixes the cost price; a bare profit amount does not.", "sl": "Authored item for a concept (new construction and wording)", "t": "Data Sufficiency"}, {"id": "A-data_sufficiency-b13", "q": "Is triangle ABC a right-angled triangle? Statement 1: Its sides are 5 cm, 12 cm and 13 cm. Statement 2: Two of its angles add up to 90 degrees. Which statement(s) are sufficient to answer the question?", "o": ["Either statement alone is sufficient", "Statement 2 alone is sufficient", "Statement 1 alone is sufficient", "Both statements together are needed"], "a": 0, "x": "Statement 1: 25 + 144 = 169, so the angle opposite the 13 cm side is 90 degrees - sufficient. Statement 2: the third angle is 180 - 90 = 90 degrees - sufficient.", "cn": "Check the Pythagoras relation on the sides, or use the angle sum of 180 degrees.", "sl": "Authored item for a concept (new construction and wording)", "t": "Data Sufficiency"}, {"id": "A-data_sufficiency-b14", "q": "What is the two-digit number? Statement 1: The sum of its digits is 9. Statement 2: The number is 4 times the sum of its digits. Which statement(s) are sufficient to answer the question?", "o": ["Statement 2 alone is sufficient", "Either statement alone is sufficient", "Statement 1 alone is sufficient", "Both statements together are needed"], "a": 3, "x": "Statement 1 alone fits 18, 27, 36 and more. Statement 2 alone fits 12, 24, 36 and 48. Together, digit sum 9 with the number 4 times that gives 36 uniquely - both are needed.", "cn": "Write the number as 10a + b and test each statement for a unique answer before combining.", "sl": "Authored item for a concept (new construction and wording)", "t": "Data Sufficiency"}, {"id": "A-data_sufficiency-b15", "q": "How many students are in the class? Statement 1: If 5 more students join, the class will have 45 students. Statement 2: The number of students is a multiple of 8. Which statement(s) are sufficient to answer the question?", "o": ["Statement 1 alone is sufficient", "Statement 2 alone is sufficient", "Either statement alone is sufficient", "Both statements together are needed"], "a": 0, "x": "Statement 1 gives 45 - 5 = 40 students - sufficient. Statement 2 alone allows 8, 16, 24, 32, 40 and more - not sufficient.", "cn": "A direct relation that fixes the count is enough; a bare multiple never fixes a count.", "sl": "Authored item for a concept (new construction and wording)", "t": "Data Sufficiency"}, {"id": "A-coding_shift-c1", "q": "In a certain code, WATER is written as RETAW. In the same code, how is MANGO written?", "o": ["GNAMO", "NGOAM", "OGNAM", "OGMAN"], "a": 2, "x": "The code writes the word in reverse order: WATER backwards is RETAW. Reversing MANGO gives OGNAM.", "cn": "Check whether the code keeps letters in place, shifts them, or simply reverses the word.", "sl": "Authored item for a concept (new construction and wording)", "t": "Coding-decoding"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
