<script>const D={"id": "q3086cce2b6", "date": "2026-11-07", "type": "LR", "level": 1, "qs": [{"id": "V-statement_assumption-3", "q": "Statement: The college canteen has raised the price of tea by two rupees. Assumptions: I. The canteen wants students to stop drinking tea. II. The college is about to shut the canteen down. Which assumption(s) is/are implicit in the statement?", "o": ["Only assumption I is implicit", "Both assumptions are implicit", "Only assumption II is implicit", "Neither assumption is implicit"], "a": 3, "x": "A small price rise need not mean the canteen wants less tea drinking (costs may have risen) and says nothing about shutting down; neither is implicit.", "cn": "An assumption is implicit only if the statement depends on it being true. Ask: does the step or claim make sense without this? Facts merely related to the topic are not assumptions.", "sl": "Original variant of a concept (new items and wording)", "t": "Statement and assumption"}, {"id": "V-course_of_action-4", "q": "Statement: The town's only playground is littered with broken glass and children are getting hurt. Courses of action: I. The municipality should get the playground cleaned and keep a dustbin at each gate. II. Parents should be told in the town notice that children play there at their own risk for now. Which course(s) of action logically follow(s)?", "o": ["Only course of action I follows", "Both courses of action follow", "Neither course of action follows", "Only course of action II follows"], "a": 1, "x": "Cleaning the ground fixes the danger, and warning parents meanwhile protects children until it is done; both follow.", "cn": "A course of action follows if it is a practical step that directly tackles the problem in the statement. Reject steps that are extreme, unrelated, or punish the wrong people.", "sl": "Original variant of a concept (new items and wording)", "t": "Statement and course of action"}, {"id": "V-l0_series_add-4", "q": "What comes next in the series 4, 9, 14, 19, 24, ?", "o": ["29", "28", "34", "30"], "a": 0, "x": "Each term is 5 more than the one before. 24 + 5 = 29.", "cn": "Find the gap between neighbouring terms. If it is the same each time, keep adding it.", "sl": "Original variant of a concept (new items and wording)", "t": "Number series (L0)"}, {"id": "V-l0_facing-3", "q": "Neha is facing west. Neha turns right, then left, then left. Which direction is Neha facing now?", "o": ["north", "west", "east", "south"], "a": 3, "x": "Start facing west. Turn right, then left, then left. Facing south.", "cn": "A right turn moves you one step clockwise (north, east, south, west). A left turn goes the other way.", "sl": "Original variant of a concept (new items and wording)", "t": "Directions (L0)"}, {"id": "V-coding_shift-3", "q": "If JAR becomes MDU in a code language, what does FAN become?", "o": ["IEQ", "JER", "IDQ", "HCP"], "a": 2, "x": "Each letter moves 3 places forward: J to M, A to D, R to U. So FAN becomes IDQ.", "cn": "In a letter code, check how each letter moves. The same shift applies to every letter of the new word.", "sl": "Original variant of a concept (new items and wording)", "t": "Coding-decoding"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
