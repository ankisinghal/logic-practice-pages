<script>const D={"id": "q33c10c68a5", "date": "2026-10-30", "type": "LR", "level": 1, "qs": [{"id": "A-statement_conclusion-o11", "q": "Statements: If the metro is running, Karan reaches his office on time. The metro is running. Conclusions: I. Karan reaches his office on time. II. The metro is late. Which conclusion follows?", "o": ["Both conclusions follow", "Only conclusion I follows", "Neither conclusion follows", "Only conclusion II follows"], "a": 1, "x": "The first statement makes reaching office on time a certain result of the metro running, and the metro is given as running, so conclusion I must be true. Conclusion II is not established by the statements, so it does not follow.", "cn": "A conclusion follows only if it MUST be true from the statements. 'If P then Q' plus P gives Q; Q alone does not give P; 'Q only if P' means Q needs P.", "sl": "Authored item for a concept (new scenario and wording)", "t": "Statements and conclusions"}, {"id": "A-statement_conclusion-o12", "q": "Statements: If it is a festival day, the market is crowded. The market is crowded. Conclusions: I. It is a festival day. II. The market could be crowded for some other reason. Which conclusion follows?", "o": ["Only conclusion II follows", "Both conclusions follow", "Neither conclusion follows", "Only conclusion I follows"], "a": 0, "x": "A crowded market can have other causes, so the crowd does not prove it is a festival day; conclusion I does not follow. Conclusion II only says there could be another reason, which stays true to the statements, so II follows.", "cn": "A conclusion follows only if it MUST be true from the statements. 'If P then Q' plus P gives Q; Q alone does not give P; 'Q only if P' means Q needs P.", "sl": "Authored item for a concept (new scenario and wording)", "t": "Statements and conclusions"}, {"id": "A-statement_conclusion-o16", "q": "Statements: The mixer starts only if the jar is locked in place. The mixer started. Conclusions: I. The jar was locked in place. II. The lid was open. Which conclusion follows?", "o": ["Both conclusions follow", "Only conclusion I follows", "Neither conclusion follows", "Only conclusion II follows"], "a": 1, "x": "'Only if the jar is locked' makes locking the jar necessary for the mixer to start. The mixer started, so the jar must have been locked; conclusion I follows. The lid is never mentioned, so conclusion II does not follow.", "cn": "A conclusion follows only if it MUST be true from the statements. 'If P then Q' plus P gives Q; Q alone does not give P; 'Q only if P' means Q needs P.", "sl": "Authored item for a concept (new scenario and wording)", "t": "Statements and conclusions"}, {"id": "A-statement_conclusion-o14", "q": "Statements: If the water tank is empty, the motor switches off. The water tank is empty. Conclusions: I. The motor switches off. II. The tank is leaking. Which conclusion follows?", "o": ["Only conclusion II follows", "Both conclusions follow", "Neither conclusion follows", "Only conclusion I follows"], "a": 3, "x": "An empty tank makes the motor switch off for certain, and the tank is given as empty, so conclusion I must be true. Leaking is never mentioned, so conclusion II does not follow.", "cn": "A conclusion follows only if it MUST be true from the statements. 'If P then Q' plus P gives Q; Q alone does not give P; 'Q only if P' means Q needs P.", "sl": "Authored item for a concept (new scenario and wording)", "t": "Statements and conclusions"}, {"id": "A-statement_conclusion-o17", "q": "Statements: If the school bell has rung, the peon is in the office. The peon is not in the office. Conclusions: I. The school bell has rung. II. The school bell has not rung. Which conclusion follows?", "o": ["Only conclusion I follows", "Both conclusions follow", "Only conclusion II follows", "Neither conclusion follows"], "a": 2, "x": "If the bell had rung, the peon would be in the office. The peon is not in the office, so the bell cannot have rung; conclusion II must be true, and conclusion I contradicts it.", "cn": "A conclusion follows only if it MUST be true from the statements. 'If P then Q' plus P gives Q; Q alone does not give P; 'Q only if P' means Q needs P.", "sl": "Authored item for a concept (new scenario and wording)", "t": "Statements and conclusions"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
