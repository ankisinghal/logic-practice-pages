<script>const D={"id": "q3518d67e90", "date": "2026-11-15", "type": "LR", "level": 1, "qs": [{"id": "V-course_of_action-12", "q": "Statement: The number of accidents at the Market Road crossing has doubled this year. Courses of action: I. Traffic police should be posted at the crossing during peak hours. II. Clear warning signs and speed breakers should be put up before the crossing. Which course(s) of action logically follow(s)?", "o": ["Neither course of action follows", "Only course of action II follows", "Both courses of action follow", "Only course of action I follows"], "a": 2, "x": "Posting traffic police and adding signs with speed breakers are both practical steps that directly reduce accidents at the crossing.", "cn": "A course of action follows if it is a practical step that directly tackles the problem in the statement. Reject steps that are extreme, unrelated, or punish the wrong people.", "sl": "Original variant of a concept (new items and wording)", "t": "Statement and course of action"}, {"id": "A-cause_effect-an20261115-1", "q": "Two statements are given: I. A storm damaged a power line, leaving a village without electricity. II. The same storm damaged the only road into that village, blocking traffic. What is the relationship between the two reported disruptions?", "o": ["Both statements are effects of a common cause", "Both statements are effects of independent causes", "Statement II is the cause and statement I is its effect", "Statement I is the cause and statement II is its effect"], "a": 0, "x": "The electricity outage and blocked road are both explicitly caused by the same storm. Neither disruption is stated to cause the other.", "cn": "First ask which event could make the other happen. If one makes the other happen, that is the cause. If a third event explains both, they are effects of a common cause; if nothing links them, the causes are independent.", "sl": "Original practice item", "t": "Cause and effect"}, {"id": "V-l0_series_add-14", "q": "What comes next in the series 2, 8, 14, 20, 26, ?", "o": ["31", "38", "32", "33"], "a": 2, "x": "Each term is 6 more than the one before. 26 + 6 = 32.", "cn": "Find the gap between neighbouring terms. If it is the same each time, keep adding it.", "sl": "Original variant of a concept (new items and wording)", "t": "Number series (L0)"}, {"id": "V-number_series-9", "q": "What comes next in the series 1, 6, 13, 22, 33, ?", "o": ["44", "49", "48", "46"], "a": 3, "x": "Each term is a square minus 3: 2^2 - 3, 3^2 - 3, 4^2 - 3, 5^2 - 3, 6^2 - 3. The next is 7^2 - 3 = 46.", "cn": "Find the gaps between terms. If the gaps themselves form a pattern, continue that pattern. Also test squares, doubling and two mixed series.", "sl": "Original variant of a concept (new items and wording)", "t": "Number series"}, {"id": "V-directions-8", "q": "Riya walks 6 km south, then turns right and walks 10 km, then turns right and walks 6 km. How far and in which direction is Riya from the starting point?", "o": ["10 km east", "10 km west", "10 km south", "10 km north"], "a": 1, "x": "Take east as +x and north as +y. After the walk the position is (-10, 0) km from the start. Distance = square root of (-10)^2 + (0)^2 = 10 km, in the west direction.", "cn": "Track each move with north, east, south and west. Turning right from north faces east, and opposite moves cancel. Distance is the straight line (Pythagoras).", "sl": "Original variant of a concept (new items and wording)", "t": "Directions"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
