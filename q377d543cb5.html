<script>const D={"id": "q377d543cb5", "date": "2026-11-20", "type": "LR", "level": 1, "qs": [{"id": "V-ranking-5", "q": "In a class of 50 students, Arjun ranks 13th from the top. What is Arjun's rank from the bottom?", "o": ["37", "39", "38", "40"], "a": 2, "x": "Rank from the bottom = total - rank from the top + 1 = 50 - 13 + 1 = 38.", "cn": "Rank from the top + rank from the bottom = total + 1, because the learner is counted in both.", "sl": "Original variant of a concept (new items and wording)", "t": "Ranking and ordering"}, {"id": "V-l0_letter_series-5", "q": "What comes next in the series H, J, L, N, P, ?", "o": ["Q", "R", "T", "S"], "a": 1, "x": "Each letter is 2 places after the one before. P + 2 = R.", "cn": "Count how many places each letter moves in the alphabet, then repeat the move.", "sl": "Original variant of a concept (new items and wording)", "t": "Letter series (L0)"}, {"id": "V-l0_facing-5", "q": "Meera is facing north. Meera turns right, then left. Which direction is Meera facing now?", "o": ["south", "west", "east", "north"], "a": 3, "x": "Start facing north. Turn right, then left. Facing north.", "cn": "A right turn moves you one step clockwise (north, east, south, west). A left turn goes the other way.", "sl": "Original variant of a concept (new items and wording)", "t": "Directions (L0)"}, {"id": "V-calendar_days-6", "q": "Today is Monday. What day of the week will it be after 59 days?", "o": ["Thursday", "Friday", "Saturday", "Tuesday"], "a": 0, "x": "A week has 7 days, so only the remainder matters. 59 = 8 x 7 + 3, so move 3 day(s) forward from Monday: Thursday.", "cn": "Divide the number of days by 7; only the remainder moves the day forward.", "sl": "Original variant of a concept (new items and wording)", "t": "Calendar (days of the week)"}, {"id": "V-clock_angle-3", "q": "What is the angle between the hour hand and the minute hand of a clock at 5:30?", "o": ["45 degrees", "30 degrees", "15 degrees", "345 degrees"], "a": 2, "x": "The hour hand is at 165 degrees from 12 (30 per hour, 0.5 per minute) and the minute hand is at 180 degrees. The difference is 15; the smaller angle is 15 degrees.", "cn": "Hour hand: 30 degrees per hour plus 0.5 per minute. Minute hand: 6 degrees per minute. Take the smaller angle.", "sl": "Original variant of a concept (new items and wording)", "t": "Clock (angle between hands)"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=async()=>{const b=document.getElementById("copy"),c=document.getElementById("code").textContent;try{await navigator.clipboard.writeText(c);b.textContent="Copied"}catch(e){b.textContent="Copy failed - code selected; copy it manually";const r=document.createRange();r.selectNodeContents(document.getElementById("code"));const s=window.getSelection();s.removeAllRanges();s.addRange(r)}};
