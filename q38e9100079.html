<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>LR practice q38e9100079</h1><p>10 questions &middot; level L1 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "q38e9100079", "date": "2026-11-10", "type": "LR", "level": 1, "qs": [{"id": "A-data_sufficiency-b24", "q": "What is the speed of a train? Statement 1: The train crosses a pole in 12 seconds. Statement 2: The train is 240 metres long. Which statement(s) are sufficient to answer the question?", "o": ["Either statement alone is sufficient", "Statement 2 alone is sufficient", "Statement 1 alone is sufficient", "Both statements together are needed"], "a": 3, "x": "Statement 1 gives only the crossing time and Statement 2 only the length; neither alone can give a speed. Together: speed = length / time = 240 / 12 = 20 m/s, so both are needed.", "cn": "A train crossing a pole covers exactly its own length, so speed needs both the length and the crossing time.", "sl": "Original practice item", "t": "Data Sufficiency"}, {"id": "A-data_sufficiency-b25", "q": "Is the integer n a multiple of 9? Statement 1: n is a multiple of 3. Statement 2: n is a multiple of 27. Which statement(s) are sufficient to answer the question?", "o": ["Either statement alone is sufficient", "Both statements together are needed", "Statement 1 alone is sufficient", "Statement 2 alone is sufficient"], "a": 3, "x": "Statement 1 does not settle it: 6 is a multiple of 3 but not of 9, while 9 is a multiple of both. Statement 2 settles it: every multiple of 27 is automatically a multiple of 9, so the answer is certainly yes. Statement 2 alone suffices.", "cn": "Every multiple of 27 is a multiple of 9, but a multiple of 3 may or may not be a multiple of 9.", "sl": "Original practice item", "t": "Data Sufficiency"}, {"id": "A-syllogism-c14", "q": "Statements: Some paintings are portraits. All portraits are framed.\nConclusions:\nI. Some paintings are framed.\nII. All paintings are framed.\nWhich conclusion(s) follow(s)?", "o": ["Neither conclusion follows", "Both conclusions follow", "Only conclusion I follows", "Only conclusion II follows"], "a": 2, "x": "The paintings that are portraits sit inside the framed group, so some paintings are definitely framed and I follows. Nothing says anything about the paintings that are not portraits, so II does not follow. Only I.", "cn": "A group that sits inside a second group carries its members along: whatever is in the smaller group is also in the larger one.", "sl": "Original practice item", "t": "Syllogism"}, {"id": "A-syllogism-c15", "q": "Statements: No buses are trams. All trams are electric vehicles.\nConclusions:\nI. No bus is an electric vehicle.\nII. Some buses are electric vehicles.\nWhich conclusion(s) follow(s)?", "o": ["Both conclusions follow", "Only conclusion I follows", "Neither conclusion follows", "Only conclusion II follows"], "a": 2, "x": "Buses lie outside the trams, and the trams sit inside the electric vehicles, but buses may or may not sit inside the larger electric-vehicle group; the statements fix nothing either way. So I does not follow and II does not follow either. Neither follows.", "cn": "When the middle group sits inside the larger one and the first group lies outside the middle, the first group and the larger one are left unrelated.", "sl": "Original practice item", "t": "Syllogism"}, {"id": "A-syllogism-c16", "q": "Statements: Some laptops are not tablets. No tablets are desktops.\nConclusions:\nI. Some laptops are not desktops.\nII. Some laptops are desktops.\nWhich conclusion(s) follow(s)?", "o": ["Neither conclusion follows", "Only conclusion I follows", "Both conclusions follow", "Only conclusion II follows"], "a": 0, "x": "The laptops that are not tablets could lie inside the desktops or outside them; the statements fix nothing between laptops and desktops in either direction. So neither I nor II follows.", "cn": "When each statement ties an end group only to the middle group, the two end groups are left unrelated.", "sl": "Original practice item", "t": "Syllogism"}, {"id": "A-seating_arrangement-c12", "q": "Six colleagues A, B, C, D, E and F sit around a rectangular table, all facing the centre. The table has two seats on each long side and one seat at each short end. Picture the table from above: the long sides run left-right, so the seats are: north side (far side) two seats N-left and N-right, south side (near side) two seats S-left and S-right, west end one seat, east end one seat.\nA sits at the west end. B sits immediately to A's own right. C sits directly opposite B. D sits at the east end. E sits immediately to D's own left. F takes the remaining seat.\nWho sits directly opposite F?", "o": ["E", "C", "D", "B"], "a": 0, "x": "A at the west end faces east, so A's own right is the south side; B takes S-left, the south seat beside A. C, directly opposite B, takes N-left. D takes the east end; facing west, D's own left is the south side, so E takes S-right. F takes the remaining seat, N-right. Directly opposite F is S-right, which is E.", "cn": "Fix each end seat first, then walk the own-left and own-right clues from the person's own facing direction.", "sl": "Original practice item", "t": "Seating Arrangement"}, {"id": "A-seating_arrangement-c13", "q": "Six friends P, Q, R, S, T and U sit in a minibus with two rows of three seats each, both rows facing forward toward the driver. In each row the seats are left, middle and right from the passengers' own point of view as they face forward. Row 1 is the front row, row 2 is directly behind it.\nP sits in the front row at the left window. Q sits immediately behind P. R sits in the middle seat of the back row. S sits in the front row but not next to P. T sits immediately in front of R. U takes the remaining seat.\nWho sits at the back-right window?", "o": ["T", "U", "S", "R"], "a": 1, "x": "P is at front-left, so Q is at back-left. R takes back-middle. S is in the front row and not next to P, so S takes front-right (front-middle is next to P). T, immediately in front of R, takes front-middle. The only seat left for U is back-right, so U sits at the back-right window.", "cn": "In a vehicle or theatre frame, front and back replace left and right between rows; pin the frame before walking the clues.", "sl": "Original practice item", "t": "Seating Arrangement"}, {"id": "A-coding_shift-c9", "q": "In a certain code, every word is rewritten by moving its first letter to the end, all other letters keeping their order. If TRAIN is written as RAINT in this code, how is PLANT written?", "o": ["LANTP", "PLANT", "PTALN", "LANSP"], "a": 0, "x": "Moving the first letter P to the end of PLANT gives L-A-N-T-P, so PLANT is written as LANTP. (TRAIN -> RAINT shows the same move.)", "cn": "Track one letter at a time: here only the first letter moves, and it goes to the very end.", "sl": "Original practice item", "t": "Coding-Decoding"}, {"id": "A-coding_shift-c10", "q": "In a certain code, every word is first written in reverse order and then each letter is moved one place forward in the alphabet. If DOG is written as HPE in this code, how is SUN written?", "o": ["OVU", "OVT", "PWM", "NUS"], "a": 1, "x": "Reversing DOG gives GOD, and moving each letter one place forward gives H-P-E, which matches. So reverse SUN to NUS, then shift each letter one place forward: N -> O, U -> V, S -> T, giving OVT.", "cn": "Apply the steps in order: reverse the word first, then shift every letter by one.", "sl": "Original practice item", "t": "Coding-Decoding"}, {"id": "A-statement_conclusion-o44", "q": "Statement: The museum admits visitors only if they have a ticket. The museum is not admitting visitors today.\nConclusions:\nI. Visitors do not have tickets today.\nII. The museum could be closed for maintenance today.\nWhich conclusion(s) logically follow(s)?", "o": ["Neither conclusion follows", "Both conclusions follow", "Only conclusion I follows", "Only conclusion II follows"], "a": 3, "x": "The rule says a ticket is necessary for admission, but admission stopping today does not tell us why: tickets could be missing, or the museum could simply be closed. So I does not follow. II states only a possibility that the statement leaves open, so II follows. Only II.", "cn": "An 'only if' rule tells you what is needed for something to happen; it says nothing about why it is not happening.", "sl": "Original practice item", "t": "Statement-Conclusion"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
