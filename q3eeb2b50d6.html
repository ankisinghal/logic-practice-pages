<script>const D={"id": "q3eeb2b50d6", "date": "2026-11-14", "type": "LR", "level": 1, "qs": [{"id": "A-syllogism-c26", "q": "Statements: Some artists are bikers. All bikers are campers. No camper is a diver. Some divers are artists. Conclusions: I. Some artists are not divers. II. Some artists are not bikers. Which conclusion(s) follow(s)?", "o": ["Neither conclusion follows", "Only conclusion I follows", "Both conclusions follow", "Only conclusion II follows"], "a": 2, "x": "The artist bikers are campers, so they are not divers, proving I. The diver artists cannot be bikers, since bikers are campers and no camper is a diver, proving II.", "cn": "Use only the stated conditions.", "sl": "Original practice item", "t": "Syllogism"}, {"id": "A-syllogism-c27", "q": "Statements: All badges are tokens. All tokens are badges. Some badges are silver objects. Conclusions: I. Some tokens are silver objects. II. All tokens are silver objects. Which conclusion(s) follow(s)?", "o": ["Only conclusion I follows", "Both conclusions follow", "Neither conclusion follows", "Only conclusion II follows"], "a": 0, "x": "Badges and tokens are the same set. The silver badges are therefore silver tokens, proving I. Other badges or tokens need not be silver, so II need not follow.", "cn": "Use only the stated conditions.", "sl": "Original practice item", "t": "Syllogism"}, {"id": "A-syllogism-c28", "q": "Statements: All poets are readers. No reader is BOTH a swimmer AND a climber. Some poets are swimmers. Conclusions: I. Some poets are not climbers. II. No climber is a poet. Which conclusion(s) follow(s)?", "o": ["Both conclusions follow", "Only conclusion I follows", "Neither conclusion follows", "Only conclusion II follows"], "a": 1, "x": "The poets known to be swimmers are readers. Since no reader can be both a swimmer and a climber, those poets are not climbers, proving I. Other poets could be climbers without being swimmers, so II need not follow.", "cn": "Use only the stated conditions.", "sl": "Original practice item", "t": "Syllogism"}, {"id": "A-seating_arrangement-c22", "q": "Six equally spaced chairs around a table are numbered 1 to 6 clockwise, viewed from above. Five people A, B, C, D and E occupy five chairs. A is in chair1. The empty chair is directly opposite A. C is immediately clockwise from B, and D is directly opposite B. E does not sit next to A. Who sits immediately ANTICLOCKWISE from the empty chair?", "o": ["B", "C", "D", "E"], "a": 3, "x": "The unique clockwise row from chair1 is A, D, E, empty, B, C. The chair immediately anticlockwise from the vacancy contains E.", "cn": "Use only the stated conditions.", "sl": "Original practice item", "t": "Seating Arrangement"}, {"id": "A-seating_arrangement-c23", "q": "Five people sit in a row of five chairs. Three adults A, B and C and two children X and Y occupy all the chairs. Neither child sits at an end, and the children do not sit next to each other. Among the adults, A is somewhere to the left of B and B is somewhere to the left of C. X is to the left of Y. Who sits in the middle chair?", "o": ["A", "X", "B", "Y"], "a": 2, "x": "The children must occupy chairs 2 and 4: the only non-end pair that is not adjacent. The adults occupy chairs 1, 3 and 5 in the order A, B, C. Thus B occupies the middle chair.", "cn": "Use only the stated conditions.", "sl": "Original practice item", "t": "Seating Arrangement"}, {"id": "A-seating_arrangement-c24", "q": "Four people A, B, C and D sit in a row in that order from the viewer's left. Each faces either north or south. A and B face the same direction. B and C face opposite directions. C and D face the same direction. D faces north. How many people face SOUTH?", "o": ["1", "3", "4", "2"], "a": 3, "x": "D faces north, so C faces north. B faces opposite C, hence south. A faces the same way as B, hence south. Two people face south.", "cn": "Use only the stated conditions.", "sl": "Original practice item", "t": "Seating Arrangement"}, {"id": "A-coding_shift-c19", "q": "A code replaces each letter with the letter two places AFTER the LAST letter of its word in the alphabet; the resulting code has the same length as the word. Wrap after Z to A. Thus CAT becomes VVV. How is FROG written?", "o": ["IIII", "GGGG", "HHHH", "JJJJ"], "a": 0, "x": "G is the last letter of FROG. Two positions after G is I. FROG has four letters, so the code is IIII.", "cn": "Use only the stated conditions.", "sl": "Original practice item", "t": "Coding Shift"}, {"id": "A-coding_shift-c20", "q": "In a coded language, each word always has one fixed code, and the codes in a sentence may appear in any order. \"red paper folds\" is coded \"ki lo ma\"; \"blue paper tears\" is coded \"su lo ne\"; and \"red cloth tears\" is coded \"ki pa ne\". What is the code for \"cloth\"?", "o": ["ki", "pa", "lo", "su"], "a": 1, "x": "The first two sentences share only paper and lo, so paper=lo. The first and third share only red and ki, so red=ki. The second and third share only tears and ne, so tears=ne. The remaining code in the third sentence is pa, so cloth=pa.", "cn": "Use only the stated conditions.", "sl": "Original practice item", "t": "Coding Shift"}, {"id": "A-coding_shift-c21", "q": "A code writes the alphabet position of the FIRST letter, then the total NUMBER of letters, then the alphabet position of the LAST letter, separated by hyphens. A=1, ..., Z=26. Thus LAMP becomes 12-4-16. How is BRIDGE written?", "o": ["2-5-5", "2-6-4", "2-6-5", "3-6-5"], "a": 2, "x": "BRIDGE begins with B=2, has six letters and ends with E=5, giving 2-6-5.", "cn": "Use only the stated conditions.", "sl": "Original practice item", "t": "Coding Shift"}, {"id": "A-statement_conclusion-o48", "q": "Statement: Each of four parcels weighs AT MOST 2 kg. Their combined weight is exactly 8 kg. Conclusions: I. Every one of the four parcels weighs exactly 2 kg. II. At least one parcel weighs less than 2 kg. Which conclusion(s) follow(s)?", "o": ["Only conclusion I follows", "Both conclusions follow", "Neither conclusion follows", "Only conclusion II follows"], "a": 0, "x": "Four parcels can total at most 4 x 2 = 8 kg. To reach that total, all four must attain the 2 kg limit. If one were lighter, no other parcel could exceed 2 kg to make up the gap.", "cn": "Use only the stated conditions.", "sl": "Original practice item", "t": "Statement Conclusion"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
