<script>const D={"id": "q4188a08ecc", "date": "2026-11-07", "type": "LR", "level": 1, "qs": [{"id": "A-statement_conclusion-o40", "q": "Statement: Unless the alarm sounds, the drill will continue as planned. The alarm sounded.\nConclusions:\nI. The drill will not continue as planned.\nII. The alarm did not sound.\nWhich conclusion(s) logically follow(s)?", "o": ["Only conclusion I follows", "Neither conclusion follows", "Only conclusion II follows", "Both conclusions follow"], "a": 1, "x": "'Unless the alarm sounds, the drill continues' promises only what happens when the alarm does NOT sound; it says nothing about what follows when it does sound, so I does not follow. II directly contradicts the given fact that the alarm sounded.", "cn": "An 'unless' rule covers only the case it names; sounding the alarm leaves the drill's fate unstated.", "sl": "Original authored item (new construction)", "t": "Statement-Conclusion"}, {"id": "A-data_sufficiency-b18", "q": "What is the price of one notebook? Statement 1: Five notebooks and three pens together cost Rs 130, and one pen costs Rs 10. Statement 2: One notebook costs twice as much as one pen. Which statement(s) are sufficient to answer the question?", "o": ["Either statement alone is sufficient", "Statement 2 alone is sufficient", "Statement 1 alone is sufficient", "Both statements together are needed"], "a": 2, "x": "Statement 1: 5 notebooks cost 130 - 3 x 10 = Rs 100, so one notebook costs Rs 20 - sufficient. Statement 2 only relates the two prices and gives no amount, so it cannot fix the price - not sufficient.", "cn": "A ratio without any actual price cannot produce a price; a total with a known part can.", "sl": "Original authored item (new construction)", "t": "Data Sufficiency"}, {"id": "A-data_sufficiency-b19", "q": "What is the circumference of a circular garden? Statement 1: Its radius is 14 m. Statement 2: Its area is 616 square m. (Use pi = 22/7.) Which statement(s) are sufficient to answer the question?", "o": ["Either statement alone is sufficient", "Statement 1 alone is sufficient", "Both statements together are needed", "Statement 2 alone is sufficient"], "a": 0, "x": "Statement 1: circumference = 2 x (22/7) x 14 = 88 m - sufficient. Statement 2: (22/7) x r^2 = 616 gives r^2 = 196, r = 14 m, so circumference = 88 m - sufficient.", "cn": "Radius fixes a circle's circumference directly, and the area fixes the radius.", "sl": "Original authored item (new construction)", "t": "Data Sufficiency"}, {"id": "A-seating_arrangement-c6", "q": "Seven chairs stand in a row facing north, numbered 1 to 7 from the viewer's left, and one chair is empty. Six friends A, B, C, D, E and F take the other six chairs. The empty chair is at one of the ends. A sits two chairs away from the empty chair. B sits immediately to the right of A (the viewer's right). C sits at the end opposite the empty chair. D sits immediately to the left of C (the viewer's left). E sits next to the empty chair.\nWho sits in chair 4, the middle chair?", "o": ["B", "D", "E", "F"], "a": 0, "x": "Try the empty chair at 1: A at 3 (two away), B at 4, C at 7 (opposite end), D at 6, E at 2 (next to the empty chair), and F takes 5. The empty chair cannot be at 7: then C would be at 1 and 'two away from the empty chair' puts A at 5, B at 6, but D would have to sit left of C, impossible. So the row is: empty, E, A, B, F, D, C - and chair 4 is B.", "cn": "Pin the viewer's frame, then test which end the empty chair can occupy; one branch contradicts itself.", "sl": "Original authored item (new construction)", "t": "Seating Arrangement"}, {"id": "A-seating_arrangement-c7", "q": "Six people K, L, M, N, O and P sit around a circular table facing OUTWARD (away from the centre). Picture the table from above with the viewer's frame pinned: north at the top. K sits at the north seat. L sits immediately to K's own left. M sits directly opposite L. N sits immediately to M's own right. O sits next to K.\nWho sits at the south seat?", "o": ["P", "O", "M", "N"], "a": 3, "x": "K sits at the north seat facing outward, so K's own left is toward the west and L takes the north-west seat. M sits directly opposite L, at the south-east seat, also facing outward. For someone facing outward, their own right is the next seat clockwise seen from above, so N - immediately to M's own right - takes the south seat. O sits next to K; the north-west seat is already L's, so O takes the north-east seat and P the remaining south-west seat. The south seat belongs to N.", "cn": "Facing outward flips left and right compared with facing the centre; pin the compass frame and walk each clue.", "sl": "Original authored item (new construction)", "t": "Seating Arrangement"}, {"id": "A-syllogism-c6", "q": "Statements: All oaks are trees. Some shrubs are not trees.\nConclusions:\nI. Some shrubs are not oaks.\nII. All shrubs are oaks.\nWhich conclusion(s) follow(s)?", "o": ["Both conclusions follow", "Neither conclusion follows", "Only conclusion I follows", "Only conclusion II follows"], "a": 2, "x": "The shrubs that are not trees cannot be oaks, because every oak is a tree - so some shrubs are not oaks: I follows. II claims all shrubs are oaks, which would make them all trees and contradicts the second statement: II does not follow.", "cn": "Whatever lies outside the larger group must also lie outside every group inside it.", "sl": "Original authored item (new construction)", "t": "Syllogism"}, {"id": "A-syllogism-c7", "q": "Statements: All folders are files. All files are records. All records are archived.\nConclusions:\nI. All folders are archived.\nII. Some archived items are not folders.\nWhich conclusion(s) follow(s)?", "o": ["Only conclusion I follows", "Only conclusion II follows", "Both conclusions follow", "Neither conclusion follows"], "a": 0, "x": "The three statements chain: folders sit inside files, files inside records, records inside the archived, so every folder is archived - I follows. The chain says nothing about other archived items, so II does not follow.", "cn": "A chain of 'all' statements carries the first group into the last; it says nothing in the reverse direction.", "sl": "Original authored item (new construction)", "t": "Syllogism"}, {"id": "A-syllogism-c8", "q": "Statements: Some nurses are not paramedics. All nurses are caregivers.\nConclusions:\nI. Some caregivers are not paramedics.\nII. All caregivers are nurses.\nWhich conclusion(s) follow(s)?", "o": ["Both conclusions follow", "Only conclusion I follows", "Neither conclusion follows", "Only conclusion II follows"], "a": 1, "x": "The nurses who are not paramedics are still nurses, and all nurses are caregivers, so those people are caregivers who are not paramedics: I follows. II reverses 'All nurses are caregivers', which a universal statement does not allow: II does not follow.", "cn": "A subgroup shared by two statements can carry a property across; reversing 'all' is never allowed.", "sl": "Original authored item (new construction)", "t": "Syllogism"}, {"id": "A-coding_shift-c3", "q": "In a certain code, every letter is replaced by its mirror letter in the alphabet (A swaps with Z, B with Y, C with X, and so on). If CAT is written as XZG in this code, how is DOG written?", "o": ["XLT", "WLU", "VLT", "WLT"], "a": 3, "x": "Mirror pairs: D swaps with W, O with L, G with T - so DOG becomes WLT. (Check: C-X, A-Z, T-G, so CAT is XZG, as given.)", "cn": "A letter and its mirror are equally far from the two ends of the alphabet; no shifting is involved.", "sl": "Original authored item (new construction)", "t": "Coding-Decoding"}, {"id": "A-coding_shift-c4", "q": "In a certain code, a six-letter word is split into two halves of three letters and the halves are swapped. If WONDER is coded as DERWON, how is MARKET coded?", "o": ["KEMTAR", "TEKMAR", "MARKET", "KETMAR"], "a": 3, "x": "MARKET splits as MAR | KET, and swapping the halves gives KETMAR. (Check: WON | DER becomes DER | WON, as given.)", "cn": "This rule swaps blocks of letters; it is not a reversal and not a letter shift.", "sl": "Original authored item (new construction)", "t": "Coding-Decoding"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
