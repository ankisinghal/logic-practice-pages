<script>const D={"id":"q4737412b5e","date":"2026-11-21","type":"LR","level":1,"qs":[{"id":"A-data_sufficiency-b43","q":"What is the value of x + y? Statement 1: x + 2y = 14. Statement 2: 2x + y = 13. Which statement(s) are sufficient to answer the question?","o":["Statement 1 alone is sufficient, but statement 2 alone is not","Statement 2 alone is sufficient, but statement 1 alone is not","Each statement alone is sufficient","Both statements together are sufficient, but neither alone is sufficient"],"a":3,"x":"Each statement alone gives only one equation in two variables. Together, adding the equations gives 3x + 3y = 27, so x + y = 9.","cn":"Use the stated conditions.","sl":"Original practice item","t":"data_sufficiency"},{"id":"A-data_sufficiency-b44","q":"What is the average of the three numbers x, y and z? Statement 1: x + y + z = 48. Statement 2: x + y = 30. Which statement(s) are sufficient to answer the question?","o":["Statement 1 alone is sufficient, but statement 2 alone is not","Statement 2 alone is sufficient, but statement 1 alone is not","Both statements together are sufficient, but neither alone is sufficient","Each statement alone is sufficient"],"a":0,"x":"Statement 1 gives the total 48, so the average is 48/3 = 16. Statement 2 gives no value or total involving z, so it is not sufficient.","cn":"Use the stated conditions.","sl":"Original practice item","t":"data_sufficiency"},{"id":"A-seating_arrangement-c54","q":"Five people A, B, C, D and E sit in five chairs numbered 1 to 5 from the viewer's left. A and E occupy the two end chairs, in either order. D sits somewhere to C's left. B sits immediately to C's right. Who sits in chair 3?","o":["B","D","C","E"],"a":2,"x":"The ends are A and E. D must be left of C, and B must be immediately right of C. The only possible middle block is D-C-B in chairs 2, 3 and 4, so C is in chair 3.","cn":"Use the stated conditions.","sl":"Original practice item","t":"seating_arrangement"},{"id":"A-seating_arrangement-c43","q":"Six people A, B, C, D, E and F sit in a row of six chairs, numbered 1 to 6 from the viewer's left. C is in chair 3 and F is in chair 6. A sits immediately to C's right. D sits immediately to F's left. B and E fill the remaining chairs. Who sits in chair 5?","o":["A","D","C","E"],"a":1,"x":"A must be in chair 4. D must be in chair 5. B and E take chairs 1 and 2, so chair 5 is D.","cn":"Use the stated conditions.","sl":"Original practice item","t":"seating_arrangement"},{"id":"A-seating_arrangement-c44","q":"Six people A, B, C, D, E and F sit in a row of six chairs, numbered 1 to 6 from the viewer's left. A is in chair 1 and E is in chair 4. B sits exactly two chairs to A's right. D sits exactly two chairs to E's right. C and F fill the remaining chairs. Who sits in chair 6?","o":["B","C","F","D"],"a":3,"x":"Exactly two chairs right of A is chair 3, so B is there. Exactly two chairs right of E is chair 6, so D is there. C and F take chairs 2 and 5.","cn":"Use the stated conditions.","sl":"Original practice item","t":"seating_arrangement"},{"id":"A-coding_shift-c50","q":"A code computes the alternating sum of alphabet positions from left to right: first position value minus the second, plus the third, minus the fourth, and so on. A=1, ..., Z=26. Thus PLANT becomes 11 because 16 - 12 + 1 - 14 + 20 = 11. What is MANGO coded as?","o":["24","30","34","35"],"a":2,"x":"For MANGO, 13 - 1 + 14 - 7 + 15 = 34.","cn":"Use the stated conditions.","sl":"Original practice item","t":"coding_shift"},{"id":"A-coding_shift-c51","q":"A code counts enclosed areas in uppercase letters. A, D, O, P, Q and R each count as 1; B counts as 2; every other letter counts as 0. It writes the total for the word. Thus DOOR becomes 4. What is BREAD coded as?","o":["5","3","4","6"],"a":0,"x":"BREAD has B=2, R=1, E=0, A=1 and D=1, for a total of 5.","cn":"Use the stated conditions.","sl":"Original practice item","t":"coding_shift"},{"id":"A-coding_shift-c52","q":"For each letter in a word, a code writes how many later letters in that same word come earlier in the alphabet. The counts are separated by hyphens. Thus CAB becomes 2-0-0. How is DRUM coded?","o":["0-1-0-1","0-1-1-0","1-1-0-0","0-0-1-1"],"a":1,"x":"For DRUM, D has no later letter before it; R has M; U has M; M has none. The code is 0-1-1-0.","cn":"Use the stated conditions.","sl":"Original practice item","t":"coding_shift"},{"id":"A-coding_shift-c53","q":"A code keeps only letters whose alphabet positions are prime numbers, preserving their order. A=1, so the prime-position letters include B=2, C=3, E=5, G=7, K=11, M=13 and Q=17. Thus CANDLE becomes CE. How is BRIDGE coded?","o":["BGE","BDE","BIE","RIG"],"a":0,"x":"In BRIDGE, B is position 2, G is 7 and E is 5. Those are prime; R, I and D are not. The code is BGE.","cn":"Use the stated conditions.","sl":"Original practice item","t":"coding_shift"},{"id":"A-statement_conclusion-o55","q":"Statements: Only employees who have a badge may enter the server room. Nikhil may enter the server room. Conclusions: I. Nikhil has a badge. II. Nikhil is an employee. Which conclusion(s) follow(s)?","o":["Only conclusion I follows","Only conclusion II follows","Neither conclusion follows","Both conclusions follow"],"a":3,"x":"Only employees who have a badge may enter. Since Nikhil may enter, he must be an employee and must have a badge.","cn":"Use the stated conditions.","sl":"Original practice item","t":"statement_conclusion"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=async()=>{const b=document.getElementById("copy"),c=document.getElementById("code").textContent;try{await navigator.clipboard.writeText(c);b.textContent="Copied"}catch(e){b.textContent="Copy failed - code selected; copy it manually";const r=document.createRange();r.selectNodeContents(document.getElementById("code"));const s=window.getSelection();s.removeAllRanges();s.addRange(r)}};
