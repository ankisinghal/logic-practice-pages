<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>Logic practice q5227d08b24</h1><p>10 questions &middot; level L1 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "q5227d08b24", "date": "2026-11-02", "type": "LR", "level": 1, "qs": [{"id": "A-dice_views-b2", "q": "A die is thrown once and its faces carry the numbers 1 to 6, one number per face. The top face shows 1, the face facing you shows 2 and the right face shows 3. The same die is now placed so that the face showing 2 is on top and the face showing 3 is facing you. Which number is on the right face? (Do not assume opposite faces add to 7; use only what the throw shows.)", "o": ["4", "Cannot be determined from one throw", "5", "1"], "a": 3, "x": "The throw shows 1, 2 and 3 meeting at one corner: with 1 on top and 2 facing you, 3 is on the right. Turning the die so that 2 goes on top and 3 faces you is one rigid turn around that same corner, and it carries 1 to the right face. So the right face shows 1.", "cn": "Turning a die does not change how its faces sit around a corner. Fix the faces you can see and turn the whole die; the face that was at a corner stays with that corner.", "sl": "Authored item for a concept (new construction and wording)", "t": "Cubes and dice"}, {"id": "V-syllogism-2", "q": "Statements: No teachers are readers. All writers are readers. (Every group named has at least one member.)\nConclusions:\nI. No writers are teachers.\nII. Some readers are teachers.\nWhich conclusion follows?", "o": ["Only I follows", "Neither follows", "Both follow", "Only II follows"], "a": 0, "x": "A conclusion follows only if it is true in every possible picture of the statements, taking each named group to have at least one member. I holds in every picture; for II a picture exists where it fails.", "cn": "A conclusion follows only if it is true in every possible picture, not just in one. \"Some A are B\" can be reversed; \"All A are B\" cannot.", "sl": "Original variant of a concept (new items and wording)", "t": "Syllogism"}, {"id": "V-seating_arrangement-2", "q": "Five friends A, B, D, E, F sit in a row facing north. D and F sit next to each other. A sits immediately to the left of D. F sits immediately to the left of B. A and F do not sit next to each other. B sits immediately to the left of E. Who sits in the middle?", "o": ["B", "F", "A", "D"], "a": 1, "x": "Place the fixed clues first, then fit the rest. The only arrangement that works, from left to right, is A D F B E, so F sits in the middle.", "cn": "Start with the clues that fix a place (ends, 'immediately left of') and then use the others to rule out the rest. Facing north, left is west.", "sl": "Original variant of a concept (new items and wording)", "t": "Seating arrangement"}, {"id": "A-coding_shift-b1", "q": "In a certain code, DOG is written as FQI. Which word is written as JCV in that code?", "o": ["IBU", "HAT", "KDW", "GZS"], "a": 1, "x": "The code moves each letter 2 places forward: D to F, O to Q, G to I. To find the original word, move each letter of JCV 2 places back: J to H, C to A, V to T. The word is HAT.", "cn": "In a letter code, check how each letter moves. The same shift applies to every letter. To find the original word from its code, move each letter the other way.", "sl": "Authored item for a concept (new construction and wording)", "t": "Coding-decoding"}, {"id": "A-statement_conclusion-o32", "q": "Statements: All engineers in this firm can code in Python. Rahul does not know Python. Conclusions: I. Rahul is not an engineer in this firm. II. Rahul cannot code at all. Which conclusion follows?", "o": ["Only conclusion II follows", "Both conclusions follow", "Only conclusion I follows", "Neither conclusion follows"], "a": 2, "x": "Every engineer in this firm can code in Python, so someone who does not know Python cannot be an engineer in this firm - the statements rule Rahul out (conclusion I). The statements say nothing about other languages, so Rahul might still code in some other language; conclusion II goes beyond what is given and does not follow.", "cn": "A conclusion follows only if it MUST be true from the statements. 'All A are B' plus 'not B' gives 'not A'; what goes beyond the statements does not follow.", "sl": "Authored item for a concept (new scenario and wording)", "t": "Statements and conclusions"}, {"id": "A-statement_conclusion-o33", "q": "Statements: The drone show goes ahead only if the wind speed stays below the limit. The wind speed is above the limit. Conclusions: I. The drone show does not go ahead. II. The wind will slow down later in the evening. Which conclusion follows?", "o": ["Both conclusions follow", "Neither conclusion follows", "Only conclusion II follows", "Only conclusion I follows"], "a": 3, "x": "'Goes ahead only if the wind stays below the limit' means a wind below the limit is necessary for the show. The wind is above the limit, so the necessary condition fails and the show cannot go ahead (conclusion I). The statements say nothing about what the wind will do later, so conclusion II does not follow.", "cn": "A conclusion follows only if it MUST be true from the statements. 'If P then Q' plus P gives Q; Q alone does not give P; 'Q only if P' means Q needs P.", "sl": "Authored item for a concept (new scenario and wording)", "t": "Statements and conclusions"}, {"id": "A-statement_conclusion-o34", "q": "Statements: The parcel will arrive today or tomorrow. The parcel did not arrive today. Conclusions: I. The parcel will arrive tomorrow. II. The parcel has been lost. Which conclusion follows?", "o": ["Only conclusion I follows", "Neither conclusion follows", "Both conclusions follow", "Only conclusion II follows"], "a": 0, "x": "The statements give exactly two possibilities: today or tomorrow. It did not arrive today, so the only possibility left is tomorrow (conclusion I). The statements say nothing about the parcel being lost, so conclusion II does not follow.", "cn": "A conclusion follows only if it MUST be true from the statements. 'P or Q' plus 'not P' gives Q; anything outside the listed possibilities does not follow.", "sl": "Authored item for a concept (new scenario and wording)", "t": "Statements and conclusions"}, {"id": "A-data_sufficiency-b1", "q": "A shop sells pens at the same price each. What is the total cost of 6 pens? Statement 1: 4 pens cost Rs 60. Statement 2: Each pen costs Rs 15. Which statement(s) are sufficient to answer the question?", "o": ["Both statements together are needed", "Statement 2 alone is sufficient", "Either statement alone is sufficient", "Statement 1 alone is sufficient"], "a": 2, "x": "Statement 1 alone: 4 pens cost Rs 60, so one pen costs Rs 15 and 6 pens cost Rs 90 - sufficient. Statement 2 alone: 6 x Rs 15 = Rs 90 - sufficient. Each statement alone fixes the total, so either statement alone is sufficient.", "cn": "Do not solve fully: ask whether the statements FIX a single answer. Test each statement alone first, then both together.", "sl": "Authored item for a concept (new construction and wording)", "t": "Data sufficiency"}, {"id": "A-data_sufficiency-b2", "q": "What is the value of x? Statement 1: x + y = 30. Statement 2: x is the average of 24 and 32. Which statement(s) are sufficient to answer the question?", "o": ["Either statement alone is sufficient", "Statement 2 alone is sufficient", "Statement 1 alone is sufficient", "Both statements together are needed"], "a": 1, "x": "Statement 1 alone is one equation in two unknowns; many pairs add to 30 with different x, so it is not sufficient. Statement 2 alone fixes x = (24 + 32)/2 = 28, so it is sufficient. So statement 2 alone is sufficient.", "cn": "Do not solve fully: ask whether the statements FIX a single answer. Test each statement alone first, then both together.", "sl": "Authored item for a concept (new construction and wording)", "t": "Data sufficiency"}, {"id": "A-data_sufficiency-b3", "q": "Is the integer n divisible by 6? Statement 1: n is divisible by 2. Statement 2: n is divisible by 3. Which statement(s) are sufficient to answer the question?", "o": ["Statement 1 alone is sufficient", "Either statement alone is sufficient", "Statement 2 alone is sufficient", "Both statements together are needed"], "a": 3, "x": "Statement 1 alone: a multiple of 2 may or may not be divisible by 6 (2 is not, 6 is) - not sufficient. Statement 2 alone: a multiple of 3 may or may not be divisible by 6 (3 is not, 6 is) - not sufficient. Together: a number divisible by both 2 and 3 is divisible by their lowest common multiple, 6, so the answer is fixed - both statements together are needed.", "cn": "Do not solve fully: ask whether the statements FIX a single answer. Test each statement alone first, then both together.", "sl": "Authored item for a concept (new construction and wording)", "t": "Data sufficiency"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
