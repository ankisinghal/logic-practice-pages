<script>const D={"id": "q54dfebb30e", "date": "2026-11-28", "type": "LR", "level": 1, "qs": [{"id": "V-coding_shift-5", "q": "In a certain code, CUP is written as GYT. How is DOG written in that code?", "o": ["HTK", "GRJ", "HSK", "ITL"], "a": 2, "x": "Each letter moves 4 places forward: C to G, U to Y, P to T. So DOG becomes HSK.", "cn": "In a letter code, check how each letter moves. The same shift applies to every letter of the new word.", "sl": "Original variant of a concept (new items and wording)", "t": "Coding-decoding"}, {"id": "V-course_of_action-19", "q": "Statement: A residential colony's street lights have not worked for a month and thefts have risen. Courses of action: I. The colony should stop residents from stepping out of their homes after dark. II. The residents' association should file a written complaint with the electricity department. Which course(s) of action logically follow(s)?", "o": ["Only course of action II follows", "Neither course of action follows", "Only course of action I follows", "Both courses of action follow"], "a": 0, "x": "A written complaint to the electricity department directly seeks repair of the lights; stopping residents from stepping out punishes them instead of fixing the lights.", "cn": "A course of action follows if it is a practical step that directly tackles the problem in the statement. Reject steps that are extreme, unrelated, or punish the wrong people.", "sl": "Original variant of a concept (new items and wording)", "t": "Statement and course of action"}, {"id": "V-statement_assumption-19", "q": "Statement: The railway has posted extra ticket-checking staff at the main station this month. Assumptions: I. The railway plans to close the main station. II. The railway believes checks can reduce ticketless travel. Which assumption(s) is/are implicit in the statement?", "o": ["Both assumptions are implicit", "Only assumption I is implicit", "Neither assumption is implicit", "Only assumption II is implicit"], "a": 3, "x": "Posting checking staff assumes checks deter ticketless travel; closing the station is unrelated to this step.", "cn": "An assumption is implicit only if the statement depends on it being true. Ask: does the step or claim make sense without this? Facts merely related to the topic are not assumptions.", "sl": "Original variant of a concept (new items and wording)", "t": "Statement and assumption"}, {"id": "V-number_series-15", "q": "What comes next in the series 8, 15, 24, 35, 48, ?", "o": ["61", "66", "63", "65"], "a": 2, "x": "Each term is a square minus 1: 3^2 - 1, 4^2 - 1, 5^2 - 1, 6^2 - 1, 7^2 - 1. The next is 8^2 - 1 = 63.", "cn": "Find the gaps between terms. If the gaps themselves form a pattern, continue that pattern. Also test squares, doubling and two mixed series.", "sl": "Original variant of a concept (new items and wording)", "t": "Number series"}, {"id": "V-ranking-6", "q": "Neha ranks 28th from the top in a class. There are 32 students below Neha. How many students are in the class?", "o": ["59", "60", "61", "62"], "a": 1, "x": "Students above Neha: 27. Students below: 32. Total = 27 + 1 + 32 = 60.", "cn": "Rank from the top + rank from the bottom = total + 1, because the learner is counted in both.", "sl": "Original variant of a concept (new items and wording)", "t": "Ranking and ordering"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=async()=>{const b=document.getElementById("copy"),c=document.getElementById("code").textContent;try{await navigator.clipboard.writeText(c);b.textContent="Copied"}catch(e){b.textContent="Copy failed - code selected; copy it manually";const r=document.createRange();r.selectNodeContents(document.getElementById("code"));const s=window.getSelection();s.removeAllRanges();s.addRange(r)}};
</script></body></html>
