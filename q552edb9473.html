<script>const D={"id": "q552edb9473", "date": "2026-10-12", "type": "LR", "level": 1, "qs": [{"id": "V-syllogism-13", "q": "Statements: Some coins are metals. No things are metals.\nConclusions:\nI. Some coins are things.\nII. Some metals are coins.\nWhich conclusion follows?", "o": ["Only II follows", "Only I follows", "Both follow", "Neither follows"], "a": 0, "x": "A conclusion follows only if it is true in every possible picture of the statements. II holds in every picture; for I a picture exists where it fails.", "cn": "A conclusion follows only if it is true in every possible picture, not just in one. \"Some A are B\" can be reversed; \"All A are B\" cannot.", "sl": "Original variant of a concept (new items and wording)", "t": "Syllogism"}, {"id": "L002", "q": "What comes next in the series B, E, H, K, ?", "o": ["N", "O", "P", "M"], "a": 0, "x": "Each letter is 3 places after the one before: B, E, H, K, then N.", "cn": "Turn letters into their alphabet positions (A=1, B=2 ...). Find the constant step, then convert back.", "sl": "Original question (checked by code)", "t": "Letter series"}, {"id": "L004", "q": "Pointing to a man, Riya says, \"He is the son of my mother's only brother.\" How is the man related to Riya?", "o": ["Brother", "Nephew", "Cousin", "Uncle"], "a": 2, "x": "Riya's mother's brother is Riya's maternal uncle. His son is Riya's cousin.", "cn": "Break the relation into steps. Mother's brother is the maternal uncle, and his children are your cousins.", "sl": "Original question (checked by code)", "t": "Blood relations"}, {"id": "L008", "q": "Four people P, Q, R and S have different heights. P is taller than Q. R is shorter than Q. S is taller than P. Who is the second tallest?", "o": ["Q", "P", "S", "R"], "a": 1, "x": "S > P, P > Q and Q > R, so the order from tallest is S, P, Q, R. The second tallest is P.", "cn": "Chain the comparisons into one line (S > P > Q > R), then read off the position asked.", "sl": "Original question (checked by code)", "t": "Ordering"}, {"id": "V-ranking-13", "q": "Meera ranks 22nd from the top in a class. There are 23 students below Meera. How many students are in the class?", "o": ["47", "44", "46", "45"], "a": 3, "x": "Students above Meera: 21. Students below: 23. Total = 21 + 1 + 23 = 45.", "cn": "Rank from the top + rank from the bottom = total + 1, because the learner is counted in both.", "sl": "Original variant of a concept (new items and wording)", "t": "Ranking and ordering"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent="QL|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
