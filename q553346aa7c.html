<script>const D={"id": "q553346aa7c", "date": "2026-10-25", "type": "LR", "level": 1, "qs": [{"id": "V-seating_arrangement-135", "q": "Five friends A, B, C, D, E sit in a row facing north. D sits immediately to the left of A. E sits at the right end. C and D do not sit next to each other. D sits at the left end. C and E do not sit next to each other. Who sits in the middle?", "o": ["C", "B", "A", "D"], "a": 0, "x": "Place the fixed clues first, then fit the rest. The only arrangement that works, from left to right, is D A C B E, so C sits in the middle.", "cn": "Start with the clues that fix a place (ends, 'immediately left of') and then use the others to rule out the rest. Facing north, left is west.", "sl": "Original variant of a concept (new items and wording)", "t": "Seating arrangement"}, {"id": "V-count_squares-35", "q": "How many squares of all sizes are there in a 3 x 3 square grid (made of 9 small unit squares)?", "o": ["9", "17", "11", "14"], "a": 3, "x": "Squares of side k number (3-k+1)^2. Adding for k = 1 to 3: 9 + 4 + 1 = 14.", "cn": "Count squares of each side length separately: side k fits (n - k + 1)^2 times. Then add.", "sl": "Original variant of a concept (new items and wording)", "t": "Counting figures (squares in a grid)"}, {"id": "V-statement_conclusion-35", "q": "Statements: If the price rises, demand falls. Demand falls. Conclusions: I. The price rises. II. Whether the price rises happened cannot be concluded from the statements. Which conclusion follows?", "o": ["Both conclusions follow", "Neither conclusion follows", "Only conclusion II follows", "Only conclusion I follows"], "a": 2, "x": "Knowing demand falls happened does not prove the price rises caused it: other causes of demand falls are not ruled out by the statements. So conclusion I does not follow, and conclusion II correctly states that nothing about the price rises can be concluded.", "cn": "A conclusion follows only if it must be true in every case the statements allow. 'If P then Q' gives Q when P is true, but gives nothing about P when Q is true; 'Q only if P' makes P necessary for Q.", "sl": "Original variant of a concept (new items and wording)", "t": "Statements and conclusions"}, {"id": "V-data_sufficiency-35", "q": "What is the value of x + y? Statement 1: x = 9. Statement 2: y = 7. Which statement(s) are sufficient to answer the question?", "o": ["Statement 2 alone is sufficient", "Both statements together are needed", "Statement 1 alone is sufficient", "Either statement alone is sufficient"], "a": 1, "x": "Statement 1 alone gives only x = 9; statement 2 alone gives only y = 7. Together x + y = 9 + 7 = 16. Neither alone answers the question.", "cn": "Do not solve fully: ask whether the statements FIX a single answer. Test each statement alone first, then both together.", "sl": "Original variant of a concept (new items and wording)", "t": "Data sufficiency"}, {"id": "V-critical_reasoning-35", "q": "Argument: A school started a morning exercise programme, claiming it will raise exam scores. Which of the following most WEAKENS this argument?", "o": ["The school's exam scores had already been rising steadily for two years before the programme began.", "The programme costs the school very little money because its own teachers run the sessions.", "Many parents had been asking the school for years to add more physical activity to the day.", "Students say they enjoy the morning sessions very much and feel fresh and alert in first class."], "a": 0, "x": "The argument assumes the action will fix the real cause of the problem. The correct option breaks that link: The school's exam scores had already been rising steadily for two years before the programme began. The other options are neutral background or mildly supportive, so they do not weaken the claim.", "cn": "To weaken a causal argument, look for the option that breaks the link between the proposed action and the intended result - often another cause or a missing route.", "sl": "Original variant of a concept (new items and wording)", "t": "Critical reasoning (weaken)"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
