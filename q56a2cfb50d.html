<script>const D={"id": "q56a2cfb50d", "date": "2026-10-12", "type": "LR", "level": 1, "qs": [{"id": "L002", "q": "What comes next in the series B, E, H, K, ?", "o": ["M", "N", "O", "P"], "a": 1, "x": "Each letter is 3 places after the one before: B, E, H, K, then N.", "cn": "Turn letters into their alphabet positions (A=1, B=2 ...). Find the constant step, then convert back.", "sl": "Original question (checked by code)", "t": "Letter series"}, {"id": "L004", "q": "Pointing to a man, Riya says, \"He is the son of my mother's only brother.\" How is the man related to Riya?", "o": ["Uncle", "Brother", "Cousin", "Nephew"], "a": 2, "x": "Riya's mother's brother is Riya's maternal uncle. His son is Riya's cousin.", "cn": "Break the relation into steps. Mother's brother is the maternal uncle, and his children are your cousins.", "sl": "Original question (checked by code)", "t": "Blood relations"}, {"id": "L008", "q": "Four people P, Q, R and S have different heights. P is taller than Q. R is shorter than Q. S is taller than P. Who is the second tallest?", "o": ["Q", "S", "R", "P"], "a": 3, "x": "S > P, P > Q and Q > R, so the order from tallest is S, P, Q, R. The second tallest is P.", "cn": "Chain the comparisons into one line (S > P > Q > R), then read off the position asked.", "sl": "Original question (checked by code)", "t": "Ordering"}, {"id": "L001", "q": "What comes next in the series 3, 8, 15, 24, 35, ?", "o": ["49", "47", "45", "48"], "a": 3, "x": "The gaps are 5, 7, 9, 11, so the next gap is 13 and 35 + 13 = 48. Each term is also n^2 - 1 for n = 2, 3, 4, ... and n = 7 gives 48.", "cn": "Find the gaps between terms. If the gaps themselves form a pattern (here 5, 7, 9, 11), continue that pattern.", "sl": "Original question (checked by code)", "t": "Number series"}, {"id": "L006", "q": "Statements: All pens are books. Some books are bags.\nConclusions:\nI. Some pens are bags.\nII. Some bags are books.\nWhich conclusion follows?", "o": ["Only II follows", "Neither follows", "Only I follows", "Both follow"], "a": 0, "x": "\"Some books are bags\" can be turned around to \"Some bags are books\", so II follows. The pens could all sit in the part of books that has no bags, so I need not be true.", "cn": "\"Some A are B\" can be reversed to \"Some B are A\". A conclusion follows only if it is true in every possible picture, not just in one.", "sl": "Original question (checked by code)", "t": "Syllogism"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
