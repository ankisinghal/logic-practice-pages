<script>const D={"id": "q59e941e9e4", "date": "2026-10-28", "type": "LR", "level": 1, "qs": [{"id": "A-statement_conclusion-o6", "q": "Statements: If the library is open, Maya can borrow the book. The library is open. Conclusions: I. Maya can borrow the book. II. The library is not open. Which conclusion follows?", "o": ["Only conclusion I follows", "Both conclusions follow", "Neither conclusion follows", "Only conclusion II follows"], "a": 0, "x": "The first statement makes 'Maya can borrow the book' a certain result of the library being open, and the library is given as open, so conclusion I must be true. Conclusion II denies a given fact, so it does not follow.", "cn": "A conclusion follows only if it MUST be true from the statements. 'If P then Q' plus P gives Q; Q alone does not give P; 'Q only if P' means Q needs P.", "sl": "Authored item for a concept (new scenario and wording)", "t": "Statements and conclusions"}, {"id": "A-statement_conclusion-o7", "q": "Statements: Riya can board the flight only if she has a boarding pass. Riya boarded the flight. Conclusions: I. Riya had a boarding pass. II. Riya did not have a boarding pass. Which conclusion follows?", "o": ["Both conclusions follow", "Neither conclusion follows", "Only conclusion I follows", "Only conclusion II follows"], "a": 2, "x": "'Riya can board the flight only if she has a boarding pass' makes a boarding pass necessary for boarding. Since Riya boarded, she must have had a boarding pass (conclusion I). Conclusion II contradicts that, so it does not follow.", "cn": "A conclusion follows only if it MUST be true from the statements. 'If P then Q' plus P gives Q; Q alone does not give P; 'Q only if P' means Q needs P.", "sl": "Authored item for a concept (new scenario and wording)", "t": "Statements and conclusions"}, {"id": "A-statement_conclusion-o8", "q": "Statements: If it snows overnight, the roads are slippery. The roads are slippery. Conclusions: I. It snowed overnight. II. The roads could be slippery for some other reason, so the statements do not prove that it snowed overnight. Which conclusion follows?", "o": ["Only conclusion I follows", "Both conclusions follow", "Neither conclusion follows", "Only conclusion II follows"], "a": 3, "x": "Knowing the roads are slippery does not prove snow caused it: rain or frost could make them slippery too, and the statements do not rule those out. So conclusion I does not follow, and conclusion II correctly states that snow cannot be concluded.", "cn": "A conclusion follows only if it MUST be true from the statements. 'If P then Q' plus P gives Q; Q alone does not give P; 'Q only if P' means Q needs P.", "sl": "Authored item for a concept (new scenario and wording)", "t": "Statements and conclusions"}, {"id": "A-statement_conclusion-o9", "q": "Statements: If the gate is locked, the dog cannot get out. The gate is locked. Conclusions: I. The dog cannot get out. II. The dog can get out. Which conclusion follows?", "o": ["Neither conclusion follows", "Only conclusion I follows", "Only conclusion II follows", "Both conclusions follow"], "a": 1, "x": "The first statement makes 'the dog cannot get out' a certain result of the gate being locked, and the gate is given as locked, so conclusion I must be true. Conclusion II denies that result, so it does not follow.", "cn": "A conclusion follows only if it MUST be true from the statements. 'If P then Q' plus P gives Q; Q alone does not give P; 'Q only if P' means Q needs P.", "sl": "Authored item for a concept (new scenario and wording)", "t": "Statements and conclusions"}, {"id": "A-statement_conclusion-o10", "q": "Statements: The plants will grow well only if they get enough sunlight. The plants are growing well. Conclusions: I. The plants are getting enough sunlight. II. The plants are not getting enough sunlight. Which conclusion follows?", "o": ["Only conclusion I follows", "Both conclusions follow", "Neither conclusion follows", "Only conclusion II follows"], "a": 0, "x": "'The plants will grow well only if they get enough sunlight' makes enough sunlight necessary for growing well. Since the plants are growing well, they must be getting enough sunlight (conclusion I). Conclusion II contradicts that, so it does not follow.", "cn": "A conclusion follows only if it MUST be true from the statements. 'If P then Q' plus P gives Q; Q alone does not give P; 'Q only if P' means Q needs P.", "sl": "Authored item for a concept (new scenario and wording)", "t": "Statements and conclusions"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
