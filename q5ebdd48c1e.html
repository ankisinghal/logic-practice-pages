<script>const D={"id": "q5ebdd48c1e", "date": "2026-10-27", "type": "LR", "level": 1, "qs": [{"id": "V-statement_conclusion-547", "q": "Statements: If it rains, the match is cancelled. It rains. Conclusions: I. The match is cancelled. II. It rains does not happen. Which conclusion follows?", "o": ["Both conclusions follow", "Neither conclusion follows", "Only conclusion II follows", "Only conclusion I follows"], "a": 3, "x": "The first statement makes the match is cancelled a certain result of it rains. Since it rains is given as true, the match is cancelled must happen (conclusion I). Conclusion II denies a given fact, so it does not follow.", "cn": "A conclusion follows only if it must be true in every case the statements allow. 'If P then Q' gives Q when P is true, but gives nothing about P when Q is true; 'Q only if P' makes P necessary for Q.", "sl": "Original variant of a concept (new items and wording)", "t": "Statements and conclusions"}, {"id": "V-statement_conclusion-647", "q": "Statements: If the train is late, he misses the meeting. He misses the meeting. Conclusions: I. The train is late. II. Whether the train is late happened cannot be concluded from the statements. Which conclusion follows?", "o": ["Neither conclusion follows", "Only conclusion II follows", "Both conclusions follow", "Only conclusion I follows"], "a": 1, "x": "Knowing he misses the meeting happened does not prove the train is late caused it: other causes of he misses the meeting are not ruled out by the statements. So conclusion I does not follow, and conclusion II correctly states that nothing about the train is late can be concluded.", "cn": "A conclusion follows only if it must be true in every case the statements allow. 'If P then Q' gives Q when P is true, but gives nothing about P when Q is true; 'Q only if P' makes P necessary for Q.", "sl": "Original variant of a concept (new items and wording)", "t": "Statements and conclusions"}, {"id": "V-statement_conclusion-247", "q": "St nclusions follow", "Only conclusion II follows", "Only conclusion I follows"], "a": 2, "x": "Knowing the match is cancelled happened does not prove it rains caused it: other causes of the match is cancelled are not ruled out by the statements. So conclusion I does not follow, and conclusion II correctly states that nothing about it rains can be concluded.", "cn": "A conclusion follows only if it must be true in every case the statements allow. 'If P then Q' gives Q when P is true, but gives nothing about P when Q is true; 'Q only if P' makes P necessary for Q.", "sl": "Original variant of a concept (new items and wording)", "t": "Statements and conclusions"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
