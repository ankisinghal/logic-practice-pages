<script>const D={"id": "q656cd166d9", "date": "2026-11-27", "type": "LR", "level": 1, "qs": [{"id": "A-dice_stacked_sum-d4", "q": "Two standard dice (on each, opposite faces add to 7) are stacked one on top of the other on a table. The top face of the upper die shows 2. The touching face of the lower die (its top face) shows 4. What is the sum of all the faces that can be seen?", "o": ["28", "32", "26", "30"], "a": 3, "x": "All faces of two dice total 21 + 21 = 42. Hidden faces: the bottom of the upper die (opposite 2, so 5), the top of the lower die (4), and the bottom of the lower die (opposite 4, so 3). So the visible sum is 42 - (5 + 4 + 3) = 30.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "dice_stacked_sum"}, {"id": "A-seating_arrangement-c82", "q": "Six people A, B, C, D, E and F sit at a triangular table, two on each side, all facing the centre. The six seats are numbered 1 to 6 clockwise, so side one holds seats 1 and 2, side two holds seats 3 and 4, and side three holds seats 5 and 6; seats with consecutive numbers (and seats 6 and 1) are next to each other. A sits in seat 1. B sits on the same side as A. C sits next to B. D sits next to C. E does not sit next to A and does not sit on the same side as C. F takes the remaining seat. Who sits in seat 5?", "o": ["D", "C", "E", "F"], "a": 2, "x": "A in seat 1 puts B in seat 2 (same side). C next to B must be in seat 3 (seat 1 is taken), and D next to C must be in seat 4 (seat 2 is taken). E cannot sit next to A (not seats 2 or 6) and not on the same side as C (not seats 3 or 4), leaving only seat 5 for E, and F takes seat 6.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "seating_arrangement"}, {"id": "A-seating_arrangement-c83", "q": "Eight seats in a cinema row are numbered 1 to 8 from the left, with an aisle splitting the row into a left block (seats 1 to 4) and a right block (seats 5 to 8); seats are next to each other only within the same block. Six friends A, B, C, D, E and F take six seats, leaving exactly two seats empty, and the two empty seats are next to each other. A sits in seat 1. B sits in seat 5, at the aisle end of the right block. D sits next to B. C sits at the far right end. E sits in the left block but not next to A. F takes one more seat. Which two seats are empty?", "o": ["3 and 4", "2 and 3", "6 and 7", "2 and 7"], "a": 1, "x": "A in 1, B in 5, D next to B gives seat 6, and C takes seat 8. E sits in the left block away from A, so seat 3 or 4. The empties must be adjacent; the only way is E in seat 4 and F in seat 7, leaving seats 2 and 3 empty and together.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "seating_arrangement"}, {"id": "A-coding_shift-c84", "q": "In a certain code, letters are replaced one for one using a fixed table. Part of the table reads: B is written as T, I as K, R as W, D as Q, S as M, and A as P. (The table covers the whole alphabet; only some pairs are listed.) Under this code, BIRD is written as TKWQ. How is BIRDS written?", "o": ["TKWMQ", "TKWQP", "TKWQM", "TKQWM"], "a": 2, "x": "Applying the table letter by letter: B = T, I = K, R = W, D = Q, and S = M, so BIRDS becomes TKWQM.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "coding_shift"}, {"id": "A-coding_shift-c85", "q": "A code renumbers the alphabet starting from the first letter of the word itself: that first letter is called 1, the next letter of the alphabet is 2, and so on, wrapping from Z back to A. Each letter of the word is then written as its number in this renumbering, and the numbers are separated by hyphens. Thus DOG becomes 1-12-4, because D = 1, E = 2, and so on, giving O = 12 and G = 4. How is PEN coded?", "o": ["1-15-24", "1-16-25", "2-16-25", "1-16-24"], "a": 1, "x": "Starting the count at P: P = 1, Q = 2, and continuing around the alphabet gives E = 16 and N = 25, so PEN becomes 1-16-25.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "coding_shift"}, {"id": "A-data_sufficiency-b56", "q": "Is the positive integer N a perfect square? Statement 1: N is the product of two consecutive even positive integers. Statement 2: N is divisible by 4. Which statement(s) are sufficient?", "o": ["Statement 2 alone is sufficient, but statement 1 alone is not", "Statement 1 alone is sufficient, but statement 2 alone is not", "Both statements together are sufficient, but neither alone is sufficient", "Each statement alone is sufficient"], "a": 1, "x": "Statement 1 alone: if N = m(m + 2) with m even, then m^2 < N < (m + 1)^2, so N lies strictly between two consecutive squares and can never be a perfect square; the answer is always no, so statement 1 is sufficient. Statement 2 alone: 4 is a square but 8 is not, so it is not sufficient.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "data_sufficiency"}, {"id": "A-data_sufficiency-b57", "q": "What is the positive integer N? Statement 1: N is divisible by 7 and lies between 20 and 40. Statement 2: N is the smallest positive integer that leaves a remainder of 2 when divided by 3 and a remainder of 3 when divided by 4. Which statement(s) are sufficient?", "o": ["Statement 1 alone is sufficient, but statement 2 alone is not", "Both statements together are sufficient, but neither alone is sufficient", "Statement 2 alone is sufficient, but statement 1 alone is not", "Each statement alone is sufficient"], "a": 2, "x": "Statement 1 alone allows 21, 28 and 35, so it is not sufficient. Statement 2 alone: the conditions mean N + 1 is divisible by both 3 and 4, so N + 1 is a multiple of 12 and the smallest such N is 11; it fixes N exactly, so statement 2 is sufficient.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "data_sufficiency"}, {"id": "A-syllogism-c33", "q": "Statements: No painter is a singer. All dancers are singers. (Every group named has at least one member.) Conclusions: I. No dancer is a painter. II. Some singers are dancers. Which conclusion(s) follow(s)?", "o": ["Both conclusions follow", "Only conclusion I follows", "Only conclusion II follows", "Neither conclusion follows"], "a": 0, "x": "All dancers are singers, so some singers are dancers and II follows. Since no singer is a painter, no dancer (all of whom are singers) can be a painter, so I follows.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "syllogism"}, {"id": "A-syllogism-c34", "q": "Statements: Some baskets are red. All red things are fragile. (Every group named has at least one member.) Conclusions: I. Some baskets are fragile. II. All baskets are fragile. Which conclusion(s) follow(s)?", "o": ["Only conclusion I follows", "Only conclusion II follows", "Both conclusions follow", "Neither conclusion follows"], "a": 0, "x": "The baskets that are red are also fragile, since all red things are fragile, so I follows. The other baskets may not be red, so II is not forced.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "syllogism"}, {"id": "A-statement_conclusion-o66", "q": "Statement: In a class of 40 students, 25 play cricket and 18 play football, and 7 students play both games. Conclusions: I. Exactly 4 students play neither game. II. More students play only cricket than only football. Which conclusion(s) follow(s)?", "o": ["Only conclusion I follows", "Only conclusion II follows", "Neither conclusion follows", "Both conclusions follow"], "a": 3, "x": "Students playing at least one game: 25 + 18 - 7 = 36, so 40 - 36 = 4 play neither, and I follows. Only cricket is 25 - 7 = 18 and only football is 18 - 7 = 11, so II follows.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "statement_conclusion"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
