<script>const D={"id": "q68e481e525", "date": "2026-11-13", "type": "LR", "level": 1, "qs": [{"id": "V-course_of_action-11", "q": "Statement: A residential colony's street lights have not worked for a month and thefts have risen. Courses of action: I. The residents' association should file a written complaint with the electricity department. II. The colony should stop residents from stepping out of their homes after dark. Which course(s) of action logically follow(s)?", "o": ["Both courses of action follow", "Neither course of action follows", "Only course of action I follows", "Only course of action II follows"], "a": 2, "x": "A written complaint to the electricity department directly seeks repair of the lights; stopping residents from stepping out punishes them instead of fixing the lights.", "cn": "A course of action follows if it is a practical step that directly tackles the problem in the statement. Reject steps that are extreme, unrelated, or punish the wrong people.", "sl": "Original variant of a concept (new items and wording)", "t": "Statement and course of action"}, {"id": "V-statement_assumption-10", "q": "Statement: A shopkeeper put up a board: 'Prices reduced by half this week.' Assumptions: I. The shopkeeper is closing the shop permanently. II. The shopkeeper expects the lower prices to attract more customers. Which assumption(s) is/are implicit in the statement?", "o": ["Only assumption II is implicit", "Both assumptions are implicit", "Only assumption I is implicit", "Neither assumption is implicit"], "a": 0, "x": "Announcing a discount assumes customers respond to lower prices; the board says nothing about closing down.", "cn": "An assumption is implicit only if the statement depends on it being true. Ask: does the step or claim make sense without this? Facts merely related to the topic are not assumptions.", "sl": "Original variant of a concept (new items and wording)", "t": "Statement and assumption"}, {"id": "V-l0_series_add-10", "q": "What comes next in the series 5, 11, 17, 23, 29, ?", "o": ["41", "34", "35", "36"], "a": 2, "x": "Each term is 6 more than the one before. 29 + 6 = 35.", "cn": "Find the gap between neighbouring terms. If it is the same each time, keep adding it.", "sl": "Original variant of a concept (new items and wording)", "t": "Number series (L0)"}, {"id": "V-number_series-7", "q": "What comes next in the series 3, 30, 6, 25, 9, 20, ?", "o": ["15", "11", "13", "12"], "a": 3, "x": "Two series are mixed. The odd places go 3, 6, 9 (add 3) and the even places go 30, 25, 20 (subtract 5). The next term is the next odd-place term: 9 + 3 = 12.", "cn": "Find the gaps between terms. If the gaps themselves form a pattern, continue that pattern. Also test squares, doubling and two mixed series.", "sl": "Original variant of a concept (new items and wording)", "t": "Number series"}, {"id": "V-directions-6", "q": "Arjun walks 15 km north, then turns left and walks 8 km. How far and in which direction is Arjun from the starting point?", "o": ["17 km south", "17 km north-west", "23 km north-west", "17 km north-east"], "a": 1, "x": "Take east as +x and north as +y. After the walk the position is (-8, 15) km from the start. Distance = square root of (-8)^2 + (15)^2 = 17 km, in the north-west direction.", "cn": "Track each move with north, east, south and west. Turning right from north faces east, and opposite moves cancel. Distance is the straight line (Pythagoras).", "sl": "Original variant of a concept (new items and wording)", "t": "Directions"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
