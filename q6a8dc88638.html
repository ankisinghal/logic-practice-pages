<script>const D={"id": "q6a8dc88638", "date": "2026-11-17", "type": "LR", "level": 1, "qs": [{"id": "A-cause_effect-an20261117-1", "q": "Two statements are given: I. A landslide blocked the only access road to a hill village. II. A school in a different city cancelled its sports day solely because its playground was flooded by a burst pipe. The two events are unrelated. What is the relationship between the reported disruptions?", "o": ["Both statements are effects of independent causes", "Statement II is the cause and statement I is its effect", "Both statements are effects of a common cause", "Statement I is the cause and statement II is its effect"], "a": 0, "x": "The blocked road results from a landslide. The sports-day cancellation results from an unrelated burst pipe. Neither disruption causes the other, and their causes are independent.", "cn": "First ask which event could make the other happen. If one makes the other happen, that is the cause. If a third event explains both, they are effects of a common cause; if nothing links them, the causes are independent.", "sl": "Original practice item", "t": "Cause and effect"}, {"id": "A-statement_assumption-an20261117-1", "q": "Statement: A housing society plans to text all residents a notice about a planned water shutdown tomorrow. Assumptions: I. At least some residents can receive text messages. II. Every resident will leave home during the shutdown. Which assumption(s) is/are implicit in the plan?", "o": ["Only assumption II is implicit", "Both assumptions are implicit", "Neither assumption is implicit", "Only assumption I is implicit"], "a": 3, "x": "Using texts to notify residents presumes that the channel can reach at least some of them. The plan does not rely on every resident leaving home.", "cn": "An assumption is implicit only if the statement depends on it being true. Ask: does the step or claim make sense without this? Facts merely related to the topic are not assumptions.", "sl": "Original practice item", "t": "Statement and assumption"}, {"id": "V-l0_series_add-19", "q": "What comes next in the series 10, 12, 14, 16, 18, ?", "o": ["19", "21", "20", "22"], "a": 2, "x": "Each term is 2 more than the one before. 18 + 2 = 20.", "cn": "Find the gap between neighbouring terms. If it is the same each time, keep adding it.", "sl": "Original variant of a concept (new items and wording)", "t": "Number series (L0)"}, {"id": "V-number_series-11", "q": "What comes next in the series 14, 23, 34, 47, 62, ?", "o": ["81", "79", "82", "77"], "a": 1, "x": "Each term is a square minus 2: 4^2 - 2, 5^2 - 2, 6^2 - 2, 7^2 - 2, 8^2 - 2. The next is 9^2 - 2 = 79.", "cn": "Find the gaps between terms. If the gaps themselves form a pattern, continue that pattern. Also test squares, doubling and two mixed series.", "sl": "Original variant of a concept (new items and wording)", "t": "Number series"}, {"id": "V-directions-10", "q": "Riya walks 6 km south, then turns right and walks 12 km, then turns left and walks 3 km. How far and in which direction is Riya from the starting point?", "o": ["15 km south-west", "15 km north-east", "21 km south-west", "15 km west"], "a": 0, "x": "Take east as +x and north as +y. After the walk the position is (-12, -9) km from the start. Distance = square root of (-12)^2 + (-9)^2 = 15 km, in the south-west direction.", "cn": "Track each move with north, east, south and west. Turning right from north faces east, and opposite moves cancel. Distance is the straight line (Pythagoras).", "sl": "Original variant of a concept (new items and wording)", "t": "Directions"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
