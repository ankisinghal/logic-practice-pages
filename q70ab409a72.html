<script>const D={"id": "q70ab409a72", "date": "2026-11-12", "type": "LR", "level": 1, "qs": [{"id": "A-syllogism-c20", "q": "Statements: Some volunteers are singers. Some volunteers are dancers. No singer is a dancer. Conclusions: I. Some volunteers are not dancers. II. Some volunteers are not singers. Which conclusion(s) follow(s)?", "o": ["Neither conclusion follows", "Only conclusion I follows", "Both conclusions follow", "Only conclusion II follows"], "a": 2, "x": "The volunteer singers are not dancers; the volunteer dancers are not singers. Each Some premise supplies its own witness.", "cn": "Use only the stated conditions.", "sl": "Original practice item", "t": "Syllogism"}, {"id": "A-syllogism-c21", "q": "Statements: All mosaics are artworks. All artworks are objects. Some objects are souvenirs. No souvenir is a mosaic. Conclusions: I. Some objects are not mosaics. II. Some artworks are souvenirs. Which conclusion(s) follow(s)?", "o": ["Only conclusion I follows", "Both conclusions follow", "Neither conclusion follows", "Only conclusion II follows"], "a": 0, "x": "Some objects are souvenirs, and no souvenir is a mosaic, proving I. Nothing connects any artwork to a souvenir.", "cn": "Use only the stated conditions.", "sl": "Original practice item", "t": "Syllogism"}, {"id": "A-syllogism-c22", "q": "Statements: Some cabins are wooden. No wooden thing is fireproof. All cabins are buildings. Some fireproof things are buildings. Conclusions: I. Some buildings are not fireproof. II. Some buildings are not wooden. Which conclusion(s) follow(s)?", "o": ["Neither conclusion follows", "Only conclusion I follows", "Only conclusion II follows", "Both conclusions follow"], "a": 3, "x": "The wooden cabins supply buildings that are not fireproof. The fireproof buildings cannot be wooden, supplying the second independent witness.", "cn": "Use only the stated conditions.", "sl": "Original practice item", "t": "Syllogism"}, {"id": "A-seating_arrangement-c16", "q": "Seven seats in a row are numbered 1 to 7 from left to right. Five people A, B, C, D and E occupy five seats; two consecutive seats are empty. A sits in seat 1 and E in seat 7. B sits immediately to the right of A, and D sits immediately to the left of E. C sits somewhere to the right of B. Which statement MUST be true?", "o": ["C sits in seat 3", "Seat 4 is empty", "C sits in seat 5", "Seat 3 is empty"], "a": 1, "x": "The two possible rows are A B C empty empty D E and A B empty empty C D E. Seat 4 is empty in both.", "cn": "Use only the stated conditions.", "sl": "Original practice item", "t": "Seating Arrangement"}, {"id": "A-seating_arrangement-c17", "q": "Five people A, B, C, D and E sit in five seats numbered 1 to 5 clockwise around a table, seen from above. Initially A is in seat 1, B in seat 2, C in seat 3, D in seat 4 and E in seat 5. Everyone then moves clockwise by the number of seats equal to their ORIGINAL seat number; moves are simultaneous and wrap after seat 5. Who occupies seat 1 after the move?", "o": ["A", "B", "C", "E"], "a": 2, "x": "The simultaneous moves are: A moves from seat 1 to seat 2; B from seat 2 to seat 4; C from seat 3 to seat 1; D from seat 4 to seat 3; and E stays in seat 5 after a full circuit. Thus C occupies seat 1.", "cn": "Use only the stated conditions.", "sl": "Original practice item", "t": "Seating Arrangement"}, {"id": "A-seating_arrangement-c18", "q": "Four people J, K, L and M occupy the North, East, South and West seats of an outer circle. Four people P, Q, R and S occupy the corresponding seats of an inner circle. Picture both circles from directly above, with North at the top, East at the right, South at the bottom and West at the left. Clockwise always means clockwise in that overhead view. Everyone faces the common centre. J is at outer North. K is immediately clockwise from J. L is opposite J. M takes the remaining outer seat. P is directly inward from K. Q is opposite P. R is immediately clockwise from Q. S takes the remaining inner seat. Who is directly inward from L?", "o": ["S", "P", "Q", "R"], "a": 0, "x": "In the outer circle, J is at North, K at East, L at South and M at West. In the inner circle, P is at East, Q at West, R at North and S at South. Therefore S is directly inward from L.", "cn": "Use only the stated conditions.", "sl": "Original practice item", "t": "Seating Arrangement"}, {"id": "A-coding_shift-c13", "q": "A code numbers each new letter in a word by its order of FIRST appearance, starting at 1. A repeated letter receives the same number as its first appearance. Thus LEVEL becomes 1-2-3-2-1. How is PUPPY written?", "o": ["1-1-2-2-3", "1-2-1-3-4", "1-2-3-4-5", "1-2-1-1-3"], "a": 3, "x": "P is the first new letter, so it receives 1. U is the next new letter and receives 2. The next two letters are P again, so each receives 1. Y is the third new letter and receives 3. The code is 1-2-1-1-3.", "cn": "Use only the stated conditions.", "sl": "Original practice item", "t": "Coding Shift"}, {"id": "A-coding_shift-c14", "q": "A code lists the absolute differences between the alphabet positions of consecutive letters, separated by hyphens (A=1, ..., Z=26). Thus MAP becomes 12-15. How is LION written?", "o": ["3-5-1", "3-6-1", "3-6-2", "4-6-1"], "a": 1, "x": "The alphabet positions are L = 12, I = 9, O = 15 and N = 14. Their consecutive absolute differences are 3, 6 and 1, giving 3-6-1.", "cn": "Use only the stated conditions.", "sl": "Original practice item", "t": "Coding Shift"}, {"id": "A-coding_shift-c15", "q": "A code records the number of vowels followed by the number of consonants in a word, as V:C. Only A, E, I, O, U count as vowels. Thus BRUSH is coded 1:4. What is the code for AERIAL?", "o": ["4:2", "2:4", "3:3", "5:1"], "a": 0, "x": "AERIAL has 4 vowels (A, E, I, A) and 2 consonants (R, L), so its code is 4:2.", "cn": "Use only the stated conditions.", "sl": "Original practice item", "t": "Coding Shift"}, {"id": "A-statement_conclusion-o46", "q": "Statement: A parking pass is valid on Monday and Tuesday, but not on Wednesday. Today is Tuesday. Conclusions: I. The parking pass is valid today. II. The parking pass will be valid tomorrow. Which conclusion(s) follow(s)?", "o": ["Both conclusions follow", "Neither conclusion follows", "Only conclusion II follows", "Only conclusion I follows"], "a": 3, "x": "Tuesday is explicitly valid. Tomorrow is Wednesday and explicitly invalid.", "cn": "Use only the stated conditions.", "sl": "Original practice item", "t": "Statement Conclusion"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
