<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logic practice q729c2e941d</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>

<script>const D={"id": "q729c2e941d", "date": "2026-10-14", "type": "LR", "level": 0, "qs": [{"id": "V-l0_series_add-18", "q": "What comes next in the series 5, 8, 11, 14, 17, ?", "o": ["21", "19", "23", "20"], "a": 3, "x": "Each term is 3 more than the one before. 17 + 3 = 20.", "cn": "Find the gap between neighbouring terms. If it is the same each time, keep adding it.", "sl": "Original variant of a concept (new items and wording)", "t": "Number series (L0)"}, {"id": "V-l0_letter_series-18", "q": "What comes next in the series L, N, P, R, T, ?", "o": ["U", "V", "X", "W"], "a": 1, "x": "Each letter is 2 places after the one before. T + 2 = V.", "cn": "Count how many places each letter moves in the alphabet, then repeat the move.", "sl": "Original variant of a concept (new items and wording)", "t": "Letter series (L0)"}, {"id": "V-l0_facing-18", "q": "Meera is facing east. Meera turns left, then right. Which direction is Meera facing now?", "o": ["east", "west", "south", "north"], "a": 0, "x": "Start facing east. Turn left, then right. Facing east.", "cn": "A right turn moves you one step clockwise (north, east, south, west). A left turn goes the other way.", "sl": "Original variant of a concept (new items and wording)", "t": "Directions (L0)"}, {"id": "V-l0_odd_one-18", "q": "Which one does not belong with the others: green, table, blue, red?", "o": ["table", "green", "red", "blue"], "a": 0, "x": "green, blue, red are all of the same kind (colour). table is not, so it is the odd one out.", "cn": "Find what three of the four share, then pick the one that does not fit.", "sl": "Original variant of a concept (new items and wording)", "t": "Odd one out (L0)"}, {"id": "V-l0_alpha_order-18", "q": "Tina is taller than Kiran. Ravi is taller than Tina. Kiran is taller than Asha. Who is the tallest?", "o": ["Asha", "Tina", "Ravi", "Kiran"], "a": 2, "x": "Putting the statements in a line from shortest to tallest gives Asha, Kiran, Tina, Ravi. The tallest is Ravi.", "cn": "Put the comparisons in one line from smallest to largest, then read off the end you need.", "sl": "Original variant of a concept (new items and wording)", "t": "Ranking and ordering (L0)"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
