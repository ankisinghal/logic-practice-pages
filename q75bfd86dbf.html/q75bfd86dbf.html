<script>const D={"id": "q75bfd86dbf", "date": "2026-10-24", "type": "LR", "level": 1, "qs": [{"id": "V-dice_views-35", "q": "A die is thrown twice and its faces carry the numbers 1 to 6, one number per face. In the first throw the top face shows 6, the face facing you shows 5 and the right face shows 1. In the second throw the top face shows 6, the face facing you shows 3 and the right face shows 4. Which number is on the face opposite the face that shows 6? (Do not assume opposite faces add to 7; use only what the two throws show.)", "o": ["2", "5", "1", "3"], "a": 0, "x": "The face with 6 is seen with 5 and 1 in the first throw, and with 3 and 4 in the second. A face next to 6 cannot be opposite it, so the opposite face is none of 5, 1, 3, 4. The only number left is 2, so 2 is opposite 6.", "cn": "A face seen next to another face can never be opposite it. List all four neighbours from the two throws; the one number left is opposite.", "sl": "Original variant of a concept (new items and wording)", "t": "Cubes and dice"}, {"id": "V-l0_letter_series-35", "q": "What comes next in the series R, S, T, U, V, ?", "o": ["W", "Y", "X", "V"], "a": 0, "x": "Each letter is 1 place after the one before. V + 1 = W.", "cn": "Count how many places each letter moves in the alphabet, then repeat the move.", "sl": "Original variant of a concept (new items and wording)", "t": "Letter series (L0)"}, {"id": "V-grid_missing-35", "q": "Find the missing number:\nRow 1: 6, 4, 14\nRow 2: 7, 2, 11\nRow 3: 6, 2, ?", "o": ["11", "9", "12", "10"], "a": 3, "x": "In every row, third = first + 2 x second. Row 1: 6,4 gives 14. Row 3: gives 10.", "cn": "Test a rule on the first row, confirm it on the second, then apply it to the third.", "sl": "Original variant of a concept (new items and wording)", "t": "Missing number (grid rows)"}, {"id": "V-statement_conclusion-35", "q": "Statements: If the price rises, demand falls. Demand falls. Conclusions: I. The price rises. II. Whether the price rises happened cannot be concluded from the statements. Which conclusion follows?", "o": ["Only conclusion I follows", "Neither conclusion follows", "Only conclusion II follows", "Both conclusions follow"], "a": 2, "x": "Knowing demand falls happened does not prove the price rises caused it: other causes of demand falls are not ruled out by the statements. So conclusion I does not follow, and conclusion II correctly states that nothing about the price rises can be concluded.", "cn": "A conclusion follows only if it must be true in every case the statements allow. 'If P then Q' gives Q when P is true, but gives nothing about P when Q is true; 'Q only if P' makes P necessary for Q.", "sl": "Original variant of a concept (new items and wording)", "t": "Statements and conclusions"}, {"id": "V-data_sufficiency-35", "q": "What is the value of x + y? Statement 1: x = 9. Statement 2: y = 7. Which statement(s) are sufficient to answer the question?", "o": ["Either statement alone is sufficient", "Both statements together are needed", "Statement 2 alone is sufficient", "Statement 1 alone is sufficient"], "a": 1, "x": "Statement 1 alone gives only x = 9; statement 2 alone gives only y = 7. Together x + y = 9 + 7 = 16. Neither alone answers the question.", "cn": "Do not solve fully: ask whether the statements FIX a single answer. Test each statement alone first, then both together.", "sl": "Original variant of a concept (new items and wording)", "t": "Data sufficiency"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
