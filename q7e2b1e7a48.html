<script>const D={"id":"q7e2b1e7a48","date":"2026-11-18","type":"LR","level":1,"qs":[{"id":"A-data_sufficiency-b35","q":"Is the positive integer N divisible by 6? Statement 1: N is divisible by 12. Statement 2: N is divisible by 4. Which statement(s) are sufficient?","o":["Statement 2 alone is sufficient, but statement 1 alone is not","Both statements together are sufficient, but neither alone is sufficient","Each statement alone is sufficient","Statement 1 alone is sufficient, but statement 2 alone is not"],"a":3,"x":"Every multiple of 12 is divisible by 6, so statement 1 answers yes. Statement 2 is not sufficient: 12 is divisible by 6, but 20 is not.","cn":"Use the stated conditions.","sl":"Original practice item","t":"data_sufficiency"},{"id":"A-data_sufficiency-b36","q":"Is the real number x positive? Statement 1: x^2 = 9. Statement 2: x^3 = 27. Which statement(s) are sufficient?","o":["Statement 2 alone is sufficient, but statement 1 alone is not","Statement 1 alone is sufficient, but statement 2 alone is not","Both statements together are sufficient, but neither alone is sufficient","Each statement alone is sufficient"],"a":0,"x":"Statement 1 permits x=3 or x=-3, so it does not decide the sign. Statement 2 gives x=3, so it answers yes.","cn":"Use the stated conditions.","sl":"Original practice item","t":"data_sufficiency"},{"id":"A-seating_arrangement-c33","q":"Five people A, B, C, D and E sit in a row of five chairs, numbered 1 to 5 from the viewer's left. A sits immediately to B's left. D sits immediately to E's left. C sits between the pair A-B and the pair D-E, and A is to D's left. Who sits in chair 4?","o":["A","C","D","E"],"a":2,"x":"The two adjacent pairs are A-B and D-E. Since A is left of D and C is between the pairs, the only order is A,B,C,D,E. Chair 4 is D.","cn":"Use the stated conditions.","sl":"Original practice item","t":"seating_arrangement"},{"id":"A-seating_arrangement-c34","q":"Six people A, B, C, D, E and F sit in a row in that order from the viewer's left. The person in chair 6 exchanges places with the person in chair 2. THEN the person NOW in chair 2 exchanges places with the person in chair 4. THEN the person NOW in chair 4 exchanges places with the person in chair 1. No one else moves. Who ends in chair 4?","o":["B","A","D","F"],"a":1,"x":"After the first swap the row is A,F,C,D,E,B. After the second it is A,D,C,F,E,B. After swapping chairs 1 and 4 it is F,D,C,A,E,B, so chair 4 is A.","cn":"Use the stated conditions.","sl":"Original practice item","t":"seating_arrangement"},{"id":"A-seating_arrangement-c35","q":"Five people A, B, C, D and E sit in a row of five chairs, numbered 1 to 5 from the viewer's left. B is in chair 1 and C is in chair 4. A sits immediately to C's left. D sits somewhere to C's right. E fills the remaining chair. Who sits in chair 3?","o":["B","D","A","E"],"a":2,"x":"B and C fix chairs 1 and 4. A must be in chair 3 to sit immediately left of C. D must be in chair 5, leaving E in chair 2. Thus chair 3 is A.","cn":"Use the stated conditions.","sl":"Original practice item","t":"seating_arrangement"},{"id":"A-coding_shift-c33","q":"A code swaps the first two letters of a word, swaps the last two letters, and leaves every middle letter in place. Thus MANGO becomes AMNOG. How is WINDOW coded?","o":["IWNDWO","WINDWO","IWDNOW","IWNDOW"],"a":0,"x":"WINDOW has letters W,I,N,D,O,W. Swapping the first pair gives I,W; the middle N,D stays; swapping the last pair gives W,O. The code is IWNDWO.","cn":"Use the stated conditions.","sl":"Original practice item","t":"coding_shift"},{"id":"A-coding_shift-c34","q":"A code keeps the first and last letters of a five-letter word fixed and reverses only the middle three letters. Thus CABLE becomes CLBAE. How is TRAIN coded?","o":["TIRAN","TIARN","TARIN","TNAIR"],"a":1,"x":"In TRAIN, the middle three letters are R,A,I. Reversing them gives I,A,R while T and N stay fixed, so the code is TIARN.","cn":"Use the stated conditions.","sl":"Original practice item","t":"coding_shift"},{"id":"A-coding_shift-c35","q":"A code writes the sum of the alphabet positions of the first two letters, then the sum of the alphabet positions of the remaining letters, separated by a hyphen. A=1, ..., Z=26. Thus CAMP becomes 4-29. How is BIRD coded?","o":["10-22","11-21","11-22","2-40"],"a":2,"x":"For CAMP, C+A=3+1=4 and M+P=13+16=29. For BIRD, B+I=2+9=11 and R+D=18+4=22.","cn":"Use the stated conditions.","sl":"Original practice item","t":"coding_shift"},{"id":"A-coding_shift-c36","q":"A code rewrites all the letters of a word in reverse alphabetical order, from Z toward A. Thus PEAR becomes RPEA. How is CLOUD coded?","o":["UODLC","CDLOU","ULODC","UOLDC"],"a":3,"x":"The letters of CLOUD in reverse alphabetical order are U,O,L,D,C.","cn":"Use the stated conditions.","sl":"Original practice item","t":"coding_shift"},{"id":"A-statement_conclusion-o52","q":"Statements: All participants who finish the puzzle receive a certificate. Tara is a participant who finished the puzzle. Conclusions: I. Tara receives a certificate. II. Tara solved every puzzle correctly. Which conclusion(s) follow(s)?","o":["Only conclusion I follows","Only conclusion II follows","Both conclusions follow","Neither conclusion follows"],"a":0,"x":"The statements directly give Tara a certificate. They say nothing about whether she solved every puzzle correctly.","cn":"Use the stated conditions.","sl":"Original practice item","t":"statement_conclusion"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
