<script>const D={"id": "q814b8c7474", "date": "2026-11-24", "type": "LR", "level": 1, "qs": [{"id": "V-alphabet_position-4", "q": "Which letter is 6 places to the left of the 6th letter from the right in the English alphabet?", "o": ["N", "O", "Q", "P"], "a": 1, "x": "The 6th letter from the right is at position 21 from the left, which is U. Moving 6 places to the left gives position 21 - 6 = 15, which is O.", "cn": "Fix one end of the alphabet: from the left A is 1; from the right A is 26. Add for right, subtract for left, then read the letter.", "sl": "Original variant of a concept (new items and wording)", "t": "Alphabet test"}, {"id": "V-blood_relations-5", "q": "A is the brother of B. B is the daughter of C. How is A related to C?", "o": ["father", "brother", "son", "daughter"], "a": 2, "x": "B is C's daughter, so C is a parent of B. A is B's brother, so A is also C's child and A is male: A is C's son.", "cn": "Work one link at a time from the person the question asks about. Brother or sister means the same parents; use only the parent links the question states.", "sl": "Original variant of a concept (new items and wording)", "t": "Blood relations"}, {"id": "V-calendar_days-10", "q": "Today is Tuesday. What day of the week will it be after 395 days?", "o": ["Tuesday", "Wednesday", "Thursday", "Friday"], "a": 3, "x": "A week has 7 days, so only the remainder matters. 395 = 56 x 7 + 3, so move 3 day(s) forward from Tuesday: Friday.", "cn": "Divide the number of days by 7; only the remainder moves the day forward.", "sl": "Original variant of a concept (new items and wording)", "t": "Calendar (days of the week)"}, {"id": "V-directions-14", "q": "Riya walks 8 km east, then turns right and walks 4 km, then turns right and walks 8 km. How far and in which direction is Riya from the starting point?", "o": ["4 km south", "4 km west", "4 km north", "4 km east"], "a": 0, "x": "Take east as +x and north as +y. After the walk the position is (0, -4) km from the start. Distance = square root of (0)^2 + (-4)^2 = 4 km, in the south direction.", "cn": "Track each move with north, east, south and west. Turning right from north faces east, and opposite moves cancel. Distance is the straight line (Pythagoras).", "sl": "Original variant of a concept (new items and wording)", "t": "Directions"}, {"id": "V-grid_missing-5", "q": "Find the missing number:\nRow 1: 6, 3, 17\nRow 2: 5, 8, 39\nRow 3: 5, 6, ?", "o": ["30", "29", "31", "28"], "a": 1, "x": "In every row, third = first x second - 1. Row 1: 6,3 gives 17. Row 3: gives 29.", "cn": "Test a rule on the first row, confirm it on the second, then apply it to the third.", "sl": "Original variant of a concept (new items and wording)", "t": "Missing number (grid rows)"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
