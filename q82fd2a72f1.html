<script>const D={"id": "q82fd2a72f1", "date": "2026-11-18", "type": "LR", "level": 1, "qs": [{"id": "A-course_of_action-an20261118-1", "q": "Statement: A residential society's only exit gate is frequently blocked by illegally parked delivery vans during the evening peak hour. Courses of action: I. The society should mark a no-parking zone at the gate and coordinate with traffic police to enforce it. II. The society should ask residents to stop ordering all deliveries. Which course(s) of action logically follow(s)?", "o": ["Only course of action II follows", "Both courses of action follow", "Only course of action I follows", "Neither course of action follows"], "a": 2, "x": "Marking and enforcing a no-parking zone directly addresses the blocked exit. Stopping all deliveries is disproportionate and the statement does not require residents to give up ordinary deliveries.", "cn": "A course of action follows if it is a practical step that directly tackles the problem in the statement. Reject steps that are extreme, unrelated, or punish the wrong people.", "sl": "Original practice item", "t": "Statement and course of action"}, {"id": "A-cause_effect-an20261118-1", "q": "Two statements are given: I. A factory postponed its outdoor maintenance work. II. The weather office issued a severe thunderstorm warning for the factory's area that afternoon. What is the relationship between them?", "o": ["Both statements are effects of a common cause", "Statement II is the cause and statement I is its effect", "Both statements are effects of independent causes", "Statement I is the cause and statement II is its effect"], "a": 1, "x": "The thunderstorm warning explains why the outdoor work was postponed, so statement II is the cause and statement I is its effect.", "cn": "First ask which event could make the other happen. If one makes the other happen, that is the cause. If a third event explains both, they are effects of a common cause; if nothing links them, the causes are independent.", "sl": "Original practice item", "t": "Cause and effect"}, {"id": "V-l0_series_add-21", "q": "What comes next in the series 3, 8, 13, 18, 23, ?", "o": ["28", "27", "33", "29"], "a": 0, "x": "Each term is 5 more than the one before. 23 + 5 = 28.", "cn": "Find the gap between neighbouring terms. If it is the same each time, keep adding it.", "sl": "Original variant of a concept (new items and wording)", "t": "Number series (L0)"}, {"id": "V-number_series-12", "q": "What comes next in the series 5, 9, 15, 23, 33, ?", "o": ["46", "47", "43", "45"], "a": 3, "x": "The gaps are 4, 6, 8, 10, increasing by 2 each time. The next gap is 12, so 33 + 12 = 45.", "cn": "Find the gaps between terms. If the gaps themselves form a pattern, continue that pattern. Also test squares, doubling and two mixed series.", "sl": "Original variant of a concept (new items and wording)", "t": "Number series"}, {"id": "V-directions-12", "q": "Arjun walks 4 km east, then turns right and walks 3 km. How far and in which direction is Arjun from the starting point?", "o": ["5 km south-east", "5 km north-west", "7 km south-east", "5 km west"], "a": 0, "x": "Take east as +x and north as +y. After the walk the position is (4, -3) km from the start. Distance = square root of (4)^2 + (-3)^2 = 5 km, in the south-east direction.", "cn": "Track each move with north, east, south and west. Turning right from north faces east, and opposite moves cancel. Distance is the straight line (Pythagoras).", "sl": "Original variant of a concept (new items and wording)", "t": "Directions"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
