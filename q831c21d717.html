<script>const D={"id":"q831c21d717","date":"2026-11-20","type":"LR","level":1,"qs":[{"id":"A-data_sufficiency-b39","q":"Is the positive integer N divisible by 12? Statement 1: N is divisible by 3. Statement 2: N is divisible by 8. Which statement(s) are sufficient?","o":["Statement 1 alone is sufficient, but statement 2 alone is not","Statement 2 alone is sufficient, but statement 1 alone is not","Both statements together are sufficient, but neither alone is sufficient","Each statement alone is sufficient"],"a":2,"x":"Statement 1 alone fails: N=3 is not divisible by 12, while N=12 is. Statement 2 alone fails: N=8 is not divisible by 12, while N=24 is. Together they make N divisible by both 3 and 8, hence by 24 and therefore by 12.","cn":"Use the stated conditions.","sl":"Original practice item","t":"data_sufficiency"},{"id":"A-data_sufficiency-b40","q":"Is the real number x positive? Statement 1: x^2 = 25. Statement 2: x + 7 = 2. Which statement(s) are sufficient?","o":["Statement 2 alone is sufficient, but statement 1 alone is not","Statement 1 alone is sufficient, but statement 2 alone is not","Both statements together are sufficient, but neither alone is sufficient","Each statement alone is sufficient"],"a":0,"x":"Statement 1 gives x = 5 or x = -5, so it does not settle whether x is positive. Statement 2 gives x = -5, so it is sufficient to answer no.","cn":"Use the stated conditions.","sl":"Original practice item","t":"data_sufficiency"},{"id":"A-seating_arrangement-c39","q":"Six people A, B, C, D, E and F sit in a row of six chairs, numbered 1 to 6 from the viewer's left. B is in chair 2 and D is in chair 5. A sits immediately to B's left. C sits immediately to D's right. E and F fill the remaining chairs. Who sits in chair 1?","o":["B","A","E","F"],"a":1,"x":"B fixes chair 2, so A must be in chair 1. D fixes chair 5, so C must be in chair 6. E and F take chairs 3 and 4, leaving chair 1 as A.","cn":"Use the stated conditions.","sl":"Original practice item","t":"seating_arrangement"},{"id":"A-seating_arrangement-c40","q":"Six people A, B, C, D, E and F sit in a row of six chairs, numbered 1 to 6 from the viewer's left. A is at the right end and C is in chair 3. B sits immediately to C's left. D sits immediately to A's left. E and F fill the remaining chairs. Who sits in chair 5?","o":["A","C","E","D"],"a":3,"x":"A fixes chair 6. C fixes chair 3, so B must be in chair 2. D sits immediately left of A, so D is in chair 5. E and F take chairs 1 and 4.","cn":"Use the stated conditions.","sl":"Original practice item","t":"seating_arrangement"},{"id":"A-seating_arrangement-c41","q":"Six people A, B, C, D, E and F sit in a row of six chairs, numbered 1 to 6 from the viewer's left. A is at the left end and F is at the right end. B sits immediately to A's right. E sits immediately to F's left. C and D fill the remaining chairs. Who sits in chair 5?","o":["E","A","C","F"],"a":0,"x":"A fixes chair 1 and F fixes chair 6. B must be in chair 2 and E must be in chair 5. C and D take chairs 3 and 4, so chair 5 is E.","cn":"Use the stated conditions.","sl":"Original practice item","t":"seating_arrangement"},{"id":"A-coding_shift-c49","q":"A code replaces each letter by the digit on a standard telephone keypad: ABC=2, DEF=3, GHI=4, JKL=5, MNO=6, PQRS=7, TUV=8 and WXYZ=9. Thus MAP becomes 627. How is BRICK coded?","o":["27424","27426","27425","27325"],"a":2,"x":"On the keypad, B=2, R=7, I=4, C=2 and K=5. The code is 27425.","cn":"Use the stated conditions.","sl":"Original practice item","t":"coding_shift"},{"id":"A-coding_shift-c46","q":"A code considers only letters that occur more than once. For each repeated distinct letter in alphabetical order, it writes the number of letters between its first and last occurrences, separated by hyphens. If no letter repeats, the code is 0. Thus PEPPER becomes 2-2. How is REMEMBER coded?","o":["3-1-6","4-1-6","5-1-5","2-1-6"],"a":1,"x":"In REMEMBER, the repeated letters in alphabetical order are E, M and R. E spans positions 2 to 7 with 4 letters between, M spans positions 3 to 5 with 1 letter between, and R spans positions 1 to 8 with 6 letters between. The code is 4-1-6.","cn":"Use the stated conditions.","sl":"Original practice item","t":"coding_shift"},{"id":"A-coding_shift-c47","q":"A code scans a word from left to right and records the lengths of consecutive runs of vowels and consonants, separated by hyphens. Only A, E, I, O and U count as vowels. Thus BEAUTY becomes 1-3-2. How is SEQUEL coded?","o":["1-1-2-1-1","1-2-1-1-1","1-1-1-1-2","1-1-1-2-1"],"a":3,"x":"SEQUEL has a one-letter consonant run S, a one-letter vowel run E, a one-letter consonant run Q, a two-letter vowel run UE and a one-letter consonant run L. The code is 1-1-1-2-1.","cn":"Use the stated conditions.","sl":"Original practice item","t":"coding_shift"},{"id":"A-coding_shift-c48","q":"A code replaces each consonant by its distance in the alphabet to the nearest vowel and replaces each vowel by 0. A=1, ..., Z=26; only A, E, I, O and U count as vowels. Thus MAP becomes 2-0-1. How is BRICK coded?","o":["1-3-0-2-2","1-3-0-2-1","1-2-0-2-2","0-3-0-2-2"],"a":0,"x":"For BRICK, B is 1 away from A, R is 3 away from O or U, I is a vowel, C is 2 away from A or E, and K is 2 away from I. The code is 1-3-0-2-2.","cn":"Use the stated conditions.","sl":"Original practice item","t":"coding_shift"},{"id":"A-statement_conclusion-o54","q":"Statements: All volunteers who complete the first-aid training may assist at the school event. Kabir may assist at the school event. Conclusions: I. Kabir completed the first-aid training. II. Kabir is a volunteer. Which conclusion(s) follow(s)?","o":["Only conclusion I follows","Neither conclusion follows","Only conclusion II follows","Both conclusions follow"],"a":1,"x":"The statements say that trained volunteers may assist, not that everyone who may assist is a trained volunteer. They also do not say that Kabir is a volunteer.","cn":"Use the stated conditions.","sl":"Original practice item","t":"statement_conclusion"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
