<script>const D={"id":"q84892ef9a6","date":"2026-11-24","type":"LR","level":1,"qs":[{"id":"A-data_sufficiency-b51","q":"Is quadrilateral PQRS a square? Statement 1: All four of its sides are equal. Statement 2: All four of its angles are equal. Which statement(s) are sufficient?","o":["Statement 1 alone is sufficient, but statement 2 alone is not","Both statements together are sufficient, but neither alone is sufficient","Statement 2 alone is sufficient, but statement 1 alone is not","Each statement alone is sufficient"],"a":1,"x":"Statement 1 alone allows a rhombus that is not a square, and statement 2 alone allows a rectangle that is not a square. Together the quadrilateral has equal sides and equal angles, so it must be a square.","cn":"Use the stated conditions.","sl":"Original practice item","t":"data_sufficiency"},{"id":"A-data_sufficiency-b52","q":"What is Ravi's rank in his class? Statement 1: 12 students scored more than Ravi. Statement 2: 8 students scored less than Ravi. Which statement(s) are sufficient?","o":["Statement 2 alone is sufficient, but statement 1 alone is not","Both statements together are sufficient, but neither alone is sufficient","Each statement alone is sufficient","Statement 1 alone is sufficient, but statement 2 alone is not"],"a":3,"x":"Statement 1 alone fixes Ravi as 13th from the top, so it is sufficient. Statement 2 alone does not fix the rank without knowing the class size, so it is not sufficient.","cn":"Use the stated conditions.","sl":"Original practice item","t":"data_sufficiency"},{"id":"A-seating_arrangement-c64","q":"Five people P, Q, R, S and T sit in a row facing north. P sits at one of the ends. Q sits immediately to the right of P. R sits somewhere to the left of T. S sits at the right end. Who sits in the middle?","o":["R","P","Q","T"],"a":0,"x":"S is at the right end, so P must be at the left end and Q sits next to P. R must sit to the left of T in the two remaining seats, so the order is P, Q, R, T, S and R is in the middle.","cn":"Use the stated conditions.","sl":"Original practice item","t":"seating_arrangement"},{"id":"A-seating_arrangement-c67","q":"Five people A, B, C, D and E sit in a row of five chairs numbered 1 to 5 from the viewer's left, facing north. Each of them likes a different fruit: apple, banana, mango, grape and orange. A sits at the left end and E sits at the right end. B sits immediately to the right of D, and C sits immediately to the left of D. The mango lover sits in the middle chair, the apple lover sits immediately to the mango lover's left, the orange lover sits immediately to the mango lover's right, and the grape lover sits at the right end. Who likes mango?","o":["A","C","D","E"],"a":2,"x":"The seating is forced to A, C, D, B, E from left to right, and the middle chair belongs to D. The mango lover sits in the middle chair, so D likes mango.","cn":"Use the stated conditions.","sl":"Original practice item","t":"seating_arrangement"},{"id":"A-seating_arrangement-c68","q":"Six people P, Q, R, S, T and U sit in a row of six chairs numbered 1 to 6 from the viewer's left, facing north. P sits at the left end and U sits at the right end. Q sits immediately to the right of P. The number of people sitting between Q and R is the same as the number sitting between R and U. S sits somewhere to the left of T. Who sits immediately to the right of R?","o":["R","S","U","T"],"a":3,"x":"P is in chair 1, Q in chair 2 and U in chair 6. R must sit exactly midway between Q and U, which is chair 4. S and T fill chairs 3 and 5 with S to the left of T, so the order is P, Q, S, R, T, U and T sits immediately to the right of R.","cn":"Use the stated conditions.","sl":"Original practice item","t":"seating_arrangement"},{"id":"A-coding_shift-c66","q":"A code replaces each vowel by its position in the vowel order A=1, E=2, I=3, O=4, U=5, and leaves every consonant unchanged. Thus FRAME becomes FR1M2. How is CLOUD coded?","o":["CL54D","CL45D","CL4UD","C145D"],"a":1,"x":"In CLOUD, the vowels are O=4 and U=5, and the consonants C, L and D are unchanged. The code is CL45D.","cn":"Use the stated conditions.","sl":"Original practice item","t":"coding_shift"},{"id":"A-coding_shift-c71","q":"A code replaces each letter of a word by the number of OTHER letters in the same word that are adjacent to it in the alphabet, that is, whose alphabet positions differ from its own by exactly one. Thus FRAME becomes 10001, because F has E beside it in the alphabet, E has F, and R, A and M have no such neighbor in the word. How is BRAVE coded?","o":["10100","10010","11100","10101"],"a":0,"x":"In BRAVE: B has A beside it (1), R has no neighbor (0), A has B (1), V has none (0) and E has none (0). The code is 10100.","cn":"Use the stated conditions.","sl":"Original practice item","t":"coding_shift"},{"id":"A-coding_shift-c70","q":"A code replaces each letter by the letter immediately to its right in its own row of a standard QWERTY keyboard (top row QWERTYUIOP, middle row ASDFGHJKL, bottom row ZXCVBNM); a letter at the right end of its row wraps to the left end of the same row. Thus FRAME becomes GTSZR. How is CLOUD coded?","o":["VAPID","VQPIF","VAPIF","CAPIF"],"a":2,"x":"On the keyboard rows, C moves to V, L wraps to A, O moves to P, U moves to I and D moves to F. The code is VAPIF.","cn":"Use the stated conditions.","sl":"Original practice item","t":"coding_shift"},{"id":"A-coding_shift-c69","q":"A code moves every letter of a word backward in the alphabet by the number of vowels in the word, wrapping from A back to Z. Thus FRAME, which has 2 vowels, becomes DPYKC. How is CLOUD coded?","o":["AJMSB","AJMSA","BKMSB","AJMTB"],"a":0,"x":"CLOUD has 2 vowels, so every letter moves two places backward: C to A, L to J, O to M, U to S and D to B. The code is AJMSB.","cn":"Use the stated conditions.","sl":"Original practice item","t":"coding_shift"},{"id":"A-statement_conclusion-o63","q":"Statements: Each of the ten prizes at the school fair was won by exactly one member of the stamp club. The stamp club has exactly six members. Conclusions: I. At least one member of the stamp club won more than one prize. II. Every member of the stamp club won at least one prize. Which conclusion(s) follow(s)?","o":["Neither conclusion follows","Both conclusions follow","Only conclusion II follows","Only conclusion I follows"],"a":3,"x":"All ten prizes went to stamp club members, one winner per prize, and there are only six members. If every member had won at most one prize, at most six prizes could have been won, so some member won more than one: I follows. One member could have won several prizes while another won none, so II does not follow.","cn":"Use the stated conditions.","sl":"Original practice item","t":"statement_conclusion"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
