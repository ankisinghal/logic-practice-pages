<script>const D={"id": "q854babfcff", "date": "2026-11-26", "type": "LR", "level": 1, "qs": [{"id": "A-dice_side_sum-d3", "q": "A standard die, on which opposite faces always add to 7, rests on a table. The top face shows 5. What is the sum of the four side faces?", "o": ["12", "14", "16", "15"], "a": 1, "x": "The four side faces form two pairs of opposite faces, and each opposite pair adds to 7, so the side faces total 7 + 7 = 14.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "dice_side_sum"}, {"id": "A-seating_arrangement-c75", "q": "Six people A, B, C, D, E and F sit in a row of six chairs numbered 1 to 6 from the viewer's left, facing north. B sits third to the left of E. D sits immediately to the right of E. A sits in chair 1. C does not sit next to B. F fills the remaining chair. Who sits in chair 3?", "o": ["F", "C", "E", "D"], "a": 0, "x": "B third to the left of E with D immediately right of E forces E to chair 5 (chair 4 would put B in chair 1, which A holds), so B is in chair 2 and D in chair 6. C cannot sit next to B, so C takes chair 4 and F takes chair 3.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "seating_arrangement"}, {"id": "A-seating_arrangement-c76", "q": "Seven people P, Q, R, S, T, U and V sit in a row of seven chairs numbered 1 to 7 from the viewer's left, facing north. P sits in chair 2 and Q sits in chair 7. Exactly two people sit between P and R. Exactly two people sit between Q and S. T sits next to R. U does not sit at either end. Who sits in chair 4?", "o": ["T", "R", "U", "S"], "a": 3, "x": "Two people between P (chair 2) and R puts R in chair 5; two between Q (chair 7) and S puts S in chair 4. T next to R takes chair 6 (chair 4 is S), U avoids the ends so U takes chair 3, leaving V in chair 1. Chair 4 is S.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "seating_arrangement"}, {"id": "A-seating_arrangement-c77", "q": "Six children A, B, C, D, E and F sit in two rows of three for a class photo, and all face the camera. The front row has seats F1, F2, F3 and the back row has seats B1, B2, B3, numbered from the viewer's left, with B1 directly behind F1, B2 behind F2 and B3 behind F3. A sits in F1. D sits directly behind A. B sits in B3. C sits directly behind E. Who sits in F2?", "o": ["C", "E", "F", "D"], "a": 1, "x": "A in F1 puts D in B1, and B is in B3. C directly behind E can only be C in B2 behind E in F2 (B3 is taken), leaving F in F3. So E sits in F2.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "seating_arrangement"}, {"id": "A-coding_shift-c78", "q": "A code writes a word in a zigzag over three rows: the 1st letter goes in row 1, the 2nd in row 2, the 3rd in row 3, the 4th back in row 2, the 5th in row 1, the 6th in row 2, and so on. The code is read as row 1 first, then row 2, then row 3. Thus DELTA becomes DAETL. How is CANDLE coded?", "o": ["CLADEN", "CLADNE", "CALDEN", "CLDAEN"], "a": 0, "x": "For CANDLE the rows are: row 1 gets C and L, row 2 gets A, D and E, and row 3 gets N. Reading the rows in order gives CLADEN.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "coding_shift"}, {"id": "A-coding_shift-c79", "q": "A code replaces each letter of a word by the pair of its alphabet neighbours, writing the earlier neighbour first: B becomes AC and M becomes LN. Thus CUP becomes BDTVOQ. How is PEN coded?", "o": ["OQDFMP", "OQDFNO", "OQDEMO", "OQDFMO"], "a": 3, "x": "P has neighbours O and Q, E has D and F, and N has M and O, so PEN becomes OQDFMO.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "coding_shift"}, {"id": "A-coding_shift-c81", "q": "A code repeats each letter of a word as many times as its position in the word: the 1st letter is written once, the 2nd letter twice, and so on. Thus DOG becomes DOOGGG. How is FISH coded?", "o": ["FIISSSHHHH", "FIISSHHHH", "FISSSHHHH", "FIISSSHHH"], "a": 0, "x": "F comes once, I comes twice, S three times and H four times, giving FIISSSHHHH.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "coding_shift"}, {"id": "A-data_sufficiency-b55", "q": "What is the remainder when the positive integer N is divided by 5? Statement 1: The remainder when N is divided by 10 is 7. Statement 2: N is divisible by 15. Which statement(s) are sufficient?", "o": ["Statement 1 alone is sufficient, but statement 2 alone is not", "Statement 2 alone is sufficient, but statement 1 alone is not", "Both statements together are sufficient, but neither alone is sufficient", "Each statement alone is sufficient"], "a": 3, "x": "Statement 1 alone: N ends in 7, so N divided by 5 leaves remainder 2; sufficient. Statement 2 alone: a multiple of 15 is a multiple of 5, so the remainder is 0; sufficient. Each statement alone answers the question (with different values).", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "data_sufficiency"}, {"id": "A-syllogism-c32", "q": "Statements: Some pens are not pencils. No pencil is an eraser. (Every group named has at least one member.) Conclusions: I. Some pens are not erasers. II. Some erasers are not pencils. Which conclusion(s) follow(s)?", "o": ["Only conclusion I follows", "Both conclusions follow", "Only conclusion II follows", "Neither conclusion follows"], "a": 2, "x": "Since no pencil is an eraser, every eraser is outside the pencils, so some erasers are not pencils and II follows. The pens that are not pencils could all still be erasers or not, so I is not forced.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "syllogism"}, {"id": "A-statement_conclusion-o65", "q": "Statements: In a queue for tickets, Meena is 9th from the front and 14th from the back of the queue. Conclusions: I. There are 22 people in the queue. II. More people stand behind Meena than in front of her. Which conclusion(s) follow(s)?", "o": ["Only conclusion I follows", "Only conclusion II follows", "Both conclusions follow", "Neither conclusion follows"], "a": 2, "x": "The queue has 8 people in front of Meena and 13 behind her, totalling 8 + 1 + 13 = 22, so I follows. Since 13 is more than 8, II also follows.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "statement_conclusion"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
