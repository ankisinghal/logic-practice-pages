<script>const D={"id": "q906210da84", "date": "2026-10-20", "type": "LR", "level": 1, "qs": [{"id": "V-number_series-31", "q": "What comes next in the series 2, 7, 14, 23, 34, ?", "o": ["49", "50", "47", "45"], "a": 2, "x": "Each term is a square minus 2: 2^2 - 2, 3^2 - 2, 4^2 - 2, 5^2 - 2, 6^2 - 2. The next is 7^2 - 2 = 47.", "cn": "Find the gaps between terms. If the gaps themselves form a pattern, continue that pattern. Also test squares, doubling and two mixed series.", "sl": "Original variant of a concept (new items and wording)", "t": "Number series"}, {"id": "V-coding_shift-31", "q": "If TOY becomes UPZ in a code language, what does FIG become?", "o": ["GJH", "FIG", "EHF", "HKI"], "a": 0, "x": "Each letter moves 1 place forward: T to U, O to P, Y to Z. So FIG becomes GJH.", "cn": "In a letter code, check how each letter moves. The same shift applies to every letter of the new word.", "sl": "Original variant of a concept (new items and wording)", "t": "Coding-decoding"}, {"id": "V-interchange_signs_numbers-31", "q": "Given interchanges: signs + and - and numbers 4 and 8. Which equation would be correct?", "o": ["4 + 3 - 4 = 20", "8 + 8 - 9 = 7", "8 + 4 - 4 = 2", "4 - 8 + 4 = 4"], "a": 3, "x": "After swapping, the left sides are 8+4-8 = 4 (option says 4), 4-4+9 = 9 (option says 7), 8-3+8 = 13 (option says 20), 4-8+8 = 4 (option says 2). Only 4-8+4=4 matches.", "cn": "Swap the signs and numbers named in the question first, then work out each option's left side with the usual order of operations and compare with its right side.", "sl": "Original variant of a concept (new items and wording)", "t": "Interchange of signs and numbers"}, {"id": "V-inequality_relation-31", "q": "Statements: T = P, P = Q, Q > S. Which of the following is definitely true?", "o": ["T < Q", "T = Q", "Q < T", "Q < S"], "a": 1, "x": "From T = P and P = Q and Q > S, combining step by step gives T = Q. The other options each contradict the statements.", "cn": "Chain the relations through the shared letter. Combine two at a time, and remember '=' passes every relation through unchanged.", "sl": "Original variant of a concept (new items and wording)", "t": "Inequality statements"}, {"id": "V-dice_views-31", "q": "A die is thrown twice and its faces carry the numbers 1 to 6, one number per face. In the first throw the top face shows 2, the face facing you shows 5 and the right face shows 6. In the second throw the top face shows 5, the face facing you shows 3 and the right face shows 1. Which number is on the face opposite the face that shows 5? (Do not assume opposite faces add to 7; use only what the two throws show.)", "o": ["2", "6", "4", "3"], "a": 2, "x": "The face with 5 is seen with 2 and 6 in the first throw, and with 3 and 1 in the second. A face next to 5 cannot be opposite it, so the opposite face is none of 2, 6, 3, 1. The only number left is 4, so 4 is opposite 5.", "cn": "A face seen next to another face can never be opposite it. List all four neighbours from the two throws; the one number left is opposite.", "sl": "Original variant of a concept (new items and wording)", "t": "Cubes and dice"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
