<script>const D={"id": "q97b9d011bb", "date": "2026-11-19", "type": "LR", "level": 1, "qs": [{"id": "A-statement_assumption-an20261119-1", "q": "Statement: The city library will send due-date reminders by email instead of printed notices. Assumptions: I. Members have access to the email addresses registered with the library. II. Members prefer email to every other reminder method. Which assumption(s) is/are implicit?", "o": ["Both assumptions are implicit", "Only assumption II is implicit", "Neither assumption is implicit", "Only assumption I is implicit"], "a": 3, "x": "Email reminders can work only if members can access the registered email addresses. The plan does not require email to be every member's most preferred method.", "cn": "An assumption is implicit only if the statement depends on it being true. Ask: does the step or claim make sense without this? Facts merely related to the topic are not assumptions.", "sl": "Original practice item", "t": "Statement and assumption"}, {"id": "A-course_of_action-an20261119-1", "q": "Statement: A school bus is repeatedly late because the narrow market road on its route is congested during school hours. Courses of action: I. The school should reroute the bus through a wider parallel road if that route is safe and permitted. II. The school should cancel the bus service for all students. Which course(s) of action logically follow(s)?", "o": ["Only course of action I follows", "Neither course of action follows", "Only course of action II follows", "Both courses of action follow"], "a": 0, "x": "A safe, permitted wider route directly addresses the congestion delay. Cancelling the entire bus service is extreme and does not follow as a reasonable response.", "cn": "A course of action follows if it is a practical step that directly tackles the problem in the statement. Reject steps that are extreme, unrelated, or punish the wrong people.", "sl": "Original practice item", "t": "Statement and course of action"}, {"id": "V-l0_series_add-22", "q": "What comes next in the series 7, 13, 19, 25, 31, ?", "o": ["36", "43", "37", "38"], "a": 2, "x": "Each term is 6 more than the one before. 31 + 6 = 37.", "cn": "Find the gap between neighbouring terms. If it is the same each time, keep adding it.", "sl": "Original variant of a concept (new items and wording)", "t": "Number series (L0)"}, {"id": "V-number_series-14", "q": "What comes next in the series 5, 9, 16, 26, 39, ?", "o": ["56", "55", "52", "58"], "a": 1, "x": "The gaps are 4, 7, 10, 13, increasing by 3 each time. The next gap is 16, so 39 + 16 = 55.", "cn": "Find the gaps between terms. If the gaps themselves form a pattern, continue that pattern. Also test squares, doubling and two mixed series.", "sl": "Original variant of a concept (new items and wording)", "t": "Number series"}, {"id": "V-directions-13", "q": "Sameer walks 12 km west, then turns left and walks 9 km, then turns left and walks 12 km. How far and in which direction is Sameer from the starting point?", "o": ["9 km west", "9 km south-west", "9 km south", "9 km north"], "a": 2, "x": "Take east as +x and north as +y. After the walk the position is (0, -9) km from the start. Distance = square root of (0)^2 + (-9)^2 = 9 km, in the south direction.", "cn": "Track each move with north, east, south and west. Turning right from north faces east, and opposite moves cancel. Distance is the straight line (Pythagoras).", "sl": "Original variant of a concept (new items and wording)", "t": "Directions"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
