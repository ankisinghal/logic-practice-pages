<script>const D={"id": "q9eb35b3ba8", "date": "2026-10-15", "type": "LR", "level": 1, "qs": [{"id": "V-calendar_days-18", "q": "Today is Saturday. What day of the week will it be after 200 days?", "o": ["Friday", "Sunday", "Wednesday", "Thursday"], "a": 2, "x": "A week has 7 days, so only the remainder matters. 200 = 28 x 7 + 4, so move 4 day(s) forward from Saturday: Wednesday.", "cn": "Divide the number of days by 7; only the remainder moves the day forward.", "sl": "Original variant of a concept (new items and wording)", "t": "Calendar (days of the week)"}, {"id": "V-clock_angle-18", "q": "What is the angle between the hour hand and the minute hand of a clock at 1:30?", "o": ["105 degrees", "165 degrees", "150 degrees", "135 degrees"], "a": 3, "x": "The hour hand is at 45 degrees from 12 (30 per hour, 0.5 per minute) and the minute hand is at 180 degrees. The difference is 135; the smaller angle is 135 degrees.", "cn": "Hour hand: 30 degrees per hour plus 0.5 per minute. Minute hand: 6 degrees per minute. Take the smaller angle.", "sl": "Original variant of a concept (new items and wording)", "t": "Clock (angle between hands)"}, {"id": "RS-reasoning-b067-q44", "q": "Find the missing number. The grid is given row by row (top to bottom); one rule links the numbers in each row.\n6  11  25\n8  6  16\n12  5  ?", "o": ["18", "16", "12", "10"], "a": 1, "x": "In each complete row, 3rd = 2 x 2nd + (1st)/2: 2x11+3 = 25, 2x6+4 = 16, so ? = 2x5+6 = 16.", "cn": "Find one rule that works on every complete row (try sums, multiples, and a weighted sum), then apply it to the row with the missing number.", "sl": "R S Aggarwal Verbal and Non-Verbal Reasoning, Inserting the Missing Character, Exercise 15 Q44 (book p.483, Reprint 2007; grid typed out as text, options as printed; explanation derived independently, not the book's working)", "t": "Missing number (grid)"}, {"id": "RS-reasoning-b067-q56", "q": "Find the missing number. The grid is given row by row (top to bottom); one rule links the numbers in each row.\n?  13  49\n9  17  69\n13  11  59", "o": ["5", "9", "10", "21"], "a": 0, "x": "In each row, 3rd = 2 x (1st) + 3 x (2nd): 2x9+3x17 = 69, 2x13+3x11 = 59, so 2?+39 = 49 gives ? = 5.", "cn": "Find one rule that works on every complete row (try sums, multiples, and a weighted sum), then apply it to the row with the missing number.", "sl": "R S Aggarwal Verbal and Non-Verbal Reasoning, Inserting the Missing Character, Exercise 15 Q56 (book p.484, Reprint 2007; grid typed out as text, options as printed; explanation derived independently, not the book's working)", "t": "Missing number (grid)"}, {"id": "V-count_squares-18", "q": "How many squares of all sizes are there in a 5 x 5 square grid (made of 25 small unit squares)?", "o": ["25", "60", "50", "55"], "a": 3, "x": "Squares of side k number (5-k+1)^2. Adding for k = 1 to 5: 25 + 16 + 9 + 4 + 1 = 55.", "cn": "Count squares of each side length separately: side k fits (n - k + 1)^2 times. Then add.", "sl": "Original variant of a concept (new items and wording)", "t": "Counting figures (squares in a grid)"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
