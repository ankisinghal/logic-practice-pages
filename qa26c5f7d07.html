<script>const D={"id": "qa26c5f7d07", "date": "2026-11-17", "type": "LR", "level": 1, "qs": [{"id": "A-data_sufficiency-b33", "q": "Three real numbers x, y and z satisfy x < y < z. What is their median? Statement 1: x + y + z = 24. Statement 2: x + z = 16. Which statement(s) are sufficient?", "o": ["Each statement alone is sufficient", "Statement 1 alone is sufficient, but statement 2 alone is not", "Both statements together are sufficient, but neither alone is sufficient", "Statement 2 alone is sufficient, but statement 1 alone is not"], "a": 2, "x": "The median is y. Statement 1 alone permits different y values, and statement 2 does not fix y. Together, y=24-16=8.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "data_sufficiency"}, {"id": "A-data_sufficiency-b34", "q": "Is the positive integer N divisible by 9? Statement 1: The sum of the decimal digits of N is 18. Statement 2: The last decimal digit of N is 0. Which statement(s) are sufficient?", "o": ["Both statements together are sufficient, but neither alone is sufficient", "Statement 1 alone is sufficient, but statement 2 alone is not", "Each statement alone is sufficient", "Statement 2 alone is sufficient, but statement 1 alone is not"], "a": 1, "x": "A number is divisible by 9 exactly when its digit sum is divisible by 9, so statement 1 answers yes. Statement 2 allows 10 (no) and 90 (yes), so it is insufficient.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "data_sufficiency"}, {"id": "A-seating_arrangement-c30", "q": "Six people A, B, C, D, E and F sit in a row in that order from the viewer's left. The person in chair 2 exchanges places with the person in chair 5. THEN the person NOW in chair 5 exchanges places with the person in chair 3. No one else moves. Who ends in chair 3?", "o": ["B", "C", "D", "E"], "a": 0, "x": "The first swap gives A,E,C,D,B,F. The second swap exchanges B and C, giving A,E,B,D,C,F. B ends in chair 3.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "seating_arrangement"}, {"id": "A-seating_arrangement-c31", "q": "A, B, C, D and E sit in a row of five chairs, numbered 1 to 5 from the viewer's left. A and B have consecutive chair numbers whose SUM is 7. A is to B's left. C sits next to B but not next to A. D is to E's left. Who sits in chair 2?", "o": ["A", "C", "D", "E"], "a": 3, "x": "The consecutive chair numbers adding to 7 are 3 and 4, so A=3 and B=4. C must be in chair 5. D and E fill chairs 1 and 2 in that order, so E is in chair 2.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "seating_arrangement"}, {"id": "A-seating_arrangement-c32", "q": "Four fixed chairs are labelled North, East, South and West, viewed from above. Initially A sits North, B East, C South and D West. A and C exchange chairs. Then ALL FOUR people move one chair CLOCKWISE (North to East to South to West to North). Who is in the West chair at the end?", "o": ["A", "B", "C", "D"], "a": 0, "x": "After the exchange, the occupants at North/East/South/West are C/B/A/D. Moving all clockwise puts A from South into West.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "seating_arrangement"}, {"id": "A-coding_shift-c29", "q": "A code lists the POSITIONS of letters in a word in ALPHABETICAL order of the letters. All letters in each word below are different, and positions start at 1 from the left. Thus PEAR becomes 3-2-1-4. How is CROWN coded?", "o": ["1-3-5-2-4", "1-5-2-3-4", "1-5-3-2-4", "5-1-3-2-4"], "a": 2, "x": "The alphabetical letter order in CROWN is C,N,O,R,W. Their original positions are 1,5,3,2,4.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "coding_shift"}, {"id": "A-coding_shift-c30", "q": "A code replaces each letter by the number of letters AFTER it in the alphabet (A gives 25, B gives 24, ..., Z gives 0). Values are separated by hyphens. Thus AXE becomes 25-2-21. How is SKY coded?", "o": ["19-11-25", "6-14-0", "8-16-2", "7-15-1"], "a": 3, "x": "S is alphabet position 19, K is 11 and Y is 25. Subtracting each from 26 gives 7,15,1.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "coding_shift"}, {"id": "A-coding_shift-c31", "q": "A code leaves every consonant unchanged and replaces EACH vowel by two copies of that same vowel. Only A, E, I, O, U count as vowels. Thus CAT becomes CAAT. How is STONE coded?", "o": ["SSTTOONNEE", "STOONEE", "STOENE", "STOONNEE"], "a": 1, "x": "The vowels in STONE are O and E; doubling each while leaving S,T,N unchanged gives STOONEE.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "coding_shift"}, {"id": "A-coding_shift-c32", "q": "A code writes the absolute difference between the alphabet positions of the FIRST and LAST letters of a word. A=1, ..., Z=26. Thus BREAD is coded 2. How is ZINC coded?", "o": ["24", "29", "23", "3"], "a": 2, "x": "Z is 26 and C is 3. Their absolute difference is 23.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "coding_shift"}, {"id": "A-statement_conclusion-o51", "q": "The five whole-number scores in a test are all DIFFERENT, and each is at least 6 and at most 10. Conclusions: I. Exactly one score is 8. II. The average of the five scores is 8. Which conclusion(s) follow(s)?", "o": ["Both conclusions follow", "Neither conclusion follows", "Only conclusion I follows", "Only conclusion II follows"], "a": 0, "x": "There are only five possible whole-number scores in the interval: 6,7,8,9,10. Since all five scores are different, all five values must occur. Thus exactly one is 8 and their average is (6+7+8+9+10)/5=8.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "statement_conclusion"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
