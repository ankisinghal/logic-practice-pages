<script>const D={"id": "qaa856797b5", "date": "2026-10-13", "type": "LR", "level": 0, "qs": [{"id": "V-l0_series_add-13", "q": "What comes next in the series 5, 7, 9, 11, 13, ?", "o": ["15", "16", "14", "17"], "a": 0, "x": "Each term is 2 more than the one before. 13 + 2 = 15.", "cn": "Find the gap between neighbouring terms. If it is the same each time, keep adding it.", "sl": "Original variant of a concept (new items and wording)", "t": "Number series (L0)"}, {"id": "V-l0_letter_series-13", "q": "What comes next in the series H, K, N, Q, T, ?", "o": ["X", "V", "W", "U"], "a": 2, "x": "Each letter is 3 places after the one before. T + 3 = W.", "cn": "Count how many places each letter moves in the alphabet, then repeat the move.", "sl": "Original variant of a concept (new items and wording)", "t": "Letter series (L0)"}, {"id": "V-l0_facing-13", "q": "Kabir is facing east. Kabir turns right, then right, then left. Which direction is Kabir facing now?", "o": ["south", "west", "north", "east"], "a": 0, "x": "Start facing east. turn right Then turn right Then turn left. Facing south.", "cn": "A right turn moves you one step clockwise (north, east, south, west). A left turn goes the other way.", "sl": "Original variant of a concept (new items and wording)", "t": "Directions (L0)"}, {"id": "V-l0_odd_one-13", "q": "Which one does not belong with the others: orange, apple, banana, carrot?", "o": ["orange", "banana", "apple", "carrot"], "a": 3, "x": "orange, apple, banana are all of the same kind (fruit). carrot is not, so it is the odd one out.", "cn": "Find what three of the four share, then pick the one that does not fit.", "sl": "Original variant of a concept (new items and wording)", "t": "Odd one out (L0)"}, {"id": "V-l0_alpha_order-13", "q": "Tina is taller than Sana. Sana is taller than Kiran. Dev is taller than Tina. Who is the tallest?", "o": ["Kiran", "Dev", "Tina", "Sana"], "a": 1, "x": "Putting the statements in a line from shortest to tallest gives Kiran, Sana, Tina, Dev. The tallest is Dev.", "cn": "Put the comparisons in one line from smallest to largest, then read off the end you need.", "sl": "Original variant of a concept (new items and wording)", "t": "Ranking and ordering (L0)"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
