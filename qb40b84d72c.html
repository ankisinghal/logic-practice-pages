<script>const D={"id": "qb40b84d72c", "date": "2026-10-27", "type": "LR", "level": 1, "qs": [{"id": "A-statement_conclusion-o1", "q": "Statements: If the shop is closed, we cannot buy milk. The shop is closed. Conclusions: I. We cannot buy milk. II. The shop is not closed. Which conclusion follows?", "o": ["Only conclusion II follows", "Neither conclusion follows", "Only conclusion I follows", "Both conclusions follow"], "a": 2, "x": "The first statement makes 'we cannot buy milk' a certain result of the shop being closed, and the shop is given as closed, so conclusion I must be true. Conclusion II denies a given fact, so it does not follow.", "cn": "A conclusion follows only if it MUST be true from the statements. 'If P then Q' plus P gives Q; Q alone does not give P; 'Q only if P' means Q needs P.", "sl": "Authored item for a concept (new scenario and wording)", "t": "Statements and conclusions"}, {"id": "A-statement_conclusion-o2", "q": "Statements: If the alarm rings, she wakes up. She woke up. Conclusions: I. The alarm rang. II. She could have woken up for some other reason, so the statements do not prove that the alarm rang. Which conclusion follows?", "o": ["Only conclusion I follows", "Only conclusion II follows", "Neither conclusion follows", "Both conclusions follow"], "a": 1, "x": "Knowing she woke up does not prove the alarm caused it: other reasons for waking up are not ruled out. So conclusion I does not follow, and conclusion II correctly says the statements do not prove the alarm rang.", "cn": "A conclusion follows only if it MUST be true from the statements. 'If P then Q' plus P gives Q; Q alone does not give P; 'Q only if P' means Q needs P.", "sl": "Authored item for a concept (new scenario and wording)", "t": "Statements and conclusions"}, {"id": "A-statement_conclusion-o3", "q": "Statements: The school bus is delayed only if the road is flooded. The school bus is delayed. Conclusions: I. The road is flooded. II. The road is not flooded. Which co led out. So conclusion I does not follow, and conclusion II correctly says the statements do not prove the battery is charged.", "cn": "A conclusion follows only if it MUST be true from the statements. 'If P then Q' plus P gives Q; Q alone does not give P; 'Q only if P' means Q needs P.", "sl": "Authored item for a concept (new scenario and wording)", "t": "Statements and conclusions"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
