<h1>Logic practice qb6c0db5c1d</h1><p>10 questions &middot; level L1 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "qb6c0db5c1d", "date": "2026-11-03", "type": "LR", "level": 1, "qs": [{"id": "A-dice_views-b3", "q": "A die has the numbers 1 to 6 on its faces, one number per face. Three views of what is claimed to be the same die are described. View 1: top 1, front 2, right 3. View 2: top 1, front 3, right 5. View 3: top 1, front 2, right 5. Exactly one of these views cannot belong to the same die as the other two. Which view is the odd one out? (Do not assume opposite faces add to 7.)", "o": ["All three views are consistent", "View 3", "View 1", "View 2"], "a": 1, "x": "Views 1 and 2 can come from a single die, and every die that matches them must have 2 opposite 5. View 3 shows 2 and 5 on faces that touch, which is impossible, so View 3 is the odd one out.", "cn": "A view that cannot belong to the same die is found by checking which faces the other views force to be opposite.", "sl": "Authored item for a concept (new construction and wording)", "t": "Cubes and dice"}, {"id": "V-syllogism-117", "q": "Statements: Some pens are books. All books are bags. (Every group named has at least one member.)\nConclusions:\nI. Some pens are bags.\nII. All books are pens.\nWhich conclusion follows?", "o": ["Only I follows", "Only II follows", "Neither follows", "Both follow"], "a": 0, "x": "A conclusion follows only if it is true in every possible picture of the statements, taking each named group to have at least one member. I holds in every picture; for II a picture exists where it fails.", "cn": "A conclusion follows only if it is true in every possible picture, not just in one. \"Some A are B\" can be reversed; \"All A are B\" cannot.", "sl": "Original variant of a concept (new items and wording)", "t": "Syllogism"}, {"id": "V-seating_arrangement-80", "q": "Five friends A, B, D, E, F sit in a row facing north. F sits immediately to the left of B. A sits at the left end. A and E sit next to each other. A and B do not sit next to each other. B sits immediately to the left of D. Who sits in the middle?", "o": ["A", "D", "F", "B"], "a": 2, "x": "Place the fixed clues first, then fit the rest. The only arrangement that works, from left to right, is A E F B D, so F sits in the middle.", "cn": "Start with the clues that fix a place (ends, 'immediately left of') and then use the others to rule out the rest. Facing north, left is west.", "sl": "Original variant of a concept (new items and wording)", "t": "Seating arrangement"}, {"id": "A-coding_shift-b2", "q": "In a certain code, DOG is written as ALD. How is SUN written in that code?", "o": ["QSL", "PRK", "OQJ", "VXQ"], "a": 1, "x": "Each letter moves 3 places backward in the alphabet: D to A, O to L, G to D. So S to P, U to R, N to K, and SUN becomes PRK.", "cn": "In a letter code, check how each letter moves. The same shift applies to every letter of the new word.", "sl": "Authored item for a concept (new construction and wording)", "t": "Coding-decoding"}, {"id": "A-statement_conclusion-o35", "q": "Statements: If the exam is postponed, every student gets a notice. Every student got a notice. Conclusions: I. The exam was postponed. II. The notice was about the postponement.", "o": ["Only conclusion I follows", "Both conclusions follow", "Only conclusion II follows", "Neither conclusion follows"], "a": 3, "x": "The notice is guaranteed only when the exam is postponed; getting a notice does not mean the exam was postponed (it could have another cause), so I does not follow. The statements never say what the notice was about, so II does not follow either.", "cn": "Conclusions must be forced by the statements; a result that could have other causes proves nothing.", "sl": "Authored item for a concept (new scenario and wording)", "t": "Statement and conclusion"}, {"id": "A-statement_conclusion-o38", "q": "Statements: If the printer is out of paper, the print queue pauses. If the print queue pauses, the office calls the supplier. The printer is out of paper. Conclusions: I. The office calls the supplier. II. The supplier delivers new paper the same day.", "o": ["Neither conclusion follows", "Both conclusions follow", "Only conclusion I follows", "Only conclusion II follows"], "a": 2, "x": "The statements chain: out of paper pauses the queue, a paused queue makes the office call the supplier, and the printer is out of paper, so I follows. Nothing in the statements says when the supplier delivers, so II does not follow.", "cn": "Chain the conditions step by step; a conclusion that adds new facts is not forced.", "sl": "Authored item for a concept (new scenario and wording)", "t": "Statement and conclusion"}, {"id": "A-statement_conclusion-o37", "q": "Statements: All curators in the gallery are graduates. No graduate is under 18. (Every group named has at least one member.) Conclusions: I. No curator in the gallery is under 18. II. Some graduates are curators in the gallery.", "o": ["Only conclusion I follows", "Neither conclusion follows", "Only conclusion II follows", "Both conclusions follow"], "a": 3, "x": "Every curator is a graduate and no graduate is under 18, so no curator can be under 18: I follows. All curators are graduates and the named groups are non-empty, so some graduates are curators: II follows.", "cn": "Chain the universal statements, and remember \"all A are B\" also gives \"some B are A\".", "sl": "Authored item for a concept (new scenario and wording)", "t": "Statement and conclusion"}, {"id": "A-data_sufficiency-b4", "q": "What is Meena's present age? Statement 1: In 5 years she will be twice her daughter's age then, and her daughter will be 10 years old then. Statement 2: Her present age is a multiple of 3. Which statement(s) are sufficient to answer the question?", "o": ["Both statements together are needed", "Statement 2 alone is sufficient", "Either statement alone is sufficient", "Statement 1 alone is sufficient"], "a": 3, "x": "Statement 1 alone: in 5 years Meena will be 2 x 10 = 20, so she is 15 now - sufficient. Statement 2 alone: many ages are multiples of 3 - not sufficient.", "cn": "Do not solve fully: ask whether the statements FIX a single answer. Test each statement alone first, then both together.", "sl": "Authored item for a concept (new construction and wording)", "t": "Data sufficiency"}, {"id": "A-data_sufficiency-b5", "q": "Is the integer n even? Statement 1: n^2 is even. Statement 2: n + 1 is odd. Which statement(s) are sufficient to answer the question?", "o": ["Statement 2 alone is sufficient", "Either statement alone is sufficient", "Statement 1 alone is sufficient", "Both statements together are needed"], "a": 1, "x": "Statement 1 alone: if n were odd, n^2 would be odd, so n^2 even forces n even - sufficient. Statement 2 alone: n + 1 odd forces n even - sufficient. Each statement alone fixes the answer.", "cn": "Do not solve fully: ask whether the statements FIX a single answer. Test each statement alone first, then both together.", "sl": "Authored item for a concept (new construction and wording)", "t": "Data sufficiency"}, {"id": "A-data_sufficiency-b6", "q": "What is the value of x + y? Statement 1: x - y = 4. Statement 2: x = 3y. Which statement(s) are sufficient to answer the question?", "o": ["Either statement alone is sufficient", "Statement 1 alone is sufficient", "Both statements together are needed", "Statement 2 alone is sufficient"], "a": 2, "x": "Statement 1 alone: many pairs differ by 4 - not sufficient. Statement 2 alone: many pairs with x = 3y - not sufficient. Together: 3y - y = 4 gives y = 2, x = 6, so x + y = 8 - sufficient.", "cn": "Do not solve fully: ask whether the statements FIX a single answer. Test each statement alone first, then both together.", "sl": "Authored item for a concept (new construction and wording)", "t": "Data sufficiency"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
