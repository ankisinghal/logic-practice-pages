<script>const D={"id": "qc53016cffe", "date": "2026-11-28", "type": "LR", "level": 1, "qs": [{"id": "A-dice_opposite-d1", "q": "Two views of the same die are described. In the first view, the top face shows 1, the front face shows 2 and the right face shows 3. In the second view, the top face shows 1, the front face shows 4 and the right face shows 5. Which number is on the face opposite the face numbered 2?", "o": ["3", "5", "6", "4"], "a": 3, "x": "With 1 on top in both views, the four side faces in clockwise order must have 2 next to 3 and 4 next to 5. The only cyclic order that fits both views is 2, 3, 4, 5, so 2 is opposite 4.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "dice_opposite"}, {"id": "A-dice_tilt-d2", "q": "A standard die always has opposite faces adding to 7. It rests on a table with 4 on top, 1 facing north and 2 facing east. The die is tipped over once towards the east, and then once towards the north. Which number is on top after these two tips?", "o": ["4", "2", "6", "3"], "a": 2, "x": "Initially the bottom is 3, west is 5 and south is 6. Tipping east moves the west face up, so 5 is on top. Tipping north then moves the south face up, so 6 ends on top.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "dice_tilt"}, {"id": "A-seating_arrangement-c69", "q": "Seven people A, B, C, D, E, F and G sit in a row of seven chairs numbered 1 to 7 from the viewer's left, facing north. A sits in chair 1 and G sits in chair 7. B sits immediately to A's right. C sits immediately to G's left. D sits exactly midway between B and E. F fills the remaining chair. How many people sit between D and F?", "o": ["One", "Two", "Three", "None"], "a": 0, "x": "A, B, C and G fix chairs 1, 2, 6 and 7. D midway between B (chair 2) and E forces E to chair 4 and D to chair 3, leaving F in chair 5. Exactly one person, E, sits between D and F.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "seating_arrangement"}, {"id": "A-seating_arrangement-c70", "q": "Six people P, Q, R, S, T and U sit in two rows of three facing each other. The north row has seats N1, N2, N3 from west to east; the south row has seats S1, S2, S3 from west to east, with S1 directly opposite N1. P sits in N1. U sits directly opposite P. S sits in S3. Q sits directly opposite T. R sits immediately to the east of Q. Who sits in N2?", "o": ["P", "Q", "R", "T"], "a": 1, "x": "P in N1 puts U in S1, and S in S3 leaves T in S2. Q opposite T puts Q in N2, and R then takes N3 immediately to the east.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "seating_arrangement"}, {"id": "A-seating_arrangement-c71", "q": "Five people A, B, C, D and E sit in a row of five chairs numbered 1 to 5 from the viewer's left, facing north. C sits in chair 2. D sits at the right end. At least one of A and B sits at an end. A does not sit next to D. E sits next to C. Who sits in chair 4?", "o": ["B", "A", "C", "E"], "a": 0, "x": "C fixes chair 2 and D fixes chair 5. E next to C sits in chair 1 or 3. If E were in chair 1, A and B would take chairs 3 and 4 and neither could sit at an end, breaking the end condition; so E is in chair 3. A cannot sit next to D, so A takes chair 1 and B takes chair 4.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "seating_arrangement"}, {"id": "A-coding_shift-c74", "q": "A code is applied to a pair of words: the code lists, in alphabetical order, every letter that appears in BOTH words, with no letter listed more than once. Thus PLANT and TABLE are coded as ALT. How are CREAM and DANCE coded?", "o": ["AEC", "CAE", "ACE", "ACEN"], "a": 2, "x": "Letters of CREAM are A, C, E, M, R; letters of DANCE are A, C, D, E, N. The letters appearing in both are A, C and E, listed alphabetically: ACE.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "coding_shift"}, {"id": "A-coding_shift-c73", "q": "A code replaces each letter by the remainder when its alphabet position is divided by 5, writing the remainders separated by hyphens (A=1 gives 1, E=5 gives 0). Thus DELTA becomes 4-0-2-0-1. How is BRICK coded?", "o": ["2-3-4-3-2", "2-3-4-3-0", "3-2-4-3-1", "2-3-4-3-1"], "a": 3, "x": "For BRICK: B=2 gives 2, R=18 gives 3, I=9 gives 4, C=3 gives 3, K=11 gives 1. The code is 2-3-4-3-1.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "coding_shift"}, {"id": "A-data_sufficiency-b53", "q": "Is triangle ABC a right-angled triangle? Statement 1: AB = 3 cm and BC = 4 cm. Statement 2: CA = 5 cm. Which statement(s) are sufficient?", "o": ["Statement 1 alone is sufficient, but statement 2 alone is not", "Both statements together are sufficient, but neither alone is sufficient", "Statement 2 alone is sufficient, but statement 1 alone is not", "Each statement alone is sufficient"], "a": 1, "x": "Statement 1 alone gives only two sides, which cannot settle the angle. Statement 2 alone gives only one side. Together the sides are 3, 4 and 5, and 3^2 + 4^2 = 5^2, so the triangle is right-angled.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "data_sufficiency"}, {"id": "A-syllogism-c31", "q": "Statements: Some pens are books. No book is a chair. Conclusions: I. Some pens are not chairs. II. All pens being chairs is a possibility. Which conclusion(s) follow(s)?", "o": ["Only conclusion I follows", "Only conclusion II follows", "Both conclusions follow", "Neither conclusion follows"], "a": 0, "x": "The pens that are books cannot be chairs, since no book is a chair, so some pens are not chairs and I follows. Those same pens can never be chairs, so all pens being chairs is impossible and II does not follow.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "syllogism"}, {"id": "A-statement_conclusion-o64", "q": "Statement: A basket holds exactly six eggs. Every egg in the basket is either white or brown. At least one egg in the basket is white. Conclusions: I. At least one egg in the basket is brown. II. It is possible that all six eggs are white. Which conclusion(s) follow(s)?", "o": ["Only conclusion I follows", "Both conclusions follow", "Only conclusion II follows", "Neither conclusion follows"], "a": 2, "x": "The statement allows every egg to be white, so a brown egg is not forced and I does not follow. An all-white basket satisfies every condition, so II follows.", "cn": "Use the stated conditions.", "sl": "Original practice item", "t": "statement_conclusion"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=async()=>{const b=document.getElementById("copy"),c=document.getElementById("code").textContent;try{await navigator.clipboard.writeText(c);b.textContent="Copied"}catch(e){b.textContent="Copy failed - code selected; copy it manually";const r=document.createRange();r.selectNodeContents(document.getElementById("code"));const s=window.getSelection();s.removeAllRanges();s.addRange(r)}};
