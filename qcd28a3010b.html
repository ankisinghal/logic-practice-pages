<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logic practice qcd28a3010b</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>Logic practice qcd28a3010b</h1><p>3 questions &middot; level L1 &middot; about 10 to 15 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "qcd28a3010b", "date": "2026-11-05", "type": "LR", "level": 1, "qs": [{"id": "A-cause_effect-an1", "q": "Two reports describe the same event. I. A burst water pipe flooded the only entrance to a library at 9 AM. II. The library stayed closed that morning because the entrance was flooded. What is the relationship?", "o": ["Statement II is the cause and I is its effect", "Both are effects of independent causes", "Statement I is the cause and II is its effect", "Neither statement is related to the other"], "a": 2, "x": "The burst pipe flooded the entrance. Statement II explicitly says that this flooding caused the closure. I therefore gives the cause and II the effect.", "cn": "Use the stated causal link, not merely the order in which events are listed.", "sl": "Original introductory reasoning question", "t": "Cause Effect"}, {"id": "A-course_of_action-an1", "q": "A school laboratory has a damaged electrical cable with exposed wires. Students are due to use the room shortly. Courses of action: I. Stop use of the room and have a qualified electrician isolate and repair the fault. II. Ask students to avoid looking at the cable while continuing the lesson. Which course of action follows?", "o": ["Neither course of action follows", "Only course of action I follows", "Both courses of action follow", "Only course of action II follows"], "a": 1, "x": "I removes exposure to the hazard and gets it repaired. II does not prevent contact with live wires and leaves the hazard in place.", "cn": "Choose a practical step that directly addresses the stated problem, not a step that only changes attention.", "sl": "Original introductory reasoning question", "t": "Course Of Action"}, {"id": "A-statement_assumption-an1", "q": "The library says: \"To let members return books after closing time, we will install an outside return box.\" Assumptions: I. Members can reach and use the outside box when the library is closed. II. Every member prefers returning books after closing time. Which assumption is necessary for the plan to serve its stated purpose?", "o": ["Only assumption I is necessary", "Neither assumption is necessary", "Both assumptions are necessary", "Only assumption II is necessary"], "a": 0, "x": "If members cannot use the box after closing, the plan cannot provide after-hours returns. The plan does not require every member to prefer that time; it merely offers the option.", "cn": "A necessary assumption is something the plan depends on, not a claim that everyone wants or will use it.", "sl": "Original introductory reasoning question", "t": "Statement Assumption"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
