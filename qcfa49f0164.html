<script>const D={"id": "qcfa49f0164", "date": "2026-11-16", "type": "LR", "level": 1, "qs": [{"id": "A-course_of_action-an20261116-1", "q": "Statement: A clinic has discovered that a booking-system fault gave several patients the same appointment time for tomorrow. Courses of action: I. Staff should check the affected bookings and contact those patients to agree revised times. II. Staff should delete all of tomorrow's appointments without checking which ones are affected. Which course(s) of action logically follow(s)?", "o": ["Both courses of action follow", "Only course of action I follows", "Only course of action II follows", "Neither course of action follows"], "a": 1, "x": "Checking the affected bookings and agreeing revised times directly addresses the clash while keeping patients informed. Deleting every appointment without checking would unnecessarily disrupt unaffected patients.", "cn": "A course of action follows if it is a practical step that directly tackles the problem in the statement. Reject steps that are extreme, unrelated, or punish the wrong people.", "sl": "Original practice item", "t": "Statement and course of action"}, {"id": "A-statement_assumption-an20261116-1", "q": "Statement: A shop plans to replace handwritten price entry at checkout with barcode labels, using its existing scanners. Assumptions: I. The existing scanners can read the proposed barcodes. II. Every customer will buy more products after the change. Which assumption(s) is/are implicit in the plan?", "o": ["Both assumptions are implicit", "Neither assumption is implicit", "Only assumption I is implicit", "Only assumption II is implicit"], "a": 2, "x": "The plan relies on the existing scanners being able to read the new barcodes. It does not require every customer to buy more products.", "cn": "An assumption is implicit only if the statement depends on it being true. Ask: does the step or claim make sense without this? Facts merely related to the topic are not assumptions.", "sl": "Original practice item", "t": "Statement and assumption"}, {"id": "V-l0_series_add-16", "q": "What comes next in the series 2, 5, 8, 11, 14, ?", "o": ["17", "20", "16", "18"], "a": 0, "x": "Each term is 3 more than the one before. 14 + 3 = 17.", "cn": "Find the gap between neighbouring terms. If it is the same each time, keep adding it.", "sl": "Original variant of a concept (new items and wording)", "t": "Number series (L0)"}, {"id": "V-number_series-10", "q": "What comes next in the series 3, 50, 6, 45, 9, 40, ?", "o": ["35", "12", "15", "11"], "a": 1, "x": "Two series are mixed. The odd places go 3, 6, 9 (add 3) and the even places go 50, 45, 40 (subtract 5). The next term is the next odd-place term: 9 + 3 = 12.", "cn": "Find the gaps between terms. If the gaps themselves form a pattern, continue that pattern. Also test squares, doubling and two mixed series.", "sl": "Original variant of a concept (new items and wording)", "t": "Number series"}, {"id": "V-directions-9", "q": "Riya walks 15 km east, then turns right and walks 6 km, then turns right and walks 15 km. How far and in which direction is Riya from the starting point?", "o": ["6 km north", "6 km west", "6 km north-east", "6 km south"], "a": 3, "x": "Take east as +x and north as +y. After the walk the position is (0, -6) km from the start. Distance = square root of (0)^2 + (-6)^2 = 6 km, in the south direction.", "cn": "Track each move with north, east, south and west. Turning right from north faces east, and opposite moves cancel. Distance is the straight line (Pythagoras).", "sl": "Original variant of a concept (new items and wording)", "t": "Directions"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
