<script>const D={"id": "qd2edb68707", "date": "2026-11-09", "type": "LR", "level": 1, "qs": [{"id": "V-course_of_action-5", "q": "Statement: The village bus is often late, so workers miss the morning shift at the factory. Courses of action: I. The factory should ask the bus operator to keep the morning buses on time. II. The factory should arrange a dedicated bus for its workers if the delays continue. Which course(s) of action logically follow(s)?", "o": ["Neither course of action follows", "Only course of action I follows", "Only course of action II follows", "Both courses of action follow"], "a": 3, "x": "Asking the operator to run on time and arranging a dedicated bus if that fails are both practical responses to the lateness.", "cn": "A course of action follows if it is a practical step that directly tackles the problem in the statement. Reject steps that are extreme, unrelated, or punish the wrong people.", "sl": "Original variant of a concept (new items and wording)", "t": "Statement and course of action"}, {"id": "V-cause_effect-6", "q": "Two statements are given: I. The price of petrol in the city rose by two rupees on Tuesday. II. The city library extended its Sunday opening hours this month. What is the relationship between them?", "o": ["Statement II is the cause and statement I is its effect", "Statement I is the cause and statement II is its effect", "Both statements are effects of independent causes", "Both statements are effects of a common cause"], "a": 2, "x": "Fuel prices and library hours have no link; the two statements are effects of independent causes.", "cn": "First ask which event could make the other happen. If one makes the other happen, that is the cause. If a third event explains both, they are effects of a common cause; if nothing links them, the causes are independent.", "sl": "Original variant of a concept (new items and wording)", "t": "Cause and effect"}, {"id": "V-number_series-4", "q": "What comes next in the series 7, 14, 23, 34, 47, ?", "o": ["65", "64", "62", "60"], "a": 2, "x": "Each term is a square minus 2: 3^2 - 2, 4^2 - 2, 5^2 - 2, 6^2 - 2, 7^2 - 2. The next is 8^2 - 2 = 62.", "cn": "Find the gaps between terms. If the gaps themselves form a pattern, continue that pattern. Also test squares, doubling and two mixed series.", "sl": "Original variant of a concept (new items and wording)", "t": "Number series"}, {"id": "V-directions-4", "q": "Sameer walks 5 km east, then turns left and walks 3 km, then turns left and walks 5 km. How far and in which direction is Sameer from the starting point?", "o": ["3 km north", "3 km south-east", "3 km south", "3 km west"], "a": 0, "x": "Take east as +x and north as +y. After the walk the position is (0, 3) km from the start. Distance = square root of (0)^2 + (3)^2 = 3 km, in the north direction.", "cn": "Track each move with north, east, south and west. Turning right from north faces east, and opposite moves cancel. Distance is the straight line (Pythagoras).", "sl": "Original variant of a concept (new items and wording)", "t": "Directions"}, {"id": "V-l0_series_add-5", "q": "What comes next in the series 2, 7, 12, 17, 22, ?", "o": ["26", "27", "32", "28"], "a": 1, "x": "Each term is 5 more than the one before. 22 + 5 = 27.", "cn": "Find the gap between neighbouring terms. If it is the same each time, keep adding it.", "sl": "Original variant of a concept (new items and wording)", "t": "Number series (L0)"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
