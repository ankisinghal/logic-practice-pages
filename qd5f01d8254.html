<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>LR practice qd5f01d8254</h1><p>10 questions &middot; level L1 &middot; about 20 to 30 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>
<div id="qs"></div><p id="warn" class="bad"></p><button id="sub">Submit</button>
<div id="res"><h2 id="score"></h2><div id="rev"></div><p>Results code (copy it and paste it into your own Instinct chat):</p><code id="code"></code><button id="copy">Copy result code</button></div>
<script>const D={"id": "qd5f01d8254", "date": "2026-11-09", "type": "LR", "level": 1, "qs": [{"id": "A-statement_conclusion-o42", "q": "Statement: The seminar starts after lunch and ends before dinner. The seminar has started.\nConclusions:\nI. Lunch is over.\nII. Dinner has started.\nWhich conclusion(s) logically follow(s)?", "o": ["Only conclusion I follows", "Both conclusions follow", "Neither conclusion follows", "Only conclusion II follows"], "a": 0, "x": "The seminar starts only after lunch, so since it has started, lunch must be over: I follows. The statement says the seminar ends before dinner, but a started seminar leaves dinner's status undetermined - it may or may not have started - so II does not follow. Only I.", "cn": "A starts-after rule settles what must already be over; it says nothing about whether what comes later has begun.", "sl": "Original practice item", "t": "Statement-Conclusion"}, {"id": "A-statement_conclusion-o43", "q": "Statement: In a race, Asha finished ahead of Bimal. Bimal finished ahead of Charan.\nConclusions:\nI. Asha finished ahead of Charan.\nII. Charan finished ahead of Bimal.\nWhich conclusion(s) logically follow(s)?", "o": ["Both conclusions follow", "Only conclusion II follows", "Neither conclusion follows", "Only conclusion I follows"], "a": 3, "x": "Finishing ahead is transitive: Asha ahead of Bimal and Bimal ahead of Charan means Asha finished ahead of Charan, so I follows. II states the opposite of a given fact, so it does not follow. Only I.", "cn": "Ahead-of chains carry through: ahead of the second, who is ahead of the third, means ahead of the third.", "sl": "Original practice item", "t": "Statement-Conclusion"}, {"id": "A-data_sufficiency-b22", "q": "What is the area of a rectangle? Statement 1: Its length is 12 cm. Statement 2: Its width is 5 cm. Which statement(s) are sufficient to answer the question?", "o": ["Statement 1 alone is sufficient", "Both statements together are needed", "Either statement alone is sufficient", "Statement 2 alone is sufficient"], "a": 1, "x": "Statement 1 gives only the length, Statement 2 only the width; neither alone can give the area. Together: 12 x 5 = 60 sq cm. Both are needed.", "cn": "The area of a rectangle needs both dimensions; one alone is never enough.", "sl": "Original practice item", "t": "Data Sufficiency"}, {"id": "A-data_sufficiency-b23", "q": "What is the average of three consecutive integers? Statement 1: The middle integer is 14. Statement 2: The largest of the three integers is 15. Which statement(s) are sufficient to answer the question?", "o": ["Both statements together are needed", "Statement 2 alone is sufficient", "Either statement alone is sufficient", "Statement 1 alone is sufficient"], "a": 2, "x": "Three consecutive integers average to the middle one. Statement 1 fixes the middle at 14, so the average is 14. Statement 2 fixes the largest at 15, so the integers are 13, 14, 15 and the average is 14. Each alone suffices.", "cn": "Consecutive integers average to the middle one, so any one value fixes the whole run.", "sl": "Original practice item", "t": "Data Sufficiency"}, {"id": "A-seating_arrangement-c10", "q": "Four friends M, N, O and R sit at a square table, one person on each side, all facing the centre. Picture the table from above: the four sides are named North, East, South and West. M sits on the North side. O sits immediately to M's own left. R sits on the side opposite O. N takes the remaining side.\nWho sits on the South side?", "o": ["O", "N", "R", "M"], "a": 1, "x": "M sits on the North side facing the centre, so M faces south and M's own left is the East side: O sits East. Opposite East is West, so R sits West. The remaining side, South, goes to N. The South side is N.", "cn": "Pin the frame first: for someone facing the centre, their own left is the next side clockwise seen from above.", "sl": "Original practice item", "t": "Seating Arrangement"}, {"id": "A-seating_arrangement-c11", "q": "Five friends A, B, C, D and E stand on the five steps of a podium, one person per step. Step 1 is the highest and step 5 is the lowest. D stands on step 1. C stands on step 4. A stands on a higher step than C, but not on step 1. B stands on the step immediately above A. E takes the remaining step.\nWho stands on step 5?", "o": ["C", "A", "E", "B"], "a": 2, "x": "D is on step 1 and C on step 4. A must be on step 2 or 3 (higher than C, not step 1); if A were on step 2, B would need step 1, which D holds. So A is on step 3 and B on step 2. The only step left for E is step 5.", "cn": "Treat a higher step as a smaller number, and test each possible step for A against who already holds step 1.", "sl": "Original practice item", "t": "Seating Arrangement"}, {"id": "A-syllogism-c12", "q": "Statements: Some crayons are markers. Some markers are red.\nConclusions:\nI. Some crayons are red.\nII. No crayon is red.\nWhich conclusion(s) follow(s)?", "o": ["Only conclusion I follows", "Both conclusions follow", "Only conclusion II follows", "Neither conclusion follows"], "a": 3, "x": "The red markers may all lie outside the crayons, so I does not follow; and nothing rules out a red crayon, so II does not follow either. Neither follows.", "cn": "Two 'some' statements about a shared middle group cannot carry a conclusion across to the outer groups.", "sl": "Original practice item", "t": "Syllogism"}, {"id": "A-syllogism-c13", "q": "Statements: Some kites are handmade. Some handmade things are not fragile.\nConclusions:\nI. Some kites are not fragile.\nII. Some kites are fragile.\nWhich conclusion(s) follow(s)?", "o": ["Neither conclusion follows", "Only conclusion II follows", "Only conclusion I follows", "Both conclusions follow"], "a": 0, "x": "The handmade things that are not fragile need not be kites, so I does not follow; and the statements never settle whether any kite is fragile, so II does not follow either. Neither follows.", "cn": "A 'some are' plus a 'some are not' about the same middle group settle nothing about the outer groups.", "sl": "Original practice item", "t": "Syllogism"}, {"id": "A-coding_shift-c7", "q": "In a certain code, every letter is replaced by multiplying its alphabet position by 3 (A = 1 becomes C = 3, B = 2 becomes F = 6, and so on; if the result is more than 26, subtract 26 until it is not). If CUP is written as IKV in this code, how is RICE written?", "o": ["ABIO", "BZIO", "BAIQ", "BAIO"], "a": 3, "x": "R = 18 -> 54 -> 54 - 52 = 2 = B. I = 9 -> 27 -> 27 - 26 = 1 = A. C = 3 -> 9 = I. E = 5 -> 15 = O. So RICE is written as BAIO. (Check: CUP -> 3->9 = I, 21->63->11 = K, 16->48->22 = V = IKV.)", "cn": "Multiply each letter's alphabet position by 3, wrapping past Z back to A; work letter by letter.", "sl": "Original practice item", "t": "Coding-Decoding"}, {"id": "A-coding_shift-c8", "q": "In a certain code, the letters of a word are rewritten in alphabetical order. If PLANT is coded as ALNPT, how is BRICK coded?", "o": ["BCKIR", "BICRK", "BCIKR", "CBIKR"], "a": 2, "x": "The letters of BRICK sorted alphabetically are B, C, I, K, R, so BRICK is coded as BCIKR. (Check: PLANT sorted is A, L, N, P, T = ALNPT.)", "cn": "Rewrite the letters in alphabetical order; the word's original order does not matter.", "sl": "Original practice item", "t": "Coding-Decoding"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
