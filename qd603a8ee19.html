-3 and y = 2 gives x^2 = 9 > 4 = y^2 but x < y, while x = 3, y = 2 gives x > y - so it does not settle the question. Statement 2: x = y + 3, so x is always greater than y - sufficient.", "cn": "Squaring hides signs, so x^2 > y^2 says nothing about which of x and y is bigger; a fixed positive difference settles it.", "sl": "Original authored item (new construction)", "t": "Data Sufficiency"}, {"id": "A-seating_arrangement-c5", "q": "Six friends P, Q, R, S, T and U sit in two rows of three, the rows facing each other. P, Q and R are in the row facing south; S, T and U are in the row facing north, and each person sits exactly opposite one person in the other row. Seen from the viewer's side: P sits at the left end of the south-facing row, Q sits in the middle of that row, and R sits at its right end. S sits exactly opposite P. T sits immediately to S's right, from S's own point of view.\nWho sits opposite Q?", "o": ["U", "S", "T", "R"], "a": 2, "x": "The south-facing row is P - Q - R (viewer's left to right), so the north-facing row sits directly below it with each person opposite their counterpart. S is opposite P, so S is at the viewer-left seat of the north-facing row. S faces north, so S's own right is the viewer's right: T takes the middle seat of the north-facing row, opposite Q. (U is left, opposite R.)", "cn": "Fix one row from the viewer's side, place the opposite person, then apply the facing direction for left and right.", "sl": "Original authored item (new construction)", "t": "Seating Arrangement"}, {"id": "A-seating_arrangement-c3", "q": "Five friends A, B, C, D and E sit in a row, some facing north and some facing south. All positions below are from the viewer's side, looking at the row: C sits at the left end and faces south. A sits immediately to the right of C (the viewer's right) and faces north. B sits exactly in the middle of the row and faces south. D faces north and sits between B and E. E faces south.\nWho sits on the immediate LEFT of B, from B's own point of view?", "o": ["C", "A", "E", "D"], "a": 3, "x": "From the viewer's side the row is C, A, B, D, E (left to right): C at the left end, A next on the viewer's right, B in the middle, D between B and E. B faces south, so B's own left is the viewer's right; the person immediately on that side of B is D. (A is on B's right, not left.)", "cn": "For a person facing south, left and right swap relative to the page. Fix the row order first, then apply the facing.", "sl": "Original authored item (new construction)", "t": "Seating Arrangement"}, {"id": "A-seating_arrangement-c4", "q": "Six people M, N, O, P, Q and R sit in a row facing north. O sits at the left end. M sits fourth from the left. Q sits immediately to the left of M. P sits between O and Q. N sits second to the right of M.\nWho sits at the right end?", "o": ["P", "R", "M", "N"], "a": 3, "x": "Positions 1 to 6 from the left: O at 1; M at 4; Q at 3 (immediate left of M); P between O and Q, so at 2; N at 6 (second to the right of M). The remaining person R sits at 5. The right end is position 6, where N sits.", "cn": "Fix positions from the ends first, then place immediate neighbours, then fill the gap.", "sl": "Original authored item (new construction)", "t": "Seating Arrangement"}, {"id": "A-syllogism-c3", "q": "Statements: All novels are stories. No story is a poem.\nConclusions:\nI. No novel is a poem.\nII. Some poems are stories.\nWhich conclusion(s) follow(s)?", "o": ["Only conclusion I follows", "Both conclusions follow", "Only conclusion II follows", "Neither conclusion follows"], "a": 0, "x": "Every novel is inside the stories, and no story overlaps the poems, so no novel can be a poem: I follows. II says some poems are stories, which directly contradicts 'No story is a poem': II does not follow.", "cn": "Chain the universal statements through the shared term; a conclusion that contradicts a premise can never follow.", "sl": "Original authored item (new construction)", "t": "Syllogism"}, {"id": "A-syllogism-c4", "q": "Statements: Some doctors are not athletes. All athletes are musicians.\nConclusions:\nI. Some doctors are not musicians.\nII. All musicians are athletes.\nWhich conclusion(s) follow(s)?", "o": ["Only conclusion II follows", "Only conclusion I follows", "Both conclusions follow", "Neither conclusion follows"], "a": 3, "x": "From 'Some doctors are not athletes' and 'All athletes are musicians' nothing ties those doctors to musicians: the doctors outside athletes could be musicians or not, so I does not follow. II reverses 'All athletes are musicians', and a universal statement cannot be reversed: II does not follow.", "cn": "A particular negative premise ('some are not') yields no definite link to a third term, and 'All A are B' never converts to 'All B are A'.", "sl": "Original authored item (new construction)", "t": "Syllogism"}, {"id": "A-syllogism-c5", "q": "Statements: Some chefs are not farmers. Some farmers are not divers.\nConclusions:\nI. Some chefs are not divers.\nII. No chef is a diver.\nWhich conclusion(s) follow(s)?", "o": ["Neither conclusion follows", "Both conclusions follow", "Only conclusion II follows", "Only conclusion I follows"], "a": 0, "x": "Two 'some ... are not' statements do not chain: the chefs who are not farmers and the farmers who are not divers are separate groups, so nothing links chefs to divers - I does not follow, and the stronger II fails with it.", "cn": "Two particular negative premises can never force a conclusion linking the two end terms.", "sl": "Original authored item (new construction)", "t": "Syllogism"}, {"id": "A-coding_shift-c2", "q": "In a certain code, each letter is replaced by its position in the alphabet (A = 1, B = 2, ..., Z = 26) and the code for a word is the sum of its letter values. If CAT is coded as 24 and DOG is coded as 26, how is PIG written in that code?", "o": ["30", "32", "33", "31"], "a": 1, "x": "P + I + G = 16 + 9 + 7 = 32. (Check: CAT = 3 + 1 + 20 = 24 and DOG = 4 + 15 + 7 = 26, as given.)", "cn": "Add the alphabet positions of the letters; use the two worked examples to confirm the rule.", "sl": "Original authored item (new construction)", "t": "Coding-Decoding"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
