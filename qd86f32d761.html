<script>const D={"id": "qd86f32d761", "date": "2026-10-21", "type": "LR", "level": 1, "qs": [{"id": "V-dice_views-32", "q": "A die is thrown twice and its faces carry the numbers 1 to 6, one number per face. In the first throw the top face shows 4, the face facing you shows 5 and the right face shows 1. In the second throw the top face shows 4, the face facing you shows 2 and the right face shows 6. Which number is on the face opposite the face that shows 4? (Do not assume opposite faces add to 7; use only what the two throws show.)", "o": ["5", "2", "1", "3"], "a": 3, "x": "The face with 4 is seen with 5 and 1 in the first throw, and with 2 and 6 in the second. A face next to 4 cannot be opposite it, so the opposite face is none of 5, 1, 2, 6. The only number left is 3, so 3 is opposite 4.", "cn": "A face seen next to another face can never be opposite it. List all four neighbours from the two throws; the one number left is opposite.", "sl": "Original variant of a concept (new items and wording)", "t": "Cubes and dice"}, {"id": "V-directions-32", "q": "Neha walks 12 km west, then turns right and walks 5 km. How far and in which direction is Neha from the starting point?", "o": ["13 km north", "13 km north-west", "13 km north-east", "17 km north-west"], "a": 1, "x": "Take east as +x and north as +y. After the walk the position is (-12, 5) km from the start. Distance = square root of (-12)^2 + (5)^2 = 13 km, in the north-west direction.", "cn": "Track each move with north, east, south and west. Turning right from north faces east, and opposite moves cancel. Distance is the straight line (Pythagoras).", "sl": "Original variant of a concept (new items and wording)", "t": "Directions"}, {"id": "V-number_analogy-32", "q": "Find the missing number: 2 : 5 :: 8 : ?", "o": ["73", "63", "65", "64"], "a": 2, "x": "5 is 2 squared plus 1, so the answer is 8 squared plus 1 = 65.", "cn": "Find the rule that turns the first number into the second, then apply the same rule to the third.", "sl": "Original variant of a concept (new items and wording)", "t": "Analogy (number pairs)"}, {"id": "V-mirror_clock-32", "q": "A clock shows 1:40. What time will its image show in a plane mirror?", "o": ["10:20", "11:40", "1:40", "11:20"], "a": 0, "x": "Mirror time = 11:60 - 1:40 (equivalently 12:00 minus the time shown, in minutes) = 10:20.", "cn": "Mirror image of a clock time = 11:60 minus the time (use 12:00 minus the time shown).", "sl": "Original variant of a concept (new items and wording)", "t": "Mirror image (clock)"}, {"id": "V-alphabet_position-32", "q": "Which letter is 7 places to the left of the 14th letter from the right in the English alphabet?", "o": ["G", "H", "F", "E"], "a": 2, "x": "The 14th letter from the right is at position 13 from the left, which is M. Moving 7 places to the left gives position 13 - 7 = 6, which is F.", "cn": "Fix one end of the alphabet: from the left A is 1; from the right A is 26. Add for right, subtract for left, then read the letter.", "sl": "Original variant of a concept (new items and wording)", "t": "Alphabet test"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
