<script>const D={"id": "qdf5653eba8", "date": "2026-11-04", "type": "LR", "level": 1, "qs": [{"id": "A-dice_views-b4", "q": "A die has the numbers 1 to 6 on its faces, one number per face. Initially, 1 is on top, 2 faces you and 3 is on the right. First roll the die one quarter-turn towards you (the top face moves to the front). Then roll it one quarter-turn to your left (the right face moves to the top). What is the sum of the numbers now on top and facing you? Do not assume opposite faces add to 7.", "o": ["6", "3", "5", "4"], "a": 3, "x": "After the first roll, 1 faces you and 3 remains on the right. The second roll moves 3 to the top and does not change the front face. The required sum is 3 + 1 = 4.", "cn": "Follow each quarter-turn in order and keep track of which faces do not move.", "sl": "Authored item for a concept (new construction and wording)", "t": "Dice Views"}, {"id": "A-syllogism-b1", "q": "Statements: Some sculptors are gardeners. No gardener is a pilot. Conclusions: I. Some sculptors are not pilots. II. No sculptor is a pilot. Which conclusion follows?", "o": ["Only conclusion I follows", "Neither conclusion follows", "Only conclusion II follows", "Both conclusions follow"], "a": 0, "x": "The sculptors who are gardeners cannot be pilots, so at least some sculptors are not pilots. Other sculptors may be pilots, so the statements do not rule out every sculptor being a pilot.", "cn": "Track the particular group guaranteed to exist; a fact about some members does not establish it for all members.", "sl": "Authored item for a concept (new construction and wording)", "t": "Syllogism"}, {"id": "A-seating_arrangement-b1", "q": "Five people A, B, C, D and E sit in a row facing north. B sits immediately to the right of A. C sits immediately to the right of B. D sits immediately to the left of E. E is not at either end. Who sits at the right end?", "o": ["C", "A", "E", "D"], "a": 0, "x": "A, B, C form the consecutive block ABC, and D, E form the block DE. The order ABCDE would put E at an end, so the row is DEABC. C sits at the right end.", "cn": "Combine fixed consecutive blocks, then apply the remaining positional restriction.", "sl": "Authored item for a concept (new construction and wording)", "t": "Seating Arrangement"}, {"id": "A-coding_shift-b4", "q": "A code moves each letter backward by the same number of places, wrapping before A to Z. For example, FISH is coded as CFPE. What original word is represented by QOBB?", "o": ["NLYY", "TRFF", "TOBB", "TREE"], "a": 3, "x": "F -> C, I -> F, S -> P and H -> E each move backward by 3. To decode QOBB, move forward by 3: Q -> T, O -> R, B -> E, B -> E, giving TREE.", "cn": "Decode by undoing the encoding operation; do not apply the backward shift a second time.", "sl": "Authored item for a concept (new construction and wording)", "t": "Coding Shift"}, {"id": "A-seating_arrangement-b2", "q": "Five people P, Q, R, S and T sit in a row facing north. Q sits immediately to the right of P. There is exactly one seat between P and R. S sits at the right end. T is not at either end. R sits to the left of Q. Who sits in the middle?", "o": ["T", "P", "R", "Q"], "a": 1, "x": "P cannot be at the left end because that would put R to the right of Q. With P third, Q is fourth, R is first, and T takes the second seat; S is fifth. The row is R T P Q S, so P is in the middle.", "cn": "Use the direction of a separated pair as well as the number of seats between them.", "sl": "Authored item for a concept (new construction and wording)", "t": "Seating Arrangement"}, {"id": "A-data_sufficiency-b7", "q": "A bag contains only red and blue counters. Is a randomly chosen counter more likely to be red than blue? Statement 1: There are 18 red counters. Statement 2: There are 30 counters in total. Which statement(s) are sufficient to answer the question?", "o": ["Either statement alone is sufficient", "Statement 1 alone is sufficient", "Both statements together are needed", "Statement 2 alone is sufficient"], "a": 2, "x": "Statement 1 alone gives no blue count: 18 red and 2 blue gives Yes, while 18 red and 20 blue gives No. Statement 2 alone gives no colour split. Together there are 18 red and 12 blue, so the answer is definitely Yes.", "cn": "Sufficient information must fix whether the answer is Yes or No, not merely give one relevant number.", "sl": "Authored item for a concept (new construction and wording)", "t": "Data Sufficiency"}, {"id": "A-data_sufficiency-b8", "q": "What is the perimeter of a rectangle? Statement 1: The sum of its length and width is 17 cm. Statement 2: Its area is 60 square cm. Which statement(s) are sufficient to answer the question?", "o": ["Both statements together are needed", "Statement 2 alone is sufficient", "Statement 1 alone is sufficient", "Either statement alone is sufficient"], "a": 2, "x": "Statement 1 fixes the perimeter as 2 x 17 = 34 cm. Statement 2 does not: rectangles 6 cm by 10 cm and 5 cm by 12 cm both have area 60, but perimeters 32 cm and 34 cm.", "cn": "Check whether the requested quantity is fixed; you may not need each individual dimension.", "sl": "Authored item for a concept (new construction and wording)", "t": "Data Sufficiency"}, {"id": "A-data_sufficiency-b9", "q": "A four-digit entry code is made by arranging the digits 2, 4, 6 and 8 once each. What is its first digit? Statement 1: The code is greater than 7000. Statement 2: Its last digit is 2. Which statement(s) are sufficient to answer the question?", "o": ["Either statement alone is sufficient", "Both statements together are needed", "Statement 2 alone is sufficient", "Statement 1 alone is sufficient"], "a": 3, "x": "Only an 8 in the first position can make this code greater than 7000, so Statement 1 fixes the first digit. With only Statement 2, the first digit could be 4, 6 or 8, so it is insufficient.", "cn": "A statement can determine the requested part of an object even when the complete object remains unknown.", "sl": "Authored item for a concept (new construction and wording)", "t": "Data Sufficiency"}, {"id": "A-data_sufficiency-b10", "q": "A class has only boys and girls, with at least one of each. What fraction of the class are girls? Statement 1: The ratio of boys to girls is 3 : 2. Statement 2: Girls make up 40% of the class. Which statement(s) are sufficient to answer the question?", "o": ["Statement 1 alone is sufficient", "Statement 2 alone is sufficient", "Either statement alone is sufficient", "Both statements together are needed"], "a": 2, "x": "Statement 1 fixes the girls fraction as 2/(3 + 2) = 2/5. Statement 2 independently fixes it as 40/100 = 2/5. Each statement alone answers the question.", "cn": "A ratio and a percentage can independently fix the same fraction even when the total count is unknown.", "sl": "Authored item for a concept (new construction and wording)", "t": "Data Sufficiency"}, {"id": "A-data_sufficiency-b11", "q": "A cyclist travels at a constant speed. How long does the journey take? Statement 1: The distance is 36 km. Statement 2: The cyclist travels 12 km in each hour, and the journey is 36 km long. Which statement(s) are sufficient to answer the question?", "o": ["Both statements together are needed", "Statement 2 alone is sufficient", "Either statement alone is sufficient", "Statement 1 alone is sufficient"], "a": 1, "x": "Statement 1 alone gives no speed: 36 km could take different times. Statement 2 gives both distance and speed, so time = 36/12 = 3 hours. Statement 1 is unnecessary.", "cn": "Test each complete statement independently; do not borrow data from the other statement.", "sl": "Authored item for a concept (new construction and wording)", "t": "Data Sufficiency"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
