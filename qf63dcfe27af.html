<script>const D={"id": "qf63dcfe27af", "date": "2026-10-31", "type": "LR", "level": 1, "qs": [{"id": "A-statement_conclusion-o24", "q": "Statements: If it rains this evening, the colony park closes early. It is raining this evening. Conclusions: I. The colony park closes early. II. It will stop raining before night. Which conclusion follows?", "o": ["Both conclusions follow", "Neither conclusion follows", "Only conclusion I follows", "Only conclusion II follows"], "a": 2, "x": "The first statement makes an early park closing a certain result of rain this evening, and it is given as raining, so conclusion I must be true. The statements say nothing about when the rain will stop, so conclusion II is not established and does not follow.", "cn": "A conclusion follows only if it MUST be true from the statements. 'If P then Q' plus P gives Q; Q alone does not give P; 'Q only if P' means Q needs P.", "sl": "Authored item for a concept (new scenario and wording)", "t": "Statements and conclusions"}, {"id": "A-statement_conclusion-o25", "q": "Statements: If the team wins the match, the coach treats the players to ice cream. The coach treated the players to ice cream. Conclusions: I. The team won the match. II. The players received ice cream from the coach. Which conclusion follows?", "o": ["Only conclusion II follows", "Both conclusions follow", "Only conclusion I follows", "Neither conclusion follows"], "a": 0, "x": "Winning is given as a sufficient reason for the treat, not the only possible reason, so the treat alone does not establish that the team won; conclusion I does not follow. Conclusion II is directly given by the second statement, so it follows.", "cn": "A conclusion follows only if it MUST be true from the statements. 'If P then Q' plus P gives Q; Q alone does not give P; 'Q only if P' means Q needs P.", "sl": "Authored item for a concept (new scenario and wording)", "t": "Statements and conclusions"}, {"id": "A-statement_conclusion-o26", "q": "Statements: The bank opens a locker only if the key and the code are used together. Meera opened her bank locker. Conclusions: I. The locker key was used. II. The locker code was used. Which conclusion follows?", "o": ["Only conclusion I follows", "Neither conclusion follows", "Only conclusion II follows", "Both conclusions follow"], "a": 3, "x": "Opening the locker requires both the key and the code together, and the locker was opened, so the key must have been used and the code must have been used. Both conclusions follow.", "cn": "A conclusion follows only if it MUST be true from the statements. 'If P then Q' plus P gives Q; Q alone does not give P; 'Q only if P' means Q needs P.", "sl": "Authored item for a concept (new scenario and wording)", "t": "Statements and conclusions"}, {"id": "A-statement_conclusion-o27", "q": "Statements: If the street dog is hungry, it waits near the tea stall. The street dog is not waiting near the tea stall. Conclusions: I. The street dog is hungry. II. The street dog has been fed today. Which conclusion follows?", "o": ["Only conclusion I follows", "Neither conclusion follows", "Both conclusions follow", "Only conclusion II follows"], "a": 1, "x": "If the dog were hungry it would be waiting near the tea stall, and it is not waiting there, so the statements point against hunger; conclusion I does not follow. Nothing in the statements establishes that the dog has been fed, so conclusion II does not follow either.", "cn": "A conclusion follows only if it MUST be true from the statements. 'If P then Q' plus P gives Q; Q alone does not give P; 'Q only if P' means Q needs P.", "sl": "Authored item for a concept (new scenario and wording)", "t": "Statements and conclusions"}, {"id": "A-statement_conclusion-o28", "q": "Statements: The overnight bus to Manali leaves only if at least twenty passengers have checked in. The overnight bus to Manali left. Conclusions: I. Exactly twenty passengers checked in. II. At least twenty passengers had checked in. Which conclusion follows?", "o": ["Only conclusion II follows", "Only conclusion I follows", "Both conclusions follow", "Neither conclusion follows"], "a": 0, "x": "Leaving requires at least twenty check-ins, and the bus left, so at least twenty passengers must have checked in; conclusion II follows. The count could be more than twenty, so 'exactly twenty' is not established and conclusion I does not follow.", "cn": "A conclusion follows only if it MUST be true from the statements. 'If P then Q' plus P gives Q; Q alone does not give P; 'Q only if P' means Q needs P.", "sl": "Authored item for a concept (new scenario and wording)", "t": "Statements and conclusions"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
