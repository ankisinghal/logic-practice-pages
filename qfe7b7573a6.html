<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:1rem auto;padding:0 1rem;line-height:1.45}.q{border:1px solid #ccc;border-radius:8px;padding:.7rem;margin:.7rem 0}.qt{white-space:pre-wrap}label{display:block;padding:.25rem 0}.ok{color:#0a6b2c;font-weight:600}.bad{color:#b00020;font-weight:600}.tag{font-size:.8rem;color:#555}button{font-size:1rem;padding:.6rem 1rem;margin:.3rem 0}#res{display:none}code{background:#eee;padding:.3rem;display:block;overflow-wrap:anywhere}</style></head><body>
<h1>Logic practice qfe7b7573a6</h1><p>5 questions &middot; level L1 &middot; about 10 to 15 minutes. Use paper for working, no calculator. Pick one answer for every question, then press Submit.</p>

<script>const D={"id": "qfe7b7573a6", "date": "2026-10-21", "type": "LR", "level": 1, "qs": [{"id": "V-syllogism-19", "q": "Statements: All cats are animals. No pets are animals. (Every group named has at least one member.)\nConclusions:\nI. No cats are pets.\nII. Some animals are cats.\nWhich conclusion follows?", "o": ["Neither follows", "Only I follows", "Only II follows", "Both follow"], "a": 3, "x": "A conclusion follows only if it is true in every possible picture of the statements, taking each named group to have at least one member. Checking both, each is forced by the statements.", "cn": "A conclusion follows only if it is true in every possible picture, not just in one. \"Some A are B\" can be reversed; \"All A are B\" cannot.", "sl": "Original variant of a concept (new items and wording)", "t": "Syllogism"}, {"id": "V-clock_angle-19", "q": "What is the angle between the hour hand and the minute hand of a clock at 4:00?", "o": ["120 degrees", "150 degrees", "90 degrees", "135 degrees"], "a": 0, "x": "The hour hand is at 120 degrees from 12 (30 per hour, 0.5 per minute) and the minute hand is at 0 degrees. The difference is 120; the smaller angle is 120 degrees.", "cn": "Hour hand: 30 degrees per hour plus 0.5 per minute. Minute hand: 6 degrees per minute. Take the smaller angle.", "sl": "Original variant of a concept (new items and wording)", "t": "Clock (angle between hands)"}, {"id": "V-number_analogy-19", "q": "Find the missing number: 7 : 343 :: 8 : ?", "o": ["512", "520", "65", "64"], "a": 0, "x": "343 is 7 cubed, so the answer is 8 cubed = 512.", "cn": "Find the rule that turns the first number into the second, then apply the same rule to the third.", "sl": "Original variant of a concept (new items and wording)", "t": "Analogy (number pairs)"}, {"id": "V-letter_value_sum-19", "q": "If A = 1, B = 2, C = 3 and so on, what is the sum of the letter values of the word FACE?", "o": ["17", "16", "15", "14"], "a": 2, "x": "Positions: F = 6, A = 1, C = 3, E = 5. Sum = 15.", "cn": "Count the position of each letter in the alphabet (A=1, B=2, ...), then add.", "sl": "Original variant of a concept (new items and wording)", "t": "Coding (letter values)"}, {"id": "V-mirror_clock-19", "q": "A clock shows 6:00. What time will its image show in a plane mirror?", "o": ["6:10", "6:00", "6:20", "7:00"], "a": 1, "x": "Mirror time = 11:60 - 6:00 (equivalently 12:00 minus the time shown, in minutes) = 6:00.", "cn": "Mirror image of a clock time = 11:60 minus the time (use 12:00 minus the time shown).", "sl": "Original variant of a concept (new items and wording)", "t": "Mirror image (clock)"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
document.getElementById("sub").onclick=()=>{const un=D.qs.map((q,i)=>document.querySelector("input[name=q"+i+"]:checked")?0:i+1).filter(x=>x);if(un.length){document.getElementById("warn").textContent="Please answer every question before submitting. Missing: "+un.join(", ");return}document.getElementById("warn").textContent="";let s=0,a="",rv="";D.qs.forEach((q,i)=>{const c=document.querySelector('input[name=q'+i+']:checked');const v=+c.value;a+=L[v];const ok=v===q.a;if(ok)s++;
rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
</script></body></html>
