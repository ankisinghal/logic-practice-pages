<script>const D={"id": "qff7c82cfcb", "date": "2026-11-08", "type": "LR", "level": 1, "qs": [{"id": "A-statement_conclusion-o41", "q": "Statement: The library opens if and only if it is a weekday. The library is open today.\nConclusions:\nI. Today is a weekday.\nII. Today is not a weekday.\nWhich conclusion(s) logically follow(s)?", "o": ["Neither conclusion follows", "Only conclusion II follows", "Both conclusions follow", "Only conclusion I follows"], "a": 3, "x": "'If and only if' runs both ways: whenever the library is open, it must be a weekday. The library is open, so I follows. II contradicts the premise, so it does not follow. Only I.", "cn": "An 'if and only if' rule works in both directions, unlike a plain 'if'.", "sl": "Original authored item (new construction)", "t": "Statement-Conclusion"}, {"id": "A-data_sufficiency-b20", "q": "What is the simple interest earned on a deposit? Statement 1: The deposit of Rs 8000 was placed at 9% per year for 3 years. Statement 2: The deposit earns Rs 720 in interest each year. Which statement(s) are sufficient to answer the question?", "o": ["Statement 1 alone is sufficient", "Both statements together are needed", "Statement 2 alone is sufficient", "Either statement alone is sufficient"], "a": 0, "x": "Statement 1 gives principal, rate and time, so SI = 8000 x 9 x 3 / 100 = Rs 2160: sufficient alone. Statement 2 gives only the yearly interest; with no duration the total cannot be found: insufficient alone.", "cn": "Simple interest needs principal, rate and time together; a yearly interest figure alone says nothing about the duration.", "sl": "Original authored item (new construction)", "t": "Data Sufficiency"}, {"id": "A-data_sufficiency-b21", "q": "What is the LCM of two positive integers a and b? Statement 1: a = 15 and b = 20. Statement 2: The product of a and b is 300 and their highest common factor is 5. Which statement(s) are sufficient to answer the question?", "o": ["Statement 1 alone is sufficient", "Statement 2 alone is sufficient", "Either statement alone is sufficient", "Both statements together are needed"], "a": 2, "x": "Statement 1 fixes both numbers, so LCM(15, 20) = 60: sufficient alone. Statement 2 gives LCM = product / HCF = 300 / 5 = 60: also sufficient alone. Either alone suffices.", "cn": "LCM is fixed by the two numbers, and also by their product together with their highest common factor.", "sl": "Original authored item (new construction)", "t": "Data Sufficiency"}, {"id": "A-seating_arrangement-c8", "q": "Five friends A, B, C, D and E sit in a row of five chairs facing SOUTH, toward the viewer, the chairs numbered 1 to 5 from the viewer's left. E sits at the viewer's right end. C sits immediately to E's own right. B sits two chairs away from C, on C's own right side. D sits immediately to B's own left. A takes the remaining chair.\nWho sits in chair 3?", "o": ["C", "B", "A", "D"], "a": 3, "x": "Facing the viewer, a person's own right is the viewer's left and their own left is the viewer's right. E is in chair 5. C, immediately to E's own right, takes chair 4. B, two chairs away on C's own-right side, takes chair 2. D, immediately to B's own left (the viewer's right), takes chair 3. A takes chair 1. Chair 3 is D.", "cn": "When people face the viewer, their own left and right swap against the viewer's; pin the frame first.", "sl": "Original authored item (new construction)", "t": "Seating Arrangement"}, {"id": "A-seating_arrangement-c9", "q": "Five people P, Q, R, S and T stand in a queue for tickets, all facing the counter. Position 1 is at the counter (the front) and position 5 is at the back. Q stands at the back. R stands immediately in front of Q. P stands second from the front. S stands immediately behind P. T takes the remaining position.\nWho stands at the front of the queue?", "o": ["S", "R", "T", "P"], "a": 2, "x": "Q is at position 5. R, immediately in front of Q, is at 4. P, second from the front, is at 2. S, immediately behind P, is at 3. T takes the only remaining position, 1 - the front of the queue.", "cn": "A queue has a front and a back instead of left and right; pin which end is the front and walk each clue.", "sl": "Original authored item (new construction)", "t": "Seating Arrangement"}, {"id": "A-syllogism-c9", "q": "Statements: All tables are furniture. Some furniture is antique.\nConclusions:\nI. Some tables are antique.\nII. No table is antique.\nWhich conclusion(s) follow(s)?", "o": ["Both conclusions follow", "Neither conclusion follows", "Only conclusion I follows", "Only conclusion II follows"], "a": 1, "x": "The antique part of the furniture may lie entirely outside the tables, so I does not follow; and nothing rules out an antique table, so II does not follow either. Neither follows.", "cn": "A middle group that is only partly described cannot carry a conclusion across; 'all' only travels from the smaller group into the larger.", "sl": "Original authored item (new construction)", "t": "Syllogism"}, {"id": "A-syllogism-c10", "q": "Statements: All pencils are stationery. No stationery item is edible. All candies are edible.\nConclusions:\nI. No candy is a pencil.\nII. Some pencils are candies.\nWhich conclusion(s) follow(s)?", "o": ["Only conclusion II follows", "Both conclusions follow", "Neither conclusion follows", "Only conclusion I follows"], "a": 3, "x": "Pencils sit inside stationery, which excludes everything edible, and candies sit inside the edible group; so no candy can be a pencil and I follows. II says the opposite of I, so it cannot follow. Only I.", "cn": "Chained memberships combine: whatever sits inside an inner group stays outside anything the outer group excludes.", "sl": "Original authored item (new construction)", "t": "Syllogism"}, {"id": "A-syllogism-c11", "q": "Statements: No snakes are mammals. No mammals are insects.\nConclusions:\nI. No snakes are insects.\nII. Some snakes are insects.\nWhich conclusion(s) follow(s)?", "o": ["Neither conclusion follows", "Only conclusion I follows", "Only conclusion II follows", "Both conclusions follow"], "a": 0, "x": "The premises relate snakes and insects separately to the mammals: snakes lie outside the mammals, and insects lie outside the mammals. That fixes nothing between snakes and insects themselves, so neither I nor II follows.", "cn": "Two 'no' statements about a shared middle group leave the two outer groups unrelated.", "sl": "Original authored item (new construction)", "t": "Syllogism"}, {"id": "A-coding_shift-c5", "q": "In a certain code, every vowel is replaced by the next vowel in the cycle A to E to I to O to U and back to A, while every consonant stays unchanged. If CAT is written as CET in this code, how is DOG written?", "o": ["DUH", "DIG", "DUG", "DPG"], "a": 2, "x": "Only the vowel changes: O becomes U. D and G stay fixed, so DOG is written as DUG. (Check: CAT becomes CET because A becomes E.)", "cn": "This rule cycles only the vowels and leaves consonants untouched; apply it letter by letter.", "sl": "Original authored item (new construction)", "t": "Coding-Decoding"}, {"id": "A-coding_shift-c6", "q": "In a certain code, the letters of a word are swapped in adjacent pairs: the first letter swaps with the second, the third with the fourth, and so on, and an unpaired last letter stays in place. If TRAIN is coded as RTIAN, how is MANGO coded?", "o": ["GANMO", "AMGNO", "OGNAM", "AMNOG"], "a": 1, "x": "Swap the letters in pairs: (M,A) becomes AM and (N,G) becomes GN, and the last letter O stays put, so MANGO is coded as AMGNO. (Check: TRAIN becomes RT + IA + N = RTIAN.)", "cn": "This rule swaps neighbours in fixed pairs; it is neither a reversal nor a block swap.", "sl": "Original authored item (new construction)", "t": "Coding-Decoding"}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+' &middot; Source: '+esc(q.sl)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});

rv+='<div class="q"><b>'+(i+1)+'.</b> <span class="'+(ok?'ok">Correct':'bad">Wrong')+'</span><br>Answer: '+L[q.a]+". "+esc(q.o[q.a])+'<div class="qt">'+esc(q.x)+"</div>"+'<div class="tag">Source: '+esc(q.sl)+'</div>'+(q.cn?'<div class="tag">Concept: '+esc(q.cn)+'</div>':'')+"</div>"});
document.getElementById("score").textContent="Score: "+s+"/"+D.qs.length;document.getElementById("rev").innerHTML=rv;
document.getElementById("code").textContent=(D.date>="2026-10-14"?D.type:"QL")+"|"+D.id+"|"+D.type+"|L"+D.level+"|"+s+"/"+D.qs.length+"|"+a+"|"+D.date;document.getElementById("res").style.display="block";document.getElementById("sub").disabled=true;};
document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(document.getElementById("code").textContent);document.getElementById("copy").textContent="Copied"};
